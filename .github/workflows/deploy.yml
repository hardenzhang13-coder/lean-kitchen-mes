name: deploy

# 人工触发后部署到阿里云（与 docs/aliyun-deploy.md 手动流程等价：
# git pull --ff-only && docker compose up -d --build，迁移由 compose 的 migrate 服务自动执行；
# 随后灌入 scripts/dictionary-baseline.sql 做字典基线初始化（INSERT IGNORE 只增不覆盖，生产字典修改不会被部署回滚））

# 2C4G 服务器现场构建曾多次造成资源饱和。生产构建迁移到独立 CI/镜像仓库前，
# 默认只允许人工触发，避免普通 push 直接把生产拖入长时间构建。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH 到阿里云执行部署
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          port: ${{ secrets.ALIYUN_PORT || 22 }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          # 2C4G 服务器全量构建约 5-10 分钟（含首次无缓存），给足超时
          command_timeout: 40m
          script: |
            cd /opt/lean-kms-v3
            git pull --ff-only
            if [ "${{ vars.DEPLOY_DOMAIN_MODE }}" = "1" ]; then
              docker compose -f docker-compose.yml -f docker-compose.domain.yml up -d --build
            else
              docker compose up -d --build
            fi
            # 字典基线初始化（INSERT IGNORE，只增不覆盖）：仅补缺失字典，不碰生产已有数据
            docker compose exec -T db sh -c 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" lean_kms' < scripts/dictionary-baseline.sql

      - name: 健康检查
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: |
          for i in $(seq 1 30); do
            base_url="${PUBLIC_BASE_URL:-http://${{ secrets.ALIYUN_HOST }}}"
            code=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 "${base_url%/}/login" || true)
            if [ "$code" = "200" ]; then
              echo "部署完成，服务正常（HTTP 200）"
              exit 0
            fi
            sleep 10
          done
          echo "健康检查未通过，请 SSH 到服务器查看 docker compose logs web" >&2
          exit 1
