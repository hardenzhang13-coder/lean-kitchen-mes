<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>排菜 · 索引卡册定稿 Demo</title>
<style>
:root{
  --fg:#26252a;--muted:#75706a;--bd:#e7e5e0;--bd2:#d6d3cc;
  --sf:linear-gradient(180deg,#fff,#fdfcfb);--mut:linear-gradient(180deg,#fbf9f6,#f6f3ef);--body:linear-gradient(180deg,#fcfbfa,#fbf9f6);
  --hi:inset 0 1px 0 rgba(255,255,255,.8);--ins:inset 0 1px 2px rgba(15,23,42,.05);--s1:0 1px 2px rgba(15,23,42,.05);--s2:0 2px 4px rgba(15,23,42,.06),0 12px 28px rgba(15,23,42,.1);
  --pri:linear-gradient(180deg,#f0813c,#e05a1e);--soft:linear-gradient(180deg,#f7f2ea,#efe6da);--ink:#5f5245;--pb:#d8c8b5;
  --warn:#b45309;--prog:#047857;--done:#6b7280;
}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{color:var(--fg);background:#fff;font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;font-size:14px;line-height:1.5}
button,input{font:inherit;color:inherit}button{border:0;background:transparent;cursor:pointer}
.app{min-height:100dvh;display:flex}.side{position:fixed;z-index:2;inset:0 auto 0 0;width:80px;display:flex;flex-direction:column;align-items:center;padding:16px 0;background:var(--sf);border-right:1px solid var(--bd);box-shadow:var(--hi),var(--s1)}
.logo{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:#fff;font-weight:800;background:var(--pri)}.brand{margin-top:5px;font-size:12px;color:var(--muted)}.nav{margin-top:24px;display:flex;flex:1;flex-direction:column;gap:6px}.ni{width:64px;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:10px;color:var(--muted);font-size:12px;font-weight:700}.ni.on{color:#8a6a52;background:var(--soft);box-shadow:inset 0 1px 0 #fff}
.main{flex:1;min-width:0;margin-left:80px;height:100dvh;display:flex;flex-direction:column}.top{min-height:82px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 24px;background:var(--sf);border-bottom:1px solid var(--bd);box-shadow:var(--hi)}.h1{margin:0;font-size:20px;font-weight:800}.desc{margin:4px 0 0;color:var(--muted);font-size:13px}.pbtn{height:44px;padding:0 18px;display:flex;align-items:center;border-radius:10px;color:#fff;font-weight:700;background:var(--pri);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.work{flex:1;min-height:0;padding:20px 24px;background:var(--body);display:flex;flex-direction:column;gap:16px;overflow:hidden}.tools{display:flex;align-items:center;gap:8px}.search{position:relative;width:min(280px,32vw)}.search svg{position:absolute;left:12px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:#9c978f}.search input{width:100%;height:44px;padding:0 12px 0 36px;border:1px solid var(--bd2);border-radius:10px;background:#fff;box-shadow:var(--ins);outline:none}.trigger{height:44px;display:flex;align-items:center;padding:0 14px;border:1px solid var(--bd2);border-radius:10px;background:#fff;box-shadow:var(--ins)}.sp{flex:1}.skins{display:none}.skin{height:34px;padding:0 12px;border-radius:99px;color:var(--muted);font-size:13px;font-weight:700}.skin.on{color:var(--fg);background:var(--sf);box-shadow:var(--hi),var(--s1)}
.board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.col{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:var(--sf);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--hi),var(--s2)}.chead{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--bd);background:#fff;box-shadow:var(--hi)}.chead svg{width:18px;height:18px}.cname{font-size:14px;font-weight:800}.count{margin-left:auto;min-width:26px;height:22px;display:grid;place-items:center;padding:0 6px;border-radius:99px;background:#fff;border:1px solid var(--bd);color:var(--fg);font-size:12px;font-weight:800}.cbody{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--body);scrollbar-width:thin;scrollbar-color:#d9d5ce transparent}.cbody::-webkit-scrollbar{width:10px}.cbody::-webkit-scrollbar-thumb{background:#d9d5ce;border-radius:99px;border:3px solid transparent;background-clip:content-box}.cfoot{padding:10px 16px;border-top:1px solid var(--bd);background:#fff;color:var(--muted);font-size:12px;box-shadow:var(--hi)}
.card{position:relative;flex:none;min-height:262px;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--p1),var(--p2));border:1px solid var(--pbd);border-radius:7px;box-shadow:var(--hi),0 1px 2px rgba(15,23,42,.05),0 9px 20px rgba(15,23,42,.07);transition:.15s}.card:hover{transform:translateY(-1px);box-shadow:var(--hi),0 15px 28px rgba(15,23,42,.1)}
.pending{--p1:#fffdfb;--p2:#faf8f4;--pbd:#dedbd3;--phv:#cbc7bf;--head:#33302b;--dbg:#f6f4f0;--dbd:#dfdad2;--dink:#6d675f;--row:#e7e4dd;--body:#59544d;--edge:#f8f6f2}
.progress{--p1:#fdfdfc;--p2:#f7f7f5;--pbd:#dbdad6;--phv:#c8c6c1;--head:#33322f;--dbg:#f5f5f2;--dbd:#dedcd7;--dink:#65625d;--row:#e6e5e1;--body:#575551;--edge:#f7f6f4}
.done{--p1:#f8f8f6;--p2:#efefec;--pbd:#d8d6d1;--phv:#c3c1bc;--head:#565450;--dbg:#f2f2ef;--dbd:#d9d7d2;--dink:#6d6b67;--row:#e2e0dc;--body:#61605c;--edge:#f0efec}
.margin,.edge,.fold,.tab{display:none}.main-area{flex:1;min-height:0;padding:14px 15px 8px 17px;display:flex;flex-direction:column}.head{display:grid;grid-template-columns:minmax(0,1fr) 68px;gap:12px;align-items:center}.label{display:block;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.12em}.store{margin:3px 0 0;color:var(--head);font-size:20px;line-height:1.15;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.datebox{height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;background:var(--dbg);border:1px solid var(--dbd);box-shadow:var(--hi),var(--s1);color:var(--dink)}.datebox b{font-size:22px;line-height:1;font-weight:800}.datebox span{margin-top:3px;font-size:11px;font-weight:700}.dishes{flex:1;min-height:0;margin-top:10px}.dish{height:31px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;border-bottom:1px solid var(--row)}.dish:nth-child(n+4){display:none}.card.expanded .dish{display:grid}.dn{color:var(--body);font-size:13px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dq{color:var(--head);font-size:13px;font-weight:800}.dq small{margin-left:2px;color:var(--muted);font-size:12px}.more{height:30px;display:flex;align-items:center;justify-content:space-between}.mtext{color:var(--muted);font-size:12px;font-weight:600}.expand{height:24px;padding:0 7px;border-radius:6px;color:#77695a;font-size:12px;font-weight:700}.expand:hover{background:#f4f0ea}.foot{min-height:52px;padding:8px 13px;border-top:1px solid var(--row);background:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:space-between;box-shadow:var(--hi)}.sum{color:#6d675f;font-size:12px;font-weight:700}.sum b{color:var(--head);font-size:16px}.acts{display:flex;gap:6px}.btn{height:30px;padding:0 9px;border-radius:8px;display:flex;align-items:center;font-size:12px;font-weight:700}.line{background:var(--sf);border:1px solid var(--bd2);box-shadow:var(--hi),var(--s1)}.primary{color:var(--ink);background:var(--soft);border:1px solid var(--pb);box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 1px 3px rgba(120,94,62,.1)}.line:hover{background:#f6f3ef}.line:active,.primary:active{transform:translateY(1px)}
/* 1 撕边档案卡 */
.board[data-skin=a] .edge{display:block;height:9px;background:var(--edge);clip-path:polygon(0 0,100% 0,100% 35%,96% 100%,91% 38%,86% 92%,80% 35%,74% 100%,68% 38%,62% 90%,55% 35%,49% 100%,43% 38%,37% 92%,31% 35%,25% 100%,19% 38%,13% 92%,7% 35%,0 100%)}.board[data-skin=a] .card{border-radius:5px}
/* 2 索引卡册 */
.board[data-skin=b] .tab{display:block;position:absolute;top:-12px;left:22px;width:112px;height:18px;border:1px solid #bfdacd;border-bottom:0;border-radius:7px 7px 0 0;background:linear-gradient(180deg,#f2faf5,#e2f1e8);box-shadow:inset 0 1px 0 rgba(255,255,255,.86),0 2px 5px rgba(31,72,49,.08)}.board[data-skin=b] .card{border-radius:10px;margin-top:10px}.board[data-skin=b] .head{padding:10px;background:linear-gradient(180deg,#f5fbf7,#ebf5ef);border:1px solid #cdddd3;border-radius:8px}.board[data-skin=b] .datebox{background:rgba(255,255,255,.82);border-color:#cdddd3}
/* 3 折角软抄 */
.board[data-skin=c] .margin{display:block;position:absolute;left:34px;top:45px;bottom:52px;width:1px;background:rgba(160,152,138,.28)}.board[data-skin=c] .main-area{padding-left:44px}.board[data-skin=c] .fold{display:block;position:absolute;right:0;bottom:0;width:24px;height:24px;background:linear-gradient(135deg,rgba(255,255,255,0) 46%,rgba(170,162,150,.2) 48%,rgba(255,255,255,.65) 100%);border-left:1px solid rgba(255,255,255,.55);box-shadow:-3px -3px 7px rgba(15,23,42,.04)}.board[data-skin=c] .card{border-radius:7px}
@media(max-width:1120px){.board{grid-template-columns:repeat(2,minmax(0,1fr));overflow:auto}.work{overflow:auto}}@media(max-width:780px){.side{display:none}.main{margin-left:0}.board{grid-template-columns:1fr}.tools{flex-wrap:wrap}.search{width:100%}.sp{display:none}}
</style>
</head><body><div class="app"><aside class="side"><div><div class="logo">厨</div><div class="brand">精益厨房</div></div><nav class="nav"><button>工作台</button><button class="ni on">排菜</button><button>生产</button><button>采购</button><button>库存</button></nav></aside><main class="main"><header class="top"><div><h1 class="h1">排菜</h1><p class="desc">门店按售卖日期排菜品与份数；确认后进入进行中，由切配中心汇总成生产计划单</p></div><button class="pbtn">去排菜</button></header><div class="work"><div class="tools"><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input placeholder="搜索门店..."></div><button class="trigger">11月24日</button><button class="trigger">全部门店</button><div class="sp"></div><div class="skins"><button class="skin on" data-skin="a">撕边档案卡</button><button class="skin" data-skin="b">索引卡册</button><button class="skin" data-skin="c">折角软抄</button></div></div><section class="board" id="board" data-skin="b"></section></div></main></div><script>
var cols=[{k:'pending',n:'待生效',c:'var(--warn)',h:'待确认，可改可删',i:'M12 7v5l3 2',cards:[{s:'新金食堂',d:'24',m:'11月 · 周二',q:[['红烧肉',20],['番茄炒蛋',16],['清炒时蔬',12],['蒜蓉西兰花',8],['干煸豆角',6]],t:8,qy:56,a:[['改菜单','line'],['确认生产','primary']]},{s:'社区二店',d:'24',m:'11月 · 周二',q:[['酱香排骨',12],['干锅花菜',10],['麻婆豆腐',10],['清炒时蔬',8]],t:5,qy:32,a:[['改菜单','line'],['确认生产','primary']]},{s:'团餐食堂',d:'24',m:'11月 · 周二',q:[['卤鸡腿',24],['土豆烧牛腩',18],['清蒸鲈鱼',16],['蒜蓉菠菜',12]],t:14,qy:96,a:[['改菜单','line'],['确认生产','primary']]}]},{k:'progress',n:'进行中',c:'var(--prog)',h:'已确认，等待切配入库',i:'M10 8.5v7l6-3.5z',cards:[{s:'社区二店',d:'24',m:'11月 · 周二',q:[['酱香排骨',18],['清蒸鲈鱼',16],['干锅花菜',14],['麻婆豆腐',12]],t:12,qy:78,a:[['查看生产','primary']]},{s:'新金食堂',d:'23',m:'11月 · 周一',q:[['红烧肉',12],['蒜蓉西兰花',8],['酸辣土豆丝',6],['番茄炒蛋',6]],t:9,qy:48,a:[['查看生产','primary']]},{s:'团餐食堂',d:'23',m:'11月 · 周一',q:[['卤鸡腿',32],['土豆烧牛腩',24],['蒜蓉菠菜',20],['红烧茄子',16]],t:18,qy:132,a:[['查看生产','primary']]}]},{k:'done',n:'已完成',c:'var(--done)',h:'已入库，仅可查看',i:'m8 12.5 3 3 5-6',cards:[{s:'团餐食堂',d:'23',m:'11月 · 周一',q:[['卤鸡腿',38],['土豆烧牛腩',26],['蒜蓉菠菜',18],['红烧茄子',14]],t:15,qy:120,a:[['查看详情','primary']]},{s:'社区二店',d:'22',m:'11月 · 周日',q:[['干锅花菜',16],['麻婆豆腐',12],['清炒时蔬',10],['番茄蛋汤',8]],t:10,qy:58,a:[['查看详情','primary']]},{s:'新金食堂',d:'22',m:'11月 · 周日',q:[['红烧肉',14],['番茄炒蛋',12],['蒜蓉西兰花',8],['清炒时蔬',6]],t:11,qy:64,a:[['查看详情','primary']]}]}];
var b=document.getElementById('board');cols.forEach(function(c){var x=document.createElement('section');x.className='col';x.innerHTML='<header class="chead"><svg style="color:'+c.c+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="'+c.i+'"/></svg><span class="cname" style="color:'+c.c+'">'+c.n+'</span><span class="count">'+c.cards.length+'</span></header><div class="cbody"></div><footer class="cfoot">'+c.h+'</footer>';var y=x.querySelector('.cbody');c.cards.forEach(function(v){var n=document.createElement('article');n.className='card '+c.k;var rows='';v.q.forEach(function(d){rows+='<div class="dish"><span class="dn">'+d[0]+'</span><span class="dq">'+d[1]+'<small>份</small></span></div>'});var acts='';v.a.forEach(function(d){acts+='<button class="btn '+d[1]+'">'+d[0]+'</button>'});n.innerHTML='<span class="tab"></span><span class="margin"></span><div class="main-area"><div class="head"><div><span class="label">门店</span><h2 class="store">'+v.s+'</h2></div><div class="datebox"><b>'+v.d+'</b><span>'+v.m+'</span></div></div><div class="dishes">'+rows+'</div><div class="more"><span class="mtext">还有 '+(v.q.length-3)+' 道</span><button class="expand">查看更多</button></div></div><div class="foot"><span class="sum"><b>'+v.t+'</b> 菜 / <b>'+v.qy+'</b> 份</span><span class="acts">'+acts+'</span></div><span class="edge"></span><span class="fold"></span>';n.querySelector('.expand').onclick=function(){n.classList.toggle('expanded');this.textContent=n.classList.contains('expanded')?'收起':'查看更多'};y.appendChild(n)});b.appendChild(x)});document.querySelectorAll('.skin').forEach(function(s){s.onclick=function(){document.querySelectorAll('.skin').forEach(function(t){t.classList.toggle('on',t===s)});b.dataset.skin=s.dataset.skin}});var q=new URLSearchParams(location.search).get('skin');if(q&&document.querySelector('.skin[data-skin="'+q+'"]'))document.querySelector('.skin[data-skin="'+q+'"]').click();
</script></body></html>
