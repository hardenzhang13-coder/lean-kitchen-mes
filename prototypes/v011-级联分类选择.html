<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>V011 · 双栏级联分类选择 demo</title>
<style>
  :root {
    --sk-shadow-1: 0 1px 2px rgba(15,23,42,.05);
    --sk-shadow-3: 0 4px 8px rgba(15,23,42,.08), 0 24px 48px rgba(15,23,42,.14);
    --sk-highlight-top: inset 0 1px 0 rgba(255,255,255,.80);
    --sk-inset: inset 0 1px 2px rgba(15,23,42,.05);
    --sk-border: #e7e5e0;
    --sk-border-strong: #d6d3cc;
    --sk-surface: linear-gradient(180deg,#fff 0%,#fdfcfb 100%);
    --sk-surface-muted: linear-gradient(180deg,#fbf9f6 0%,#f6f3ef 100%);
    --sk-primary-to: #e05a1e;
    --sk-primary-ink: #c2410c;
    --sk-primary-soft: linear-gradient(180deg,#fbeee5 0%,#fbe7dc 100%);
    --sk-primary-shadow: 0 1px 2px rgba(194,65,12,.40), 0 4px 10px rgba(234,88,12,.22);
    --ink: #292524;
    --muted: #78716c;
    --ring: rgba(249,115,22,.30);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f4f1ec;
    color: var(--ink);
    min-height: 100vh;
    padding: 48px 24px;
  }
  .stage { max-width: 1200px; margin: 0 auto; }
  .demo-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .demo-desc { color: var(--muted); font-size: 13px; margin-bottom: 24px; }

  /* ===== 模拟「新建原料」弹窗（业务上下文） ===== */
  .ctx-overlay {
    position: fixed; inset: 0; background: rgba(28,25,23,.35);
    display: none; align-items: center; justify-content: center; z-index: 40;
  }
  .ctx-overlay.show { display: flex; }
  .ctx-dialog {
    width: 760px; max-width: calc(100vw - 32px); border-radius: 16px;
    background: var(--sk-surface); box-shadow: var(--sk-shadow-3);
    border: 1px solid var(--sk-border);
    overflow: hidden;
  }
  .ctx-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; border-bottom: 1px solid var(--sk-border);
    font-weight: 600; font-size: 15px;
    background: linear-gradient(180deg,#fff, #faf8f5);
  }
  .ctx-body { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .field label .req { color: var(--sk-primary-ink); margin-left: 2px; }
  .fake-input {
    height: 44px; border-radius: 10px; border: 1px solid var(--sk-border-strong);
    background: #fff; box-shadow: var(--sk-inset);
    display: flex; align-items: center; padding: 0 14px; font-size: 14px; color: var(--muted);
  }
  .ctx-foot {
    display: flex; justify-content: flex-end; gap: 10px;
    padding: 14px 20px; border-top: 1px solid var(--sk-border);
    background: linear-gradient(180deg,#faf8f5,#f6f3ef);
  }
  .btn {
    height: 36px; padding: 0 18px; border-radius: 10px; font-size: 14px;
    border: 1px solid var(--sk-border-strong); background: var(--sk-surface);
    box-shadow: var(--sk-highlight-top), var(--sk-shadow-1);
    cursor: pointer; color: var(--ink); font-weight: 500;
  }
  .btn:active { box-shadow: var(--sk-inset); }
  .btn-primary {
    border: none; color: #fff;
    background: linear-gradient(180deg,#f0813c,var(--sk-primary-to));
    box-shadow: var(--sk-primary-shadow);
  }

  /* ===== 级联字段（合并为一个「食材分类」字段） ===== */
  .cascade-field {
    height: 44px; width: 100%; border-radius: 10px;
    border: 1px solid var(--sk-border-strong); background: #fff;
    box-shadow: var(--sk-inset);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 14px; font-size: 14px; cursor: pointer; text-align: left;
    font-family: inherit; color: var(--ink);
  }
  .cascade-field:hover { border-color: #c8c4bc; }
  .cascade-field:focus-visible { outline: 2px solid var(--ring); border-color: #f97316; }
  .cascade-field .ph { color: #a8a29e; }
  .cascade-field .chev { color: var(--muted); transition: transform .15s; }
  .cascade-field.open .chev { transform: rotate(180deg); }

  /* ===== 双栏级联弹窗 ===== */
  .cas-overlay {
    position: fixed; inset: 0; background: rgba(28,25,23,.45);
    display: none; align-items: center; justify-content: center; z-index: 50;
  }
  .cas-overlay.show { display: flex; }
  .cas-dialog {
    width: 640px; max-width: calc(100vw - 32px); border-radius: 16px;
    background: var(--sk-surface); border: 1px solid var(--sk-border);
    box-shadow: var(--sk-shadow-3); overflow: hidden;
    animation: pop .16s ease-out;
  }
  @keyframes pop { from { transform: scale(.97) translateY(6px); opacity: 0; } }
  .cas-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; font-weight: 600; font-size: 15px;
    border-bottom: 1px solid var(--sk-border);
    background: linear-gradient(180deg,#fff,#faf8f5);
  }
  .cas-head .x { border: none; background: none; cursor: pointer; color: var(--muted); font-size: 18px; line-height: 1; padding: 4px 6px; border-radius: 8px; }
  .cas-head .x:hover { background: #f5f5f4; color: var(--ink); }

  .cas-body { display: grid; grid-template-columns: 200px 1fr; height: 340px; }
  .cas-l1 {
    border-right: 1px solid var(--sk-border);
    background: var(--sk-surface-muted);
    overflow-y: auto; padding: 8px;
  }
  .cas-l1 button {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; border-radius: 10px; border: none; background: none;
    font-size: 14px; cursor: pointer; color: var(--ink); text-align: left;
    font-family: inherit; margin-bottom: 2px;
  }
  .cas-l1 button:hover { background: rgba(255,255,255,.75); }
  .cas-l1 button.active {
    background: var(--sk-primary-soft); color: var(--sk-primary-ink); font-weight: 600;
    box-shadow: var(--sk-inset);
  }
  .cas-l1 button.active::after {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--sk-primary-to);
  }
  .cas-l2 { padding: 14px; overflow-y: auto; background: #fff; }
  .cas-l2 .l2-title { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .cas-l2 .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tile {
    position: relative; border-radius: 10px; border: 1px solid var(--sk-border-strong);
    padding: 10px 12px; font-size: 14px; cursor: pointer; text-align: left;
    background: var(--sk-surface); box-shadow: var(--sk-highlight-top), var(--sk-shadow-1);
    font-family: inherit; color: var(--ink);
    display: flex; align-items: center; justify-content: space-between;
  }
  .tile:hover { border-color: #f97316aa; }
  .tile.active {
    border-color: var(--sk-primary-to); color: var(--sk-primary-ink); font-weight: 600;
    background: var(--sk-primary-soft);
    box-shadow: var(--sk-primary-shadow);
  }
  .tile.active::after { content: "✓"; font-size: 13px; }

  .cas-foot {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px; border-top: 1px solid var(--sk-border);
    background: linear-gradient(180deg,#faf8f5,#f6f3ef);
  }
  .cas-foot .path { font-size: 13px; color: var(--muted); }
  .cas-foot .path b { color: var(--sk-primary-ink); font-weight: 600; }
  .cas-foot .btns { display: flex; gap: 10px; }

  /* 说明卡 */
  .notes { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-top: 28px; }
  .note {
    border: 1px solid var(--sk-border); border-radius: 12px; padding: 14px 16px;
    background: var(--sk-surface); box-shadow: var(--sk-highlight-top), var(--sk-shadow-1);
    font-size: 13px; color: var(--muted); line-height: 1.7;
  }
  .note b { color: var(--ink); display: block; margin-bottom: 4px; font-size: 14px; }
</style>
</head>
<body>
<div class="stage">
  <div class="demo-title">V011 · 双栏级联分类选择</div>
  <div class="demo-desc">点击「打开新建原料弹窗」→ 点击「食材分类」字段体验。要点：单字段、单弹窗、两级同屏，不再弹窗叠弹窗。</div>

  <button class="btn btn-primary" onclick="document.getElementById('ctx').classList.add('show')">打开新建原料弹窗</button>

  <div class="notes">
    <div class="note"><b>① 合并字段</b>表单里「一级分类 / 二级分类」两个字段合并为一个「食材分类」，回填格式：蔬菜 / 叶菜类。</div>
    <div class="note"><b>② 单弹窗两级</b>左栏点一级、右栏即时刷新二级磁贴；点二级即选中，底部路径栏同步显示，确定后关闭。</div>
    <div class="note"><b>③ 兼容查看态</b>查看态直接只读展示「蔬菜 / 叶菜类」，无选择入口；切换一级自动清空二级。</div>
  </div>
</div>

<!-- 业务上下文：新建原料弹窗 -->
<div class="ctx-overlay" id="ctx" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="ctx-dialog">
    <div class="ctx-head"><span>新建原料</span><button class="x" onclick="document.getElementById('ctx').classList.remove('show')">✕</button></div>
    <div class="ctx-body">
      <div class="field"><label>食材名称<span class="req">*</span></label><div class="fake-input">如 带皮五花肉</div></div>
      <div class="field"><label>品牌名称</label><div class="fake-input">选填</div></div>
      <div class="field">
        <label>食材分类<span class="req">*</span></label>
        <button class="cascade-field" id="casField" onclick="openCas()">
          <span id="casValue" class="ph">请选择</span>
          <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </div>
      <div class="field"><label>采购规格</label><div class="fake-input">如 20kg/箱</div></div>
    </div>
    <div class="ctx-foot">
      <button class="btn" onclick="document.getElementById('ctx').classList.remove('show')">取消</button>
      <button class="btn btn-primary">保存</button>
    </div>
  </div>
</div>

<!-- 双栏级联弹窗 -->
<div class="cas-overlay" id="cas">
  <div class="cas-dialog">
    <div class="cas-head"><span>选择食材分类</span><button class="x" onclick="closeCas()">✕</button></div>
    <div class="cas-body">
      <div class="cas-l1" id="l1List"></div>
      <div class="cas-l2">
        <div class="l2-title" id="l2Title">选择二级分类</div>
        <div class="tiles" id="l2Tiles"></div>
      </div>
    </div>
    <div class="cas-foot">
      <div class="path" id="pathBar">已选：<b id="pathText">未选择</b></div>
      <div class="btns">
        <button class="btn" onclick="closeCas()">取消</button>
        <button class="btn btn-primary" id="okBtn" onclick="confirmCas()">确定</button>
      </div>
    </div>
  </div>
</div>

<script>
const DATA = [
  { l1: "蔬菜", l2: ["叶菜类","根茎类","茄果类","菌菇类","葱蒜类","瓜果类"] },
  { l1: "畜禽肉", l2: ["猪肉类","牛肉类","禽肉类","羊肉类","蛋类"] },
  { l1: "水产", l2: ["淡水鱼","海水鱼","虾蟹类","贝类"] },
  { l1: "香辛料", l2: ["调味香料","香辛鲜料"] },
  { l1: "粮油干货", l2: ["米面粮油","干杂豆类","粉面制品"] },
  { l1: "冻品", l2: ["冷冻肉类","冷冻水产","冷冻面点"] },
];
let selL1 = 0, selL2 = null, committed = null;

function openCas() {
  document.getElementById('cas').classList.add('show');
  document.getElementById('casField').classList.add('open');
  renderL1(); renderL2();
}
function closeCas() {
  document.getElementById('cas').classList.remove('show');
  document.getElementById('casField').classList.remove('open');
}
function renderL1() {
  document.getElementById('l1List').innerHTML = DATA.map((d, i) =>
    `<button class="${i===selL1?'active':''}" onclick="pickL1(${i})">${d.l1}</button>`).join('');
}
function renderL2() {
  document.getElementById('l2Title').textContent = DATA[selL1].l1 + ' · 选择二级分类';
  document.getElementById('l2Tiles').innerHTML = DATA[selL1].l2.map((n, i) =>
    `<button class="tile ${i===selL2?'active':''}" onclick="pickL2(${i})">${n}</button>`).join('');
  updatePath();
}
function pickL1(i) { selL1 = i; selL2 = null; renderL1(); renderL2(); }
function pickL2(i) { selL2 = i; renderL2(); }
function updatePath() {
  const t = document.getElementById('pathText');
  t.textContent = selL2 != null ? `${DATA[selL1].l1} / ${DATA[selL1].l2[selL2]}` : `${DATA[selL1].l1} / 未选择二级`;
}
function confirmCas() {
  if (selL2 == null) { alert('请选择二级分类'); return; }
  committed = `${DATA[selL1].l1} / ${DATA[selL1].l2[selL2]}`;
  const v = document.getElementById('casValue');
  v.textContent = committed; v.classList.remove('ph');
  closeCas();
}
document.getElementById('cas').addEventListener('click', e => { if (e.target.id === 'cas') closeCas(); });
</script>
</body>
</html>
