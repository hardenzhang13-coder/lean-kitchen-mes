<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>净菜库存管理 v001 · 精益厨房</title>
<style>
:root{
  --primary:#6366f1; --primary-hover:#4f46e5; --primary-bg:#eef2ff;
  --bg:#f8fafc; --card:#ffffff; --border:#e2e8f0;
  --text:#0f172a; --muted:#64748b;
  --success:#16a34a; --success-bg:#f0fdf4;
  --warning:#d97706; --warning-bg:#fffbeb;
  --danger:#dc2626; --danger-bg:#fef2f2;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
.app{display:flex;min-height:100vh}
.side{width:80px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:12px 0;position:sticky;top:0;height:100vh}
.brand{width:44px;height:44px;border-radius:10px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:16px}
.brand-name{font-size:10px;color:var(--muted);margin-bottom:16px}
.nav-item{width:64px;height:64px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:var(--muted);margin-bottom:6px;border:none;background:none;font-size:11px}
.nav-item .ico{font-size:18px}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{background:var(--primary-bg);color:var(--primary);font-weight:600}
.main{flex:1;padding:24px 32px;max-width:1280px}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.page-head h1{font-size:20px;font-weight:700}
.page-head .sub{color:var(--muted);font-size:13px;margin-top:4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px}
.tab{padding:8px 16px;border:none;background:none;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi .label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .value{font-size:24px;font-weight:700;margin-top:6px}
.kpi .value small{font-size:13px;color:var(--muted);font-weight:400;margin-left:4px}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar .spacer{flex:1}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:8px;padding:6px 12px;background:#fff;min-width:220px}
.search input{border:none;outline:none;font-size:13px;flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 12px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:13px;cursor:pointer;color:var(--muted)}
.chip.active{background:var(--primary-bg);border-color:var(--primary);color:var(--primary);font-weight:600}
.tbl-wrap{border:1px solid var(--border);border-radius:10px;overflow-x:auto;background:#fff}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:#f8fafc;padding:10px 12px;text-align:left;font-weight:600;color:var(--muted);white-space:nowrap;border-bottom:1px solid var(--border)}
.tbl td{padding:10px 12px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#fafafc}
.td-num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--muted)}
.group-cell{font-weight:600;background:#f8fafc !important}
.group-cell2{color:var(--muted);background:#fbfcfe !important}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.badge.gray{background:#f1f5f9;color:var(--muted)}
.badge.green{background:var(--success-bg);color:var(--success)}
.badge.orange{background:var(--warning-bg);color:var(--warning)}
.badge.red{background:var(--danger-bg);color:var(--danger)}
.badge.indigo{background:var(--primary-bg);color:var(--primary)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer;border:1px solid transparent;background:var(--primary);color:#fff;font-weight:500}
.btn:hover{background:var(--primary-hover)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.outline{background:#fff;border-color:var(--border);color:var(--text)}
.btn.outline:hover{background:var(--bg)}
.btn.ghost{background:none;color:var(--muted)}
.btn.ghost:hover{background:var(--bg);color:var(--text)}
.btn.danger{background:var(--danger)}
.btn.danger:hover{background:#b91c1c}
.btn.sm{padding:5px 12px;font-size:12px}
.input,select.input,textarea.input{border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:13px;outline:none;background:#fff;font-family:inherit}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.input.w80{width:80px;text-align:right}
.input.err{border-color:var(--danger);box-shadow:0 0 0 3px rgba(220,38,38,.12)}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:48px 16px;overflow-y:auto}
.dialog{background:#fff;border-radius:14px;width:100%;max-width:1200px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.dialog.small{max-width:520px}
.dialog .tbl td{white-space:nowrap}
.seg button.on-hold{background:#f1f5f9;color:var(--muted);font-weight:600}
.dialog h3{font-size:16px;margin-bottom:4px}
.dialog .d-sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{padding:5px 14px;font-size:12px;border:none;background:#fff;cursor:pointer;color:var(--muted)}
.seg button.on-done{background:var(--success-bg);color:var(--success);font-weight:600}
.seg button.on-undone{background:var(--danger-bg);color:var(--danger);font-weight:600}
.summary{display:flex;gap:20px;align-items:center;background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin:14px 0;font-size:13px;flex-wrap:wrap}
.summary b{font-size:16px}
.steps{display:flex;gap:8px;align-items:center;margin-bottom:18px;font-size:13px}
.step{display:flex;align-items:center;gap:6px;color:var(--muted)}
.step .n{width:22px;height:22px;border-radius:50%;background:#e2e8f0;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.step.active{color:var(--primary);font-weight:600}
.step.active .n{background:var(--primary);color:#fff}
.step.done .n{background:var(--success-bg);color:var(--success)}
.step-line{width:32px;height:1px;background:var(--border)}
.pick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pick{border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;background:#fff}
.pick:hover{border-color:var(--primary)}
.pick.sel{border-color:var(--primary);background:var(--primary-bg);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.pick .t{font-weight:600;margin-bottom:4px}
.pick .m{font-size:12px;color:var(--muted);line-height:1.7}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--primary-bg);border:1px solid #c7d2fe;border-radius:10px;padding:12px 16px;font-size:13px;margin-bottom:16px;line-height:1.8}
.banner b{color:var(--primary)}
.empty{text-align:center;padding:60px 0;color:var(--muted)}
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 22px;border-radius:10px;font-size:13px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.doc-head{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.doc-head .cell{background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:10px 14px}
.doc-head .cell .k{font-size:12px;color:var(--muted);margin-bottom:4px}
.doc-head .cell .v{font-weight:600}
.danger-text{color:var(--danger)}
.link{color:var(--primary);cursor:pointer;font-weight:500}
.link:hover{text-decoration:underline}
.row-red td{background:var(--danger-bg) !important}
.row-orange td{background:var(--warning-bg) !important}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mb8{margin-bottom:8px}.mb16{margin-bottom:16px}
.muted{color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer;margin-bottom:12px;font-size:13px}
.back:hover{color:var(--text)}
#print-root{display:none}
@media print{
  .app{display:none}
  #print-root{display:block;font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;padding:24px}
  #print-root h1{font-size:20px;margin-bottom:16px}
}
@media (max-width:900px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .pick-grid{grid-template-columns:1fr}
  .doc-head{grid-template-columns:1fr 1fr}
  .main{padding:16px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">🍳</div>
    <div class="brand-name">精益厨房</div>
    <button class="nav-item" onclick="nav('todo')"><span class="ico">⊞</span>工作台</button>
    <button class="nav-item" id="nav-schedule" onclick="nav('schedule')"><span class="ico">📋</span>排程</button>
    <button class="nav-item" onclick="nav('todo')"><span class="ico">🛒</span>采购</button>
    <button class="nav-item" id="nav-inventory" onclick="nav('stock')"><span class="ico">📦</span>库存</button>
    <button class="nav-item" onclick="nav('todo')"><span class="ico">🍽️</span>菜品</button>
    <button class="nav-item" onclick="nav('todo')"><span class="ico">🥬</span>食材</button>
    <button class="nav-item" onclick="nav('todo')"><span class="ico">📖</span>字典</button>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="dialog-root"></div>
<div id="toast-root"></div>
<div id="print-root"></div>

<script>
/* ==================== 模拟数据 ==================== */
const TODAY = "2026-11-10";
const stores = [
  {id:1, name:"华阳店", code:"ST-0001"},
  {id:2, name:"天府三街店", code:"ST-0002"},
  {id:3, name:"春熙路店", code:"ST-0003"},
];
const schedules = [
  {id:1, code:"SCH-20261110-001", storeId:1, date:"2026-11-10", status:"进行中", title:"11月10日 华阳店午晚市", dishes:5, portions:86, operator:"张浩浩"},
  {id:2, code:"SCH-20261110-002", storeId:2, date:"2026-11-10", status:"进行中", title:"11月10日 天府三街店午市", dishes:2, portions:38, operator:"张浩浩"},
  {id:3, code:"SCH-20261109-003", storeId:1, date:"2026-11-09", status:"已完成", title:"11月9日 华阳店午晚市", dishes:4, portions:64, operator:"张浩浩"},
];
/* 切配工单：sourceType net=净料 minor=小料 */
const cuttingOrders = [
  {id:101, scheduleId:1, sourceType:"net",   code:"NET-0003", name:"猪里脊丝", l1:"畜肉", l2:"猪肉",   spec:"250g/份", requiredQty:5250, portionsText:"21 份",      status:"pending", completedQty:null, remark:""},
  {id:102, scheduleId:1, sourceType:"net",   code:"NET-0007", name:"鸡腿肉丁", l1:"禽肉", l2:"鸡肉",   spec:"250g/份", requiredQty:4000, portionsText:"16 份",      status:"pending", completedQty:null, remark:""},
  {id:103, scheduleId:1, sourceType:"net",   code:"NET-0012", name:"鲈鱼片",   l1:"水产", l2:"淡水鱼", spec:"300g/份", requiredQty:1800, portionsText:"6 份",       status:"pending", completedQty:null, remark:""},
  {id:104, scheduleId:1, sourceType:"net",   code:"NET-0018", name:"青红椒丝", l1:"蔬菜", l2:"椒类",   spec:"—",       requiredQty:2400, portionsText:"零配 2400g", status:"pending", completedQty:null, remark:""},
  {id:105, scheduleId:1, sourceType:"minor", code:"SML-0002", name:"蒜末",     l1:"蔬菜", l2:"葱蒜",   spec:"切末",    requiredQty:600,  portionsText:"—",          status:"pending", completedQty:null, remark:""},
  {id:106, scheduleId:1, sourceType:"minor", code:"SML-0005", name:"姜片",     l1:"蔬菜", l2:"葱蒜",   spec:"切片",    requiredQty:400,  portionsText:"—",          status:"pending", completedQty:null, remark:""},
  {id:201, scheduleId:2, sourceType:"net",   code:"NET-0003", name:"猪里脊丝", l1:"畜肉", l2:"猪肉",   spec:"250g/份", requiredQty:2500, portionsText:"10 份",      status:"pending", completedQty:null, remark:""},
  {id:202, scheduleId:2, sourceType:"minor", code:"SML-0002", name:"蒜末",     l1:"蔬菜", l2:"葱蒜",   spec:"切末",    requiredQty:300,  portionsText:"—",          status:"pending", completedQty:null, remark:""},
  {id:301, scheduleId:3, sourceType:"net",   code:"NET-0003", name:"猪里脊丝", l1:"畜肉", l2:"猪肉",   spec:"250g/份", requiredQty:5250, portionsText:"21 份",      status:"completed", completedQty:5250, remark:"", completedAt:"2026-11-09 15:32"},
  {id:302, scheduleId:3, sourceType:"minor", code:"SML-0002", name:"蒜末",     l1:"蔬菜", l2:"葱蒜",   spec:"切末",    requiredQty:500,  portionsText:"—",          status:"completed", completedQty:500,  remark:"", completedAt:"2026-11-09 15:32"},
];
/* 净菜当前库存（g，汇总余额） key: sourceType:code */
let stock = {
  "net:NET-0003": 3750, "net:NET-0007": 2600, "net:NET-0012": 2100,
  "net:NET-0018": 900, "minor:SML-0002": 1600, "minor:SML-0005": 700,
};
/* 台账（新事件置顶） */
let ledger = [
  {t:"2026-11-10 09:12", type:"stock_in", l1:"蔬菜", l2:"葱蒜", code:"SML-0002", name:"蒜末", change:800, balance:1600, source:"生产入库 / SCH-20261109-003（第 2 批）", operator:"张浩浩"},
  {t:"2026-11-09 16:05", type:"stock_out", l1:"蔬菜", l2:"葱蒜", code:"SML-0002", name:"蒜末", change:500, balance:800, source:"出库单 OUT-20261109-001", operator:"张浩浩"},
  {t:"2026-11-09 16:05", type:"stock_out", l1:"畜肉", l2:"猪肉", code:"NET-0003", name:"猪里脊丝", change:5000, balance:3750, source:"出库单 OUT-20261109-001", operator:"张浩浩"},
  {t:"2026-11-09 15:32", type:"stock_in", l1:"蔬菜", l2:"葱蒜", code:"SML-0002", name:"蒜末", change:500, balance:1300, source:"生产入库 / SCH-20261109-003", operator:"张浩浩"},
  {t:"2026-11-09 15:32", type:"stock_in", l1:"畜肉", l2:"猪肉", code:"NET-0003", name:"猪里脊丝", change:5250, balance:8750, source:"生产入库 / SCH-20261109-003", operator:"张浩浩"},
  {t:"2026-11-09 09:40", type:"stock_in", l1:"水产", l2:"淡水鱼", code:"NET-0012", name:"鲈鱼片", change:2100, balance:2100, source:"生产入库 / SCH-20261108-002", operator:"张浩浩"},
  {t:"2026-11-09 09:40", type:"stock_in", l1:"禽肉", l2:"鸡肉", code:"NET-0007", name:"鸡腿肉丁", change:2600, balance:2600, source:"生产入库 / SCH-20261108-002", operator:"张浩浩"},
  {t:"2026-11-08 10:00", type:"stock_in", l1:"蔬菜", l2:"椒类", code:"NET-0018", name:"青红椒丝", change:900, balance:900, source:"期初结余建账", operator:"系统"},
  {t:"2026-11-08 10:00", type:"stock_in", l1:"蔬菜", l2:"葱蒜", code:"SML-0005", name:"姜片", change:700, balance:700, source:"期初结余建账", operator:"系统"},
  {t:"2026-11-08 10:00", type:"stock_in", l1:"蔬菜", l2:"葱蒜", code:"SML-0002", name:"蒜末", change:800, balance:800, source:"期初结余建账", operator:"系统"},
  {t:"2026-11-08 10:00", type:"stock_in", l1:"畜肉", l2:"猪肉", code:"NET-0003", name:"猪里脊丝", change:3500, balance:3500, source:"期初结余建账", operator:"系统"},
];
/* 出库单 */
let outbounds = [
  {id:1, code:"OUT-20261109-001", scheduleId:3, storeId:1, scheduleCode:"SCH-20261109-003", scheduleDate:"2026-11-09",
   status:"confirmed", operator:"张浩浩", createdAt:"2026-11-09 16:05", remark:"晚市补货",
   items:[
     {sourceType:"net", code:"NET-0003", name:"猪里脊丝", l1:"畜肉", l2:"猪肉", spec:"250g/份", portionsText:"21 份", requiredQty:5250, availableQty:8750, shippedQty:5000, prepStatus:"normal"},
     {sourceType:"minor", code:"SML-0002", name:"蒜末", l1:"蔬菜", l2:"葱蒜", spec:"切末", portionsText:"—", requiredQty:500, availableQty:1300, shippedQty:500, prepStatus:"normal"},
   ]},
];
let seqOutbound = 1;

/* ==================== 状态 ==================== */
const S = {
  view:"stock", invTab:"stock",
  stockSearch:"", stockL1:"全部", stockType:"全部",
  ledgerFilter:"全部",
  completeRows:null,
  obDraft:null, obRows:null,
};
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
function fmtG(g){
  g = Math.round(g*10)/10;
  if(g >= 1000){ const jin = Math.floor(g/500); const rem = Math.round(g - jin*500); return jin + " 斤" + (rem ? " " + rem + " g" : ""); }
  return g + " g";
}
function stockKey(o){ return o.sourceType + ":" + o.code; }
function now(){ const d = new Date(); return TODAY + " " + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); }
function toast(msg){
  const r = document.getElementById("toast-root");
  r.innerHTML = `<div class="toast">${esc(msg)}</div>`;
  setTimeout(()=>{ r.innerHTML = ""; }, 2600);
}
function nav(view){ S.view = view; render(); window.scrollTo(0,0); }

/* ==================== 渲染入口 ==================== */
function render(){
  document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
  const inInventory = ["stock","outbound","ledger","ob-new","ob-detail"].includes(S.view);
  document.getElementById(inInventory ? "nav-inventory" : "nav-schedule").classList.add("active");
  const m = document.getElementById("main");
  if(S.view==="stock"||S.view==="outbound"||S.view==="ledger") renderInventory(m);
  else if(S.view==="schedule") renderSchedule(m);
  else if(S.view==="ob-new") renderObNew(m);
  else if(S.view==="ob-detail") renderObDetail(m);
  else m.innerHTML = `<div class="empty">该模块不在本次原型范围内<br><br><button class="btn outline" onclick="nav('stock')">回到库存模块</button></div>`;
}

/* ==================== 库存模块 ==================== */
function renderInventory(m){
  const tabs = [["stock","当前库存"],["outbound","出库单"],["ledger","出入库流水"]];
  let body = "";
  if(S.invTab==="stock") body = viewStock();
  else if(S.invTab==="outbound") body = viewOutboundList();
  else body = viewLedger();
  m.innerHTML = `
    <div class="page-head">
      <div><h1>库存管理</h1><div class="sub">只管理切配中心加工完成的净菜（净料 + 小料）</div></div>
      <button class="btn" onclick="startOb()">＋ 创建出库单</button>
    </div>
    <div class="banner">📌 <div><b>演示指引</b> — 流程 ①：点左侧「排程」进入排程详情，点 <b>【完成生产】</b>，逐行确认切配工单（可改实际量、可标未完成），提交后净菜自动入库；流程 ②：回到本页点 <b>【创建出库单】</b>，选门店 → 选排程，系统自动按<b>实际入库库存</b>算出可出量，未切配的货会标红。</div></div>
    <div class="tabs">${tabs.map(t=>`<button class="tab ${S.invTab===t[0]?"active":""}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join("")}</div>
    ${body}`;
}
function setTab(t){ S.invTab=t; S.view="stock"; render(); }

/* ---- 当前库存 ---- */
function stockRows(){
  const seen = {};
  cuttingOrders.forEach(o=>{ if(!seen[stockKey(o)]) seen[stockKey(o)] = o; });
  let rows = Object.values(seen).map(o=>({...o, qty: stock[stockKey(o)] ?? 0}));
  if(S.stockSearch){ const q=S.stockSearch.toLowerCase(); rows = rows.filter(r=> r.name.toLowerCase().includes(q) || r.code.toLowerCase().includes(q)); }
  if(S.stockL1!=="全部") rows = rows.filter(r=>r.l1===S.stockL1);

      ${sc.status==="进行中" ? `<button class="btn" onclick="openComplete(${sc.id})">✓ 完成生产${pendingCnt?`（剩余 ${pendingCnt} 项待确认）`:""}</button>` : ""}

    </div>

      <div class="card kpi"><div class="label">🔪 工单进度</div><div class="value" style="font-size:18px">${doneCnt} 完成 · ${undoneCnt} 未完成 · ${pendingCnt} 待确认</div></div>
    </div>
    <div class="card">
      <h3 class="mb16" style="font-size:15px">切配工单明细（净菜）</h3>
      <div class="tbl-wrap" style="border:none">
      <table class="tbl">
        <thead><tr><th>一级分类</th><th>二级分类</th><th>编号</th><th>名称</th><th>规格</th><th>份数</th><th class="td-num">切配量</th><th>完成状态</th></tr></thead>

/* ---- 完成生产弹窗 ---- */
function openComplete(scheduleId){
  const pend = cuttingOrders.filter(o=>o.scheduleId===scheduleId && o.status==="pending");
  if(!pend.length){ toast("本排程没有待确认的切配工单"); return; }
  S.completeRows = pend.map(o=>({orderId:o.id, status:"completed", qty:o.requiredQty, remark:""}));
  S.completeScheduleId = scheduleId;
  renderCompleteDialog();
}
function renderCompleteDialog(){
  const sc = schedules.find(s=>s.id===S.completeScheduleId);
  const done = cuttingOrders.filter(o=>o.scheduleId===sc.id && o.status!=="pending");
  const rows = S.completeRows;
  let inKinds=0, inG=0, undone=0, hold=0;
  rows.forEach(r=>{ if(r.status==="completed"){inKinds++;inG+=Number(r.qty)||0;} else if(r.status==="unfinished"){undone++;} else hold++; });
  const body = rows.map((r,i)=>{
    const o = cuttingOrders.find(c=>c.id===r.orderId);
    const isDone = r.status==="completed";
    return `<tr class="${r.status==="unfinished"?"row-red":""}">
      <td class="group-cell">${o.l1}</td><td class="group-cell2">${o.l2}</td>
      <td class="mono">${o.code}</td><td style="font-weight:600">${o.name}</td>
      <td class="muted">${o.spec}</td><td>${o.portionsText}</td>
      <td class="td-num muted">${fmtG(o.requiredQty)}</td>
      <td><input class="input w80 ${isDone&&(!r.qty||r.qty<=0)?"err":""}" type="number" min="0" step="50" value="${isDone?r.qty:""}" ${isDone?"":"disabled"} oninput="updComplete(${i},'qty',this.value)"> g</td>
      <td><div class="seg">
        <button class="${isDone?"on-done":""}" onclick="updComplete(${i},'status','completed')">完成</button>
        <button class="${r.status==="unfinished"?"on-undone":""}" onclick="updComplete(${i},'status','unfinished')">未完成</button>
        <button class="${r.status==="hold"?"on-hold":""}" onclick="updComplete(${i},'status','hold')">暂不确认</button>
      </div></td>
      <td><input class="input" style="width:130px" placeholder="未完成原因（选填）" value="${esc(r.remark)}" ${r.status==="unfinished"?"":"disabled"} oninput="updComplete(${i},'remark',this.value)"></td>
    </tr>`;}).join("");
  document.getElementById("dialog-root").innerHTML = `
  <div class="overlay" onclick="if(event.target===this)closeDialog()">
    <div class="dialog">
      <h3>完成生产确认 — ${sc.code}</h3>
      <div class="d-sub">逐行确认当日切配工单：默认全部「完成」，实际完成量可改小（支持部分完成）；没切完改为「未完成」并标注原因。提交后净菜<b>自动入库</b>，「暂不确认」的行保持待切配、留到下次确认，支持上午/下午分批提交。</div>
      <div class="tbl-wrap" style="border:none;max-height:380px;overflow-y:auto">
      <table class="tbl">
        <thead><tr><th>一级分类</th><th>二级分类</th><th>编号</th><th>名称</th><th>规格</th><th>份数</th><th class="td-num">切配量</th><th class="td-num">实际完成量</th><th>状态</th><th>备注</th></tr></thead>
        <tbody>${body}</tbody></table></div>
      <div class="summary">
        <span>本次入库 <b style="color:var(--success)">${inKinds}</b> 种 / 共 <b style="color:var(--success)">${fmtG(inG)}</b></span>
        <span>未完成 <b class="danger-text">${undone}</b> 种</span>
        <span>暂不确认 <b>${hold}</b> 种（留待下次）</span>
        <span style="flex:1"></span>
        <button class="btn outline" onclick="closeDialog()">取消</button>
        <button class="btn" onclick="submitComplete()">提交并入库</button>
      </div>
      ${done.length?`<details class="mt8 muted" style="font-size:12px"><summary>已确认 ${done.length} 行（只读）</summary>
        <div class="mt8">${done.map(o=>`<div style="padding:4px 0">· ${o.code} ${o.name} — ${o.status==="completed"?"已完成 "+fmtG(o.completedQty):"未完成"+(o.remark?"（"+esc(o.remark)+"）":"")}</div>`).join("")}</div></details>`:""}
    </div>
  </div>`;
}
function updComplete(i, field, val){
  const r = S.completeRows[i];
  if(field==="status"){ r.status = val; if(val==="completed"){ const o = cuttingOrders.find(c=>c.id===r.orderId); r.qty = o.requiredQty; } }
  else if(field==="qty"){ r.qty = Number(val); }
  else r.remark = val;
  renderCompleteDialog();
}
function submitComplete(){
  for(const r of S.completeRows){
    if(r.status==="completed" && (!r.qty || r.qty<=0)){ toast("请填写有效的实际完成量"); return; }
  }
  const sc = schedules.find(s=>s.id===S.completeScheduleId);
  const t = now();
  let inG = 0;
  S.completeRows.forEach(r=>{
    const o = cuttingOrders.find(c=>c.id===r.orderId);
    if(r.status==="hold") return;
    if(r.status==="completed"){
      o.status = "completed"; o.completedQty = Number(r.qty); o.completedAt = t;
      const k = stockKey(o);
      stock[k] = (stock[k] ?? 0) + Number(r.qty);
      inG += Number(r.qty);
      ledger.unshift({t:t, type:"stock_in", l1:o.l1, l2:o.l2, code:o.code, name:o.name, change:Number(r.qty), balance:stock[k], source:"生产入库 / " + sc.code, operator:"张浩浩"});
    } else {
      o.status = "unfinished"; o.remark = r.remark; o.completedAt = t;
    }
  });
  const stillPending = cuttingOrders.some(o=>o.scheduleId===sc.id && o.status==="pending");
  sc.status = stillPending ? "进行中" : "已完成";
  closeDialog();
  render();
  toast(`已入库 ${fmtG(inG)}${stillPending ? "，本排程尚有工单待确认" : "，本排程全部工单已确认，排程完成"}`);
}
function closeDialog(){ document.getElementById("dialog-root").innerHTML = ""; }
/* ==================== 创建出库单 ==================== */
function startOb(){ S.obDraft = {storeId:null, scheduleId:null}; S.obRows=null; S.view="ob-new"; render(); }
function pickStore(id){ S.obDraft.storeId=id; S.obDraft.scheduleId=null; render(); }
function pickSchedule(id){
  S.obDraft.scheduleId=id;
  const orders = cuttingOrders.filter(o=>o.scheduleId===id);
  S.obRows = orders.map(o=>{
    const avail = stock[stockKey(o)] ?? 0;
    let st = "normal";
    if(o.status!=="completed") st = "unfinished";
    else if((o.completedQty ?? 0) < o.requiredQty || avail < o.requiredQty) st = "insufficient";
    const shipped = st==="unfinished" ? 0 : Math.min(o.requiredQty, avail);
    return {orderId:o.id, shipped:shipped, available:avail, prepStatus:st};
  });
  render();
}
function setShipped(orderId, val){
  const r = S.obRows.find(x=>x.orderId===orderId);
  r.shipped = Number(val);
  const inp = document.querySelector(`input[data-ship="${orderId}"]`);
  if(inp) inp.classList.toggle("err", r.shipped > r.available || r.shipped < 0);
  updObSummary();
}
function obStatusBadge(st){
  return st==="unfinished" ? `<span class="badge red">未切配</span>`
    : st==="insufficient" ? `<span class="badge orange">量不足</span>` : `<span class="badge green">正常</span>`;
}

    </div>
    <div class="card">${body}</div>`;
  if(step===3) updObSummary();
}
function updObSummary(){
  const orders = cuttingOrders.filter(o=>o.scheduleId===S.obDraft.scheduleId);
  let req=0, ship=0, unfinished=0;
  S.obRows.forEach(r=>{
    const o = orders.find(c=>c.id===r.orderId);
    req += o.requiredQty; ship += Number(r.shipped)||0;
    if(r.prepStatus==="unfinished") unfinished++;
  });
  const el = document.getElementById("ob-summary");
  if(!el) return;
  el.innerHTML = `
    <span>共 <b>${S.obRows.length}</b> 行</span>
    <span>计划 <b>${fmtG(req)}</b></span>
    <span>本次出库 <b style="color:var(--primary)">${fmtG(ship)}</b></span>
    <span>未切配 <b class="danger-text">${unfinished}</b> 行</span>
    ${unfinished?`<span class="danger-text" style="font-size:12px">⚠️ 未切配的净菜默认不出库，将在单据上明确标注</span>`:""}`;
}
function submitOb(){
  for(const r of S.obRows){
    if(r.shipped < 0 || r.shipped > r.available){ toast("本次出库量不能超过当前库存"); return; }
  }
  const sc = schedules.find(s=>s.id===S.obDraft.scheduleId);
  const st = stores.find(s=>s.id===S.obDraft.storeId);
  const t = now();
  seqOutbound++;
  const code = "OUT-" + TODAY.replace(/-/g,"") + "-" + String(seqOutbound).padStart(3,"0");
  const orders = cuttingOrders.filter(o=>o.scheduleId===sc.id);
  const items = S.obRows.map(r=>{
    const o = orders.find(c=>c.id===r.orderId);
    const k = stockKey(o);
    stock[k] = (stock[k] ?? 0) - Number(r.shipped);
    if(r.shipped > 0){
      ledger.unshift({t:t, type:"stock_out", l1:o.l1, l2:o.l2, code:o.code, name:o.name, change:Number(r.shipped), balance:stock[k], source:"出库单 " + code, operator:"张浩浩"});
    }
    return {sourceType:o.sourceType, code:o.code, name:o.name, l1:o.l1, l2:o.l2, spec:o.spec, portionsText:o.portionsText,
      requiredQty:o.requiredQty, availableQty:r.available, shippedQty:Number(r.shipped), prepStatus:r.prepStatus};
  });
  const ob = {id: seqOutbound, code:code, scheduleId:sc.id, storeId:st.id, scheduleCode:sc.code, scheduleDate:sc.date,
    status:"confirmed", operator:"张浩浩", createdAt:t, remark:"", items:items};
  outbounds.push(ob);
  S.obDetailId = ob.id;
  S.view = "ob-detail";
  render();
  toast("出库单 " + code + " 已创建，库存已扣减");
}

/* ==================== 出库单详情 ==================== */
function openOb(id){ S.obDetailId = id; S.view = "ob-detail"; render(); }
function renderObDetail(m){
  const o = outbounds.find(x=>x.id===S.obDetailId);
  if(!o){ S.view="outbound"; S.invTab="outbound"; render(); return; }
  const st = stores.find(s=>s.id===o.storeId);
  const total = o.items.reduce((a,i)=>a+i.shippedQty,0);
  const voided = o.status==="voided";
  m.innerHTML = `
    <div class="back" onclick="S.view='outbound';S.invTab='outbound';render()">← 返回出库单列表</div>
    <div class="page-head">
      <div><h1>出库单 ${o.code} ${voided?'<span class="badge gray">已作废</span>':'<span class="badge green">已出库</span>'}</h1>
      <div class="sub">${st.name} · 来源排程 ${o.scheduleCode} · 生产日期 ${o.scheduleDate} · 制单人 ${o.operator} · ${o.createdAt}</div></div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn outline" onclick="doPrint(${o.id})">🖨️ 打印出库单</button>
        ${!voided?`<button class="btn danger" onclick="openVoid(${o.id})">作废</button>`:`<div class="muted" style="font-size:12px">作废原因：${esc(o.voidReason||"—")} · ${o.voidedAt||""}</div>`}
      </div>
    </div>
    <div class="kpis">
      <div class="card kpi"><div class="label">📍 门店</div><div class="value" style="font-size:18px">${st.name}</div></div>
      <div class="card kpi"><div class="label">📋 明细行数</div><div class="value" style="font-size:18px">${o.items.length}</div></div>
      <div class="card kpi"><div class="label">⬆️ 出库总量</div><div class="value" style="font-size:18px;color:var(--danger)">${fmtG(total)}</div></div>
      <div class="card kpi"><div class="label">⚠️ 未切配行</div><div class="value" style="font-size:18px">${o.items.filter(i=>i.prepStatus==="unfinished").length}</div></div>
    </div>
    <div class="card">
      <div class="tbl-wrap" style="border:none">
      <table class="tbl">
        <thead><tr><th>一级分类</th><th>二级分类</th><th>序号</th><th>名称</th><th>规格</th><th>份数</th><th class="td-num">净料用量</th><th class="td-num">本次出库</th><th>状态</th></tr></thead>
        <tbody>${o.items.map((it,i)=>`<tr class="${it.prepStatus==="unfinished"?"row-red":it.prepStatus==="insufficient"?"row-orange":""}">
          <td class="group-cell">${it.l1}</td><td class="group-cell2">${it.l2}</td>
          <td class="mono">${String(i+1).padStart(2,"0")}</td>
          <td style="font-weight:600">${it.name}<div class="mono" style="font-size:11px">${it.code}</div></td>
          <td class="muted">${it.spec}</td><td>${it.portionsText}</td>
          <td class="td-num muted">${fmtG(it.requiredQty)}</td>
          <td class="td-num" style="font-weight:700">${fmtG(it.shippedQty)}</td>
          <td>${obStatusBadge(it.prepStatus)}</td>
        </tr>`).join("")}
        </tbody></table></div>
      ${voided?`<div class="summary mt16" style="background:var(--danger-bg);border-color:#fecaca"><span class="danger-text">本单已作废，${fmtG(total)} 已回滚至库存（见台账「作废回滚」）。</span></div>`:""}
    </div>`;
}

/* ---- 作废 ---- */
function openVoid(id){
  S.voidId = id;
  document.getElementById("dialog-root").innerHTML = `
  <div class="overlay" onclick="if(event.target===this)closeDialog()">
    <div class="dialog small">
      <h3>作废出库单</h3>
      <div class="d-sub">作废后该单全部出库量将<b>回滚</b>到净菜库存，并记录作废流水。历史单据保留可查（作废 ≠ 删除）。</div>
      <textarea class="input" id="void-reason" rows="3" style="width:100%" placeholder="请填写作废原因（必填）"></textarea>
      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px">
        <button class="btn outline" onclick="closeDialog()">取消</button>
        <button class="btn danger" onclick="confirmVoid()">确认作废并回滚库存</button>
      </div>
    </div>
  </div>`;
}
function confirmVoid(){
  const reason = document.getElementById("void-reason").value.trim();
  if(!reason){ toast("请填写作废原因"); return; }
  const o = outbounds.find(x=>x.id===S.voidId);
  const t = now();
  o.status = "voided"; o.voidReason = reason; o.voidedAt = t;
  o.items.forEach(it=>{
    if(it.shippedQty<=0) return;
    const k = it.sourceType + ":" + it.code;
    stock[k] = (stock[k] ?? 0) + it.shippedQty;
    ledger.unshift({t:t, type:"stock_rollback", l1:it.l1, l2:it.l2, code:it.code, name:it.name, change:it.shippedQty, balance:stock[k], source:"作废回滚 " + o.code, operator:"张浩浩"});
  });
  closeDialog(); render();
  toast("出库单已作废，库存已回滚");
}

/* ---- 打印 ---- */
function doPrint(id){
  const o = outbounds.find(x=>x.id===id);
  const st = stores.find(s=>s.id===o.storeId);
  document.getElementById("print-root").innerHTML = `
    <h1>净菜出库单 ${o.code}${o.status==="voided"?"（已作废）":""}</h1>
    <p>门店：${st.name}　　来源排程：${o.scheduleCode}　　生产日期：${o.scheduleDate}　　制单人：${o.operator}　　打印时间：${now()}</p>
    <table border="1" cellspacing="0" cellpadding="8" style="width:100%;border-collapse:collapse;margin-top:12px">
      <thead><tr><th>一级分类</th><th>二级分类</th><th>序号</th><th>名称</th><th>规格</th><th>份数</th><th>净料用量</th><th>本次出库</th><th>状态</th></tr></thead>
      <tbody>${o.items.map((it,i)=>`<tr>
        <td>${it.l1}</td><td>${it.l2}</td><td>${i+1}</td><td>${it.name}</td><td>${it.spec}</td><td>${it.portionsText}</td>
        <td style="text-align:right">${fmtG(it.requiredQty)}</td><td style="text-align:right;font-weight:bold">${fmtG(it.shippedQty)}</td>
        <td>${it.prepStatus==="unfinished"?"未切配":it.prepStatus==="insufficient"?"量不足":"正常"}</td></tr>`).join("")}
      </tbody></table>
    <p style="margin-top:24px">司机签字：＿＿＿＿＿＿＿＿　　门店收货人：＿＿＿＿＿＿＿＿</p>`;
  window.print();
}

render();
</script>
</body>
