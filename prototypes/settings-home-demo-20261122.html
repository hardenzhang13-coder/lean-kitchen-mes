<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设置首页 · 极简轻拟物 Demo</title>
<style>
  :root{
    --foreground:#26252a;
    --muted:#726d67;
    --bg:#f7f4ef;
    --border:#e8e4de;
    --border-strong:#d8d4cc;
    --surface:linear-gradient(180deg,#ffffff 0%,#fdfcfb 100%);
    --surface-muted:linear-gradient(180deg,#faf8f4 0%,#f5f2ec 100%);
    --primary-ink:#c2410c;
    --primary-soft:linear-gradient(180deg,#fff3eb 0%,#ffeadd 100%);
    --shadow-card:inset 0 1px 0 rgba(255,255,255,.85),0 1px 2px rgba(15,23,42,.05),0 5px 14px rgba(15,23,42,.04);
    --shadow-card-hover:inset 0 1px 0 rgba(255,255,255,.9),0 2px 4px rgba(15,23,42,.06),0 10px 22px rgba(15,23,42,.07);
    --shadow-active:inset 0 2px 5px rgba(15,23,42,.08);
    --r-card:12px;
    --r-disc:14px;
    --r-pill:999px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    color:var(--foreground);
    background:var(--bg);
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:14px;line-height:1.5;
  }
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:transparent}

  .app{min-height:100dvh;display:flex}

  .sidebar{
    position:fixed;z-index:10;inset:0 auto 0 0;width:76px;
    display:flex;flex-direction:column;align-items:center;
    padding:18px 0;
    background:var(--surface);
    border-right:1px solid var(--border);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9);
  }
  .brand{display:flex;flex-direction:column;align-items:center;gap:5px;margin-bottom:30px}
  .logo{
    width:36px;height:36px;display:grid;place-items:center;border-radius:11px;
    color:#fff;font-size:15px;font-weight:800;
    background:linear-gradient(180deg,#f0813c,#e05a1e);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 6px rgba(234,88,12,.22);
  }
  .brand span{font-size:12px;color:var(--muted);font-weight:600}
  .nav{flex:1;display:flex;flex-direction:column;gap:6px}
  .nav-item{
    width:58px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    border-radius:10px;color:var(--muted);font-size:12px;font-weight:600;
    transition:color .15s ease,background-color .15s ease,transform .15s ease;
  }
  .nav-item:hover{color:var(--foreground);background:var(--surface-muted);transform:translateY(-1px)}
  .nav-item.active{
    color:var(--primary-ink);background:var(--primary-soft);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 2px 7px rgba(234,88,12,.14);
  }
  .nav-item svg{width:18px;height:18px}

  .main{flex:1;min-width:0;margin-left:76px;display:flex;flex-direction:column;min-height:100dvh}
  .topbar{
    display:flex;align-items:center;min-height:80px;padding:20px 32px;
    background:var(--surface);border-bottom:1px solid var(--border);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9);
  }
  h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.02em}
  .page-desc{margin:4px 0 0;color:var(--muted);font-size:13px}

  .content{
    width:100%;max-width:1120px;margin:0 auto;
    padding:28px 32px 36px;
    display:flex;flex-direction:column;gap:24px;
  }

  .group{display:flex;flex-direction:column;gap:12px}
  .group-head{display:flex;align-items:center;gap:12px}
  .group-title{color:var(--muted);font-size:13px;font-weight:700;white-space:nowrap}
  .group-line{flex:1;height:1px;background:var(--border)}

  .grid{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:12px;
  }

  .item{
    display:flex;align-items:center;gap:12px;min-height:82px;padding:14px;
    text-decoration:none;color:inherit;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--r-card);
    box-shadow:var(--shadow-card);
    transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease,background-color .15s ease;
  }
  .item:hover{transform:translateY(-1px);border-color:var(--border-strong);box-shadow:var(--shadow-card-hover)}
  .item:active{transform:translateY(0);box-shadow:var(--shadow-active)}
  .item:focus-visible{outline:2px solid #a8a29e;outline-offset:2px}

  .disc{
    flex:none;width:42px;height:42px;display:grid;place-items:center;
    color:var(--primary-ink);
    background:var(--primary-soft);
    border:1px solid #f8d3ba;
    border-radius:var(--r-disc);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 1px 2px rgba(194,65,12,.08);
  }
  .disc svg{width:20px;height:20px}

  .title{margin:0;font-size:14px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub{margin:3px 0 0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  @media(max-width:1100px){
    .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media(max-width:720px){
    .sidebar{display:none}
    .main{margin-left:0}
    .topbar,.content{padding-left:20px;padding-right:20px}
    .grid{grid-template-columns:1fr}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo">厨</div><span>精益厨房</span></div>
    <nav class="nav">
      <button class="nav-item" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>工作台</span></button>
      <button class="nav-item" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg><span>排程</span></button>
      <button class="nav-item" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 4h4v4h-4z"/><path d="M12 8v4m-6 7h12a2 2 0 002-2v-3a2 2 0 00-2-2H8a2 2 0 00-2 2v3a2 2 0 002 2z"/></svg><span>生产</span></button>
      <button class="nav-item" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16l-2 8H6z"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg><span>采购</span></button>
      <button class="nav-item" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8l8-4 8 4v8l-8 4-8-4z"/><path d="M12 12v8M12 12L4 8M12 12l8-4"/></svg><span>库存</span></button>
      <button class="nav-item" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4h12v16l-6-3-6 3z"/></svg><span>菜品</span></button>
      <button class="nav-item" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21c6 0 8-5 8-9a8 8 0 10-16 0c0 4 2 9 8 9z"/><path d="M12 8v6M9 11h6"/></svg><span>食材</span></button>
      <button class="nav-item active" type="button" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg><span>设置</span></button>
    </nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1>设置</h1>
        <p class="page-desc">基础数据与账号权限</p>
      </div>
    </header>

    <div class="content">
      <section class="group">
        <div class="group-head"><span class="group-title">数据字典</span><span class="group-line"></span></div>
        <div class="grid">
          <a class="item" href="/settings/classes"><span class="disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h7v7H4zM13 4h7v7h-7zM13 13h7v7h-7zM4 13h7v7H4z"/></svg></span><span><h3 class="title">食材分类</h3><p class="sub">一级 / 二级</p></span></a>
          <a class="item" href="/settings/categories"><span class="disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4h10M9 4v5l-5 9a2 2 0 002 3h12a2 2 0 002-3l-5-9V4"/></svg></span><span><h3 class="title">菜品类别</h3><p class="sub">分类字典</p></span></a>
          <a class="item" href="/settings/net-packagings"><span class="disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 8l7-4 7 4v8l-7 4-7-4z"/><path d="M12 12v8M12 12L5 8M12 12l7-4"/></svg></span><span><h3 class="title">净菜包装</h3><p class="sub">名称 / 尺寸</p></span></a>
          <a class="item" href="/settings/units"><span class="disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16M6 5v14a2 2 0 002 2h8a2 2 0 002-2V5"/><path d="M10 10h4M10 14h4"/></svg></span><span><h3 class="title">单位</h3><p class="sub">重量 / 体积 / 计数</p></span></a>
        </div>
      </section>

      <section class="group">
        <div class="group-head"><span class="group-title">协作对象</span><span class="group-line"></span></div>
        <div class="grid">
          <a class="item" href="/settings/stores"><span class="disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9l1.5-5h13L20 9M4 9v10a1 1 0 001 1h14a1 1 0 001-1V9M4 9h16M9 20v-6h6v6"/></svg></span><span><h3 class="title">门店管理</h3><p class="sub">排程主体</p></span></a>
          <a class="item" href="/settings/suppliers"><span class="disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h10v10H3zM13 10h4l4 3v4h-8"/><circle cx="7" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg></span><span><h3 class="title">供应商</h3><p class="sub">采购档案</p></span></a>
        </div>
      </section>

      <section class="group">
        <div class="group-head"><span class="group-title">账号权限</span><span class="group-line"></span></div>
        <div class="grid">
          <a class="item" href="/settings/users"><span class="disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M17 8h5M19.5 5.5v5"/></svg></span><span><h3 class="title">用户管理</h3><p class="sub">账号 / 角色</p></span></a>
          <a class="item" href="/settings/profile"><span class="disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="9" r="3.5"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/></svg></span><span><h3 class="title">个人设置</h3><p class="sub">本人信息</p></span></a>
        </div>
      </section>
    </div>
  </main>
</div>
</body>
</html>
