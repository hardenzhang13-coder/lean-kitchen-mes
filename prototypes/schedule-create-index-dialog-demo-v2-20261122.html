<script>

var selected=dishes.slice(0,4).map(function(d){return{id:d.id,qty:d.qty}}),search='',filters={cat:'all',portion:'all',price:'all'},portions=['小碗菜','社区','食堂'];
function byId(i){return dishes.find(function(d){return d.id===i})}function row(i){return selected.find(function(d){return d.id===i})}function priceOk(d){if(filters.price==='low')return d.price<10;if(filters.price==='mid')return d.price>=10&&d.price<=20;if(filters.price==='high')return d.price>20;return 1}
function library(){var rows=dishes.filter(function(d){return(!search||d.name.toLowerCase().includes(search))&&(filters.cat==='all'||d.cat===filters.cat)&&(filters.portion==='all'||d.portion===filters.portion)&&priceOk(d)}),g=document.getElementById('dishGrid');g.innerHTML='';rows.forEach(function(d){var on=!!row(d.id),b=document.createElement('button');b.type='button';b.className='dish'+(on?' on':'');b.innerHTML='<div class="dishtop"><span class="catchip">'+d.cat+'</span><span class="pick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 13 4 4L19 7"/></svg></span></div><h3 class="dishname">'+d.name+'</h3><div class="dishbottom"><span class="portion">'+d.portion+'</span><span class="price">¥'+d.price.toFixed(2)+'</span></div>';b.onclick=function(){var r=row(d.id);if(r)selected=selected.filter(function(x){return x.id!==d.id});else selected.push({id:d.id,qty:1});render()};g.appendChild(b)});document.getElementById('dishEmpty').hidden=rows.length;document.getElementById('availableCount').textContent='共 '+rows.length+' 道可选'}
function picked(){var l=document.getElementById('selectedList');l.innerHTML='';selected.forEach(function(r){var d=byId(r.id),a=document.createElement('article');a.className='selected';a.innerHTML='<div class="selinfo"><div class="selname">'+d.name+'</div><div class="selmeta"><span class="tag">'+d.cat+'</span><span class="tag">'+d.portion+'</span>¥'+d.price.toFixed(2)+'</div></div><button class="remove"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button><div class="qtyrow"><button class="step dec"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg></button><input class="qty" type="number" min="1" value="'+r.qty+'"><button class="step inc"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button><span class="unit">份</span></div>';a.querySelector('.remove').onclick=function(){selected=selected.filter(function(x){return x.id!==r.id});render()};a.querySelector('.dec').onclick=function(){r.qty=Math.max(1,r.qty-1);render()};a.querySelector('.inc').onclick=function(){r.qty++;render()};a.querySelector('.qty').onchange=function(){var v=Number(this.value);r.qty=Number.isFinite(v)&&v>0?Math.floor(v):1;render()};l.appendChild(a)});if(!selected.length)l.innerHTML='<div class="empty">请在右侧选择菜品</div>'}
function totals(){return{count:selected.length,qty:selected.reduce(function(s,x){return s+x.qty},0),amount:selected.reduce(function(s,x){return s+byId(x.id).price*x.qty},0)}}
function validation(){var t=totals(),f=document.getElementById('foot');document.getElementById('dishCount').textContent=t.count;document.getElementById('portionCount').textContent=t.qty;if(!t.count){f.classList.remove('ok');document.getElementById('validationText').textContent='请至少选择一道菜品';document.getElementById('submit').disabled=1;document.getElementById('previewBtn').disabled=1}else{f.classList.add('ok');document.getElementById('validationText').textContent='将生成 '+t.count+' 道菜品 / '+t.qty+' 份';document.getElementById('submit').disabled=0;document.getElementById('previewBtn').disabled=0}}
function renderPreview(){var l=document.getElementById('previewList');l.innerHTML='';selected.forEach(function(r){var d=byId(r.id),p=document.createElement('div');p.className='prow';p.innerHTML='<div><div class="pn">'+d.name+'</div><div class="pcat">'+d.cat+' · '+d.portion+'</div></div><span>¥'+d.price.toFixed(2)+'</span><span class="pq">'+r.qty+' 份</span>';l.appendChild(p)});var t=totals();document.getElementById('previewSum').innerHTML='<b>'+t.count+'</b> 菜 / <b>'+t.qty+'</b> 份'}
function chips(id,vals,key,labels){var b=document.getElementById(id);b.innerHTML='';vals.forEach(function(v){var x=document.createElement('button');x.type='button';x.className='fchip'+(filters[key]===v?' on':'');x.textContent=labels[v]||v;x.onclick=function(){filters[key]=v;renderFilters();library();filterState()};b.appendChild(x)})}
function renderFilters(){var cats=['all'].concat(dishes.map(function(d){return d.cat}).filter(function(v,i,a){return a.indexOf(v)===i}));chips('catOptions',cats,'cat',{all:'全部'});chips('portionOptions',['all'].concat(portions),'portion',{all:'全部'});chips('priceOptions',['all','low','mid','high'],'price',{all:'全部',low:'¥10 以下',mid:'¥10 - ¥20',high:'¥20 以上'})}
function filterState(){var n=(filters.cat!='all')+(filters.portion!='all')+(filters.price!='all');document.getElementById('filterCount').hidden=!n;document.getElementById('filterCount').textContent=n;document.getElementById('filterBtn').classList.toggle('on',n>0)}
function render(){library();picked();validation();renderPreview()}document.getElementById('search').oninput=function(){search=this.value.trim().toLowerCase();library()};var d=document.getElementById('filterDrop'),f=document.getElementById('filterBtn');f.onclick=function(){d.hidden=!d.hidden;this.setAttribute('aria-expanded',String(!d.hidden))};document.getElementById('filterDone').onclick=function(){d.hidden=1};document.getElementById('filterReset').onclick=function(){filters={cat:'all',portion:'all',price:'all'};renderFilters();library();filterState()};document.getElementById('clearAll').onclick=function(){selected=[];render()};document.getElementById('previewBtn').onclick=function(){renderPreview();document.getElementById('previewLayer').classList.add('show')};document.getElementById('previewClose').onclick=function(){document.getElementById('previewLayer').classList.remove('show')};renderFilters();filterState();render();if(location.hash==='#preview')document.getElementById('previewLayer').classList.add('show');if(location.hash==='#filter')document.getElementById('filterDrop').hidden=false;</script></body></html>
