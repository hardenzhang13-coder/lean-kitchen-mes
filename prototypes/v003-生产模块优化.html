<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生产模块优化 v003 · 精益厨房</title>
<style>
:root{
  --primary:#d3540c; --primary-hover:#b8460a; --primary-bg:#fff7ed; --primary-border:#fdba74;
  --bg:#fafafa; --card:#ffffff; --border:#e5e5e5; --border-2:#d4d4d4;
  --text:#0f172a; --muted:#737373; --muted-2:#a3a3a3; --surface:#fafafa;
  --success:#16a34a; --success-bg:#f0fdf4;
  --warning:#d97706; --warning-bg:#fffbeb;
  --danger:#dc2626; --danger-bg:#fef2f2;
  --info:#2563eb; --info-bg:#eff6ff;
  --solid-warning:#b45309; --solid-progress:#047857; --solid-done:#6b7280; --solid-neutral:#4b5563;
  --radius:12px; --radius-md:8px; --radius-sm:4px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
.app{display:flex;min-height:100vh}
/* ============ 侧栏 ============ */
.side{width:80px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:12px 0;position:sticky;top:0;height:100vh}
.brand{width:44px;height:44px;border-radius:10px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:6px}
.brand-name{font-size:10px;color:var(--muted);margin-bottom:16px}
.nav-item{width:64px;height:64px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:var(--muted);margin-bottom:6px;border:none;background:none;font-size:11px;font-family:inherit}
.nav-item .ico{font-size:18px}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{background:var(--primary-bg);color:var(--primary);font-weight:600}
.nav-item.locked{opacity:.45}
.main{flex:1;padding:24px 32px 64px;min-width:0;max-width:1600px}
/* ============ 页头 ============ */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
.page-head h1{font-size:24px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.page-head .sub{color:var(--muted);font-size:13px;margin-top:4px;max-width:720px}
.head-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer;margin-bottom:10px;font-size:13px;border:none;background:none;font-family:inherit}
.back:hover{color:var(--text)}
/* ============ 模块页签 ============ */
.mod-switch{display:inline-flex;background:var(--surface);border-radius:var(--radius-md);padding:3px;margin-bottom:14px;gap:2px}
.mod-switch button{border:none;background:none;padding:6px 14px;border-radius:6px;font-size:13px;color:var(--muted);cursor:pointer;font-family:inherit}
.mod-switch button.active{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
/* ============ 工具条 ============ */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.toolbar .spacer{flex:1}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:var(--radius-md);padding:0 12px;background:#fff;min-width:280px;height:38px}
.search input{border:none;outline:none;font-size:13px;flex:1;font-family:inherit;background:none;height:100%}
.picker{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:var(--radius-md);padding:0 12px;background:#fff;height:38px;font-size:13px;color:var(--text);cursor:pointer;min-width:190px;justify-content:space-between}
.picker.wide{min-width:380px}
.picker .ph{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:var(--radius-md);font-size:13px;cursor:pointer;border:1px solid transparent;background:var(--primary);color:#fff;font-weight:500;font-family:inherit;white-space:nowrap}
.btn:hover{background:var(--primary-hover)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.outline{background:#fff;border-color:var(--border);color:var(--text)}
.btn.outline:hover{background:var(--bg)}
.btn.ghost{background:none;color:var(--muted)}
.btn.ghost:hover{background:var(--bg);color:var(--text)}
.btn.danger{background:#fff;border-color:var(--danger);color:var(--danger)}
.btn.danger:hover{background:var(--danger-bg)}
.btn.sm{padding:6px 12px;font-size:12px}
.btn.xs{padding:4px 10px;font-size:12px;border-radius:6px}
/* ============ 看板 ============ */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.col{background:var(--surface);border-radius:var(--radius);padding:12px;min-height:220px}
.col-head{display:flex;align-items:flex-start;gap:8px;padding:2px 4px 12px}
.col-head .dot{width:9px;height:9px;border-radius:50%;margin-top:7px;flex-shrink:0}
.col-head .t{font-weight:700;font-size:14px}
.col-head .d{font-size:12px;color:var(--muted);line-height:1.5}
.col-head .cnt{margin-left:auto;font-size:12px;color:var(--muted);background:var(--card);border-radius:999px;padding:1px 9px;flex-shrink:0}
.col-list{display:flex;flex-direction:column;gap:10px}
/* ============ 单据卡（通用件） ============ */
.dcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px;cursor:pointer;transition:border-color .15s}
.dcard:hover{border-color:var(--primary-border)}
.dcard-num{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--muted-2);letter-spacing:.02em}
.dcard-title{font-size:15px;font-weight:600;margin-top:2px;line-height:1.4}
.dcard-metrics{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:13px;color:var(--muted)}
.dcard-metrics b{font-family:ui-monospace,Consolas,monospace;font-size:15px;color:var(--text);font-weight:700;margin-right:3px}
.dcard-prog{margin-top:10px}
.dcard-prog .line{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px}
.dcard-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}
.dcard-foot .who{font-size:12px;color:var(--muted)}
/* 进度条 */
.bar{height:5px;background:var(--surface);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:999px}
.bar.ok i{background:var(--success)}
/* ============ 状态徽标（实底） ============ */
.badge{display:inline-flex;align-items:center;white-space:nowrap;border-radius:var(--radius-sm);padding:2px 9px;font-size:12px;font-weight:600;color:#fff}
.badge.pending{background:var(--solid-warning)}
.badge.doing{background:var(--solid-progress)}
.badge.done{background:var(--solid-done)}
.badge.neutral{background:var(--solid-neutral)}
.badge.soft{background:#f5f5f5;color:#525252;font-weight:500;border:1px solid var(--border)}
.tag{display:inline-block;padding:1px 8px;border-radius:var(--radius-sm);font-size:12px}
.tag.veg{background:#f0fdf4;color:#16a34a}.tag.mea{background:#fef2f2;color:#dc2626}.tag.aqu{background:#eff6ff;color:#2563eb}.tag.pou{background:#fffbeb;color:#d97706}.tag.dry{background:#fff7ed;color:#ea580c}.tag.bea{background:#ecfeff;color:#0891b2}
/* ============ 摘要信息块 ============ */
.info-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.tile{border:1px solid var(--border);background:var(--card);border-radius:var(--radius-md);padding:12px 14px}
.tile .lb{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.tile .vl{font-size:15px;font-weight:600;margin-top:4px;line-height:1.4}
.tile .hl{font-size:12px;color:var(--muted);margin-top:2px}
/* ============ 页签 ============ */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px}
.tabs button{border:none;background:none;padding:9px 16px;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit}
.tabs button.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.tabs button .n{font-size:12px;color:var(--muted-2);margin-left:5px}
/* ============ 表格 ============ */
.tbl-wrap{border:1px solid var(--border);border-radius:var(--radius-md);overflow-x:auto;background:#fff}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:#fafafa;padding:9px 12px;text-align:left;font-weight:600;color:var(--muted);white-space:nowrap;border-bottom:1px solid var(--border)}
.tbl td{padding:9px 12px;border-bottom:1px solid #f5f5f5;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#fcfcfc}
.tbl tr.done td{background:var(--success-bg)}
.tbl tr.unfinished td{background:var(--danger-bg)}
.tbl tr.excluded td{background:#fafafa;color:var(--muted-2);text-decoration:line-through}
.tbl tr.excluded td .no-strike{text-decoration:none}
.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--muted)}
.strong{font-weight:600}
.dim{color:var(--muted)}
.small{font-size:12px}
/* ============ 弹窗 ============ */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow-y:auto}
.dialog{background:var(--card);border-radius:14px;width:100%;max-width:1200px;box-shadow:0 20px 60px rgba(0,0,0,.2);display:flex;flex-direction:column;max-height:calc(100vh - 80px)}
.dialog.compact{max-width:400px}
.dialog.form{max-width:560px}
.dialog.wide{max-width:880px}
.dialog-head{padding:18px 22px 12px;border-bottom:1px solid var(--border)}
.dialog-head h3{font-size:16px;font-weight:600}
.dialog-head .dsub{font-size:13px;color:var(--muted);margin-top:4px}
.dialog-body{padding:16px 22px;overflow-y:auto;flex:1}
.dialog-foot{padding:12px 22px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.dialog-foot .spacer{flex:1}
/* ============ 表单 ============ */
.field{display:flex;flex-direction:column;gap:6px}
.field .lb{font-size:13px;font-weight:500}
.field .lb .req{color:var(--danger);margin-left:2px}
.input{width:100%;border:1px solid var(--border);border-radius:var(--radius-md);padding:8px 12px;font-size:13px;outline:none;background:#fff;font-family:inherit;height:38px}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(211,84,12,.12)}
.input.num-in{width:84px;text-align:right;font-variant-numeric:tabular-nums;height:32px;padding:4px 8px}
.input.err{border-color:var(--danger)}
select.input{cursor:pointer}
.row1{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
/* ============ 汇总条 ============ */
.summary{display:flex;gap:22px;align-items:center;background:#fafafa;border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 16px;font-size:13px;flex-wrap:wrap}
.summary .item{display:flex;align-items:baseline;gap:5px}
.summary .item .lb{color:var(--muted);font-size:12px}
.summary .item b{font-size:17px;font-variant-numeric:tabular-nums}
.summary .item b.ok{color:var(--success)}.summary .item b.bad{color:var(--danger)}
.summary .sep{width:1px;height:20px;background:var(--border)}
/* ============ 提示条 ============ */
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:var(--radius-md);padding:10px 14px;font-size:13px;margin-bottom:14px;line-height:1.7}
.banner.info{background:var(--info-bg);border:1px solid #bfdbfe;color:#1e40af}
.banner.warn{background:var(--warning-bg);border:1px solid #fde68a;color:#92400e}
.banner.primary{background:var(--primary-bg);border:1px solid var(--primary-border);color:#9a3412}
.banner b{font-weight:700}
.banner .x{margin-left:auto;cursor:pointer;color:inherit;opacity:.6;border:none;background:none;font-size:15px;line-height:1}
/* ============ 来源选择（4:6） ============ */
.src-grid{display:grid;grid-template-columns:4fr 6fr;gap:16px;margin-bottom:18px}
.panel{border:1px solid var(--border);border-radius:var(--radius-md);display:flex;flex-direction:column;overflow:hidden;background:#fff}
.panel-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);background:#fafafa;font-size:13px;font-weight:600}
.panel-head .cnt{margin-left:auto;font-weight:400;color:var(--muted);font-size:12px}
.panel-body{padding:10px;overflow-y:auto;max-height:280px}
.pick{border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 12px;margin-bottom:8px;cursor:pointer;background:#fff}
.pick:hover{border-color:var(--primary-border)}
.pick.sel{border-color:var(--primary);background:var(--primary-bg)}
.pick .pt{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.pick .pm{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:12px;flex-wrap:wrap}
.pick .pm .rm{margin-left:auto;color:var(--danger);font-size:12px}
/* ============ 明细编辑器 ============ */
.editor{font-size:13px}
.editor th{padding:8px 10px}
.editor td{padding:6px 10px}
.editor .cell-in{border:1px solid var(--border);border-radius:6px;padding:3px 6px;background:#fff;font-family:inherit;font-size:13px;width:100%;text-align:right;font-variant-numeric:tabular-nums}
.editor .cell-in:hover{border-color:var(--border)}
.editor .cell-in:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(211,84,12,.1)}
.editor .cell-in.locked{color:var(--muted);background:var(--surface)}
.editor .cell-in:disabled{opacity:.55;background:var(--surface);cursor:not-allowed}
.editor td.act{text-align:right;white-space:nowrap}
.row-del{color:var(--danger);cursor:pointer;font-size:12px;border:none;background:none;font-family:inherit}
.row-del:hover{text-decoration:underline}
.editor-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.editor-bar .spacer{flex:1}
/* ============ 分段三态控件 ============ */
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;background:#fff}
.seg button{padding:5px 12px;font-size:12px;border:none;background:#fff;cursor:pointer;color:var(--muted);font-family:inherit;border-right:1px solid var(--border);white-space:nowrap}
.seg button:last-child{border-right:none}
.seg button.on-done{background:var(--success-bg);color:#15803d;font-weight:600}
.seg button.on-undone{background:var(--danger-bg);color:#b91c1c;font-weight:600}
.seg button.on-hold{background:#e5e7eb;color:var(--muted-2);font-weight:600}
.seg button:hover{background:#fafafa}
/* ============ 完成生产弹窗 ============ */
.cmp-group{border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:10px;overflow:hidden}
.cmp-group-head{display:flex;align-items:center;gap:10px;padding:9px 14px;background:#fafafa;font-size:13px;font-weight:600;border-bottom:1px solid var(--border)}
.cmp-group-head .cnt{margin-left:auto;font-weight:400;color:var(--muted);font-size:12px}
.cmp-group-head .toggle{cursor:pointer;border:none;background:none;font-family:inherit;color:var(--muted);font-size:12px}
/* ============ 底部操作区（三槽） ============ */
.actions-bar{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--border);margin:20px -32px -64px;padding:12px 32px;display:flex;align-items:center;gap:8px}
.actions-bar .spacer{flex:1}
.actions-bar .slot-mid{display:flex;gap:8px;margin-left:auto}
/* ============ 空态 / 提示 ============ */
.empty{text-align:center;padding:56px 0;color:var(--muted)}
.empty .big{font-size:32px;margin-bottom:8px;opacity:.4}
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 22px;border-radius:var(--radius-md);font-size:13px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:70vw}
.toast .sub{display:block;color:#cbd5e1;font-size:12px;margin-top:3px}
/* ============ 原型说明区（与 UI 主体用 2px dashed 隔开） ============ */
.notes{border-top:2px dashed var(--border-2);margin-top:40px;padding-top:24px;color:var(--muted);font-size:13px}
.notes h4{font-size:14px;color:var(--text);margin-bottom:10px}
.notes ul{margin:0 0 14px 18px;line-height:1.9}
.notes code{background:var(--surface);padding:1px 6px;border-radius:4px;font-size:12px;font-family:ui-monospace,Consolas,monospace;color:var(--text)}
.notes .ok{color:var(--success)}.notes .no{color:var(--danger)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;background:var(--surface);color:var(--muted);border:1px solid var(--border)}
.pill.new{background:var(--primary-bg);color:var(--primary)}
@media (max-width:1280px){
  .info-grid{grid-template-columns:repeat(3,1fr)}
  .src-grid{grid-template-columns:1fr}
}
@media (max-width:980px){
  .board{grid-template-columns:1fr}
  .info-grid{grid-template-columns:repeat(2,1fr)}
  .main{padding:16px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">🍳</div>
    <div class="brand-name">精益厨房</div>
    <button class="nav-item" onclick="toast('原型未覆盖：工作台')"><span class="ico">⊞</span>工作台</button>
    <button class="nav-item" onclick="toast('本轮不动：排程模块')"><span class="ico">📋</span>排程</button>
    <button class="nav-item locked" onclick="toast('采购模块试运行锁定')"><span class="ico">🛒</span>采购</button>
    <button class="nav-item" onclick="toast('本轮不动：库存模块')"><span class="ico">📦</span>库存</button>
    <button class="nav-item" onclick="toast('原型未覆盖：菜品')"><span class="ico">🍽️</span>菜品</button>
    <button class="nav-item" onclick="toast('原型未覆盖：食材')"><span class="ico">🥬</span>食材</button>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="dialog-root"></div>
<div id="toast-root"></div>
<script>
/* ==================================================================
   生产模块优化 v003 · 原型（纯前端 mock，不连后端）
   范围：生产计划单 /production-plans + 内部生产单 /self-production-orders
   ================================================================== */
const TODAY = "2026-11-20";

/* ---------- 净料 / 小料档案 ---------- */
const NETS = [
  {id:3, type:"net",   code:"NET-0003", name:"猪里脊丝", l1:"畜肉",   l2:"猪肉", pkg:250, yld:78, price:22.0, cat:"mea"},
  {id:7, type:"net",   code:"NET-0007", name:"鸡腿肉丁", l1:"禽肉",   l2:"鸡肉", pkg:250, yld:80, price:18.5, cat:"pou"},
  {id:12,type:"net",   code:"NET-0012", name:"鲈鱼片",   l1:"水产",   l2:"淡水鱼", pkg:300, yld:72, price:30.0, cat:"aqu"},
  {id:18,type:"net",   code:"NET-0018", name:"青红椒丝", l1:"蔬菜",   l2:"椒类", pkg:300, yld:85, price:8.0, cat:"veg"},
  {id:21,type:"net",   code:"NET-0021", name:"白菜丝",   l1:"蔬菜",   l2:"叶菜", pkg:500, yld:82, price:3.2, cat:"veg"},
  {id:25,type:"net",   code:"NET-0025", name:"豆腐块",   l1:"豆制品", l2:"豆制品", pkg:400, yld:88, price:4.5, cat:"dry"},
  {id:2, type:"minor", code:"SML-0002", name:"蒜末",     l1:"蔬菜",   l2:"葱蒜", pkg:100, yld:90, price:12.0, cat:"veg"},
  {id:5, type:"minor", code:"SML-0005", name:"姜片",     l1:"蔬菜",   l2:"葱蒜", pkg:100, yld:90, price:10.0, cat:"veg"},
];
const NET_BY_ID = Object.fromEntries(NETS.map(n=>[n.id,n]));

/* ---------- 当前净菜库存（份，记账主单位） ---------- */
let STOCK = {3:15, 7:10, 12:7, 18:3, 21:22, 25:6, 2:16, 5:7};

/* ---------- 门店排程单（来源 A） ---------- */
const SCHEDULES = [

/* ---------- 工具 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const num = n => { const v = Math.round(n*100)/100; return Number.isInteger(v)?String(v):v.toFixed(2).replace(/0$/,""); };
function fmtDate(s){ const d = new Date(s+"T00:00:00"); const w = ["日","一","二","三","四","五","六"][d.getDay()]; return (d.getMonth()+1)+"月"+d.getDate()+"日 周"+w; }
function fmtG(g){ g=Math.round(g*10)/10; if(g>=1000){ const j=Math.floor(g/500); const r=Math.round(g-j*500); return j+" 斤"+(r?" "+r+" g":""); } return g+" g"; }
function stockOf(netId){ return STOCK[netId]||0; }
/* 唯一派生口径：以「份」为准，克重与毛料需求全部派生 */
function effG(r){ return r.excluded ? 0 : (r.plannedG||0); }
function effPortions(r){ return r.pkg>0 ? Math.round(effG(r)/r.pkg*100)/100 : null; }
function grossJin(r){ return r.yld>0 ? Math.round(effG(r)/r.yld/500*100)/100 : null; }
function planStats(p){
  const rs = p.rows.filter(r=>!r.excluded);
  const st = {kinds:rs.length, portions:0, done:0, unfinished:0, pending:0, total:rs.length};
  rs.forEach(r=>{ st.portions += (effPortions(r)||0);
    if(r.confirmStatus==="completed") st.done++;
    else if(r.confirmStatus==="unfinished") st.unfinished++;
    else st.pending++; });
  st.portions = Math.round(st.portions*100)/100;
  return st;
}
function planTitleOf(p){ return p.title || planTitle(p.planDate); }
function planTitle(date){ const d=new Date(date+"T00:00:00"); return "切配中心 · "+["周日","周一","周二","周三","周四","周五","周六"][d.getDay()]+"（"+(d.getMonth()+1)+"月"+d.getDate()+"日）生产计划"; }
function statusBadge(kind, st){ const m=(STATUS_META[kind]&&STATUS_META[kind][st])||{cls:"neutral"}; return `<span class="badge ${m.cls}">${esc(st)}</span>`; }
function toast(msg, sub){ const r=$("#toast-root"); r.innerHTML = `<div class="toast">${esc(msg)}${sub?`<span class="sub">${esc(sub)}</span>`:""}</div>`; clearTimeout(window.__tt); window.__tt=setTimeout(()=>{r.innerHTML="";},3200); }

  const st = planStats(p);

    ? {label:"切配确认进度", text:st.done+" / "+st.total+" 行", pct: st.total? Math.round(st.done/st.total*100):0, tone:"ok"} : null;
  const metrics = [
    {v:st.kinds, k:"种净菜"}, {v:num(st.portions), k:"份"},
    {v:p.scheduleIds.length, k:"张排程"}, {v:p.selfOrderIds.length, k:"张内部生产"},
  ];
  let action;
  if(p.status==="待生效") action = `<button class="btn sm" onclick="event.stopPropagation();confirmPlan(${p.id})">确认计划</button>`;

  else action = `<button class="btn outline sm" onclick="event.stopPropagation();openPlanDetail(${p.id})">查看详情</button>`;
  return documentCard({
    num:p.code, title:planTitleOf(p), metrics, progress:prog,
    who:"制单人 "+p.operator+" · "+p.createdAt.slice(5,16),
    action, onclick:`openPlanDetail(${p.id})`

    <div class="tile"><div class="lb">制单信息</div><div class="vl">${esc(p.operator)}</div><div class="hl">${esc(p.createdAt)}</div></div>
    <div class="tile"><div class="lb">汇总来源</div><div class="vl">${scheds.length} 张排程 · ${selfs.length} 张内部生产</div><div class="hl">${esc(scheds.map(s=>s.code).concat(selfs.map(o=>o.code)).join("、")||"—")}</div></div>
    <div class="tile"><div class="lb">计划量</div><div class="vl">${st.kinds} 种 · ${num(st.portions)} 份</div><div class="hl">切配确认 ${st.done}/${st.total} 行</div></div>
  </div>

  <div class="summary" style="margin-bottom:16px">
    <div class="item"><span class="lb">切配确认</span><b>${st.done}</b><span class="lb">/ ${st.total} 行</span></div>
    <div class="sep"></div>
    <div class="item"><span class="lb">未完成</span><b class="${st.unfinished?"bad":"ok"}">${st.unfinished}</b><span class="lb">种</span></div>
    <div class="sep"></div>
    <div class="item"><span class="lb">待确认</span><b>${st.pending}</b><span class="lb">种</span></div>
    <div class="sep"></div>
    <div class="item"><span class="lb">总计划量</span><b>${num(st.portions)}</b><span class="lb">份</span></div>
    <div class="spacer" style="flex:1"></div>
    <div style="min-width:220px"><div class="bar ${progressPct===100?"ok":""}"><i style="width:${progressPct}%"></i></div></div>
  </div>

  <div class="tabs">
    <button class="${S.planTab==="cutting"?"active":""}" onclick="S.planTab='cutting';render()">切配工单明细<span class="n">${rows.length}</span></button>
    <button class="${S.planTab==="stores"?"active":""}" onclick="S.planTab='stores';render()">门店排程<span class="n">${scheds.length}</span></button>
    <button class="${S.planTab==="self"?"active":""}" onclick="S.planTab='self';render()">内部生产<span class="n">${selfs.length}</span></button>
  </div>
  ${tabBody}

  <div class="actions-bar">
    ${p.status==="待生效"?`<button class="btn danger sm" onclick="toast('确认删除：待生效计划单可删除，来源排程与内部生产单将被释放')">删除</button>`:""}
    <div class="slot-mid">
      ${p.status==="待生效"?`<button class="btn outline sm" onclick="openAdjust(${p.id})">调整明细</button>
        <button class="btn outline sm" onclick="toast('修改来源与生产日期')">修改</button>`:""}
      <button class="btn outline sm" onclick="toast('打开打印预览：计划单 + 切配标签')">打印 / 切配标签</button>
    </div>
  </div>
  ${notesBlock()}
  `;
}

function viewCuttingTable(p, rows, editable){
  if(!rows.length) return `<div class="empty"><div class="big">▤</div><div>暂无切配明细</div></div>`;
  const totPortions = rows.reduce((s,r)=>s+(effPortions(r)||0),0);
  const totJin = rows.reduce((s,r)=>s+(grossJin(r)||0),0);
  return `
  <div class="banner info"><span>ⓘ</span><div>毛料需求与建议采购量为<b>参考值</b>（采购模块试运行未开放）；切配份数以<b>份</b>为准，净料用量与毛料需求均由份数派生。</div></div>
  <div class="tbl-wrap"><table class="tbl editor">
    <thead><tr>
      <th style="width:44px">序号</th><th style="width:78px">分类</th><th style="width:96px">编码</th><th>名称</th>
      <th class="num" style="width:88px">封装规格</th><th class="num" style="width:80px">计划份数</th><th class="num" style="width:92px">净料用量</th>
      <th class="num" style="width:92px">毛料需求</th><th class="num" style="width:88px">当前库存</th><th style="width:80px">完成状态</th><th style="width:150px">来源</th>
    </tr></thead>
    <tbody>
    ${rows.map((r,i)=>{
      const por = effPortions(r), stock = stockOf(r.netId), short = stock < (por||0);
      const cls = r.confirmStatus==="completed"?"done":r.confirmStatus==="unfinished"?"unfinished":"";
      const stTxt = r.confirmStatus==="completed"?`<span class="badge done">已完成</span>`
        : r.confirmStatus==="unfinished"?`<span class="badge neutral" style="background:#b91c1c">未完成</span>`
        : `<span class="badge soft">待确认</span>`;
      return `<tr class="${cls}">
        <td class="num dim">${i+1}</td>
        <td><span class="tag ${r.cat||catOf(r.l1)}">${esc(r.l2)}</span></td>
        <td class="mono">${esc(r.code)}</td>
        <td class="strong">${esc(r.name)}${r.manualAdded?' <span class="pill new">手动新增</span>':""}</td>
        <td class="num mono">${r.pkg} g/份</td>
        <td class="num strong">${por==null?"—":num(por)}</td>
        <td class="num mono">${fmtG(effG(r))}</td>
        <td class="num mono">${grossJin(r)==null?"—":grossJin(r)+" 斤"}</td>
        <td class="num mono ${short?"":"dim"}" style="${short?"color:#b91c1c":""}">${stock} 份</td>
        <td>${stTxt}</td>
        <td class="small dim">${r.manualAdded?"手动新增":esc(r.sourceRefs.map(s=>s.code).join(" + "))}</td>
      </tr>`;
    }).join("")}
    </tbody>
    <tfoot><tr style="background:#fafafa;font-weight:600">
      <td colspan="5" class="dim">合计 ${rows.length} 种</td>
      <td class="num">${num(totPortions)}</td><td colspan="5" class="dim small">毛料需求合计 ${Math.round(totJin*100)/100} 斤</td>
    </tr></tfoot>
  </table></div>`;
}
function catOf(l1){ return {畜肉:"mea",禽肉:"pou",水产:"aqu",蔬菜:"veg",豆制品:"dry"}[l1]||"veg"; }
function viewSourceSchedules(list){
  if(!list.length) return `<div class="empty"><div class="big">▤</div><div>本计划单没有汇总门店排程</div></div>`;
  return `<div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>编号</th><th>门店</th><th>排程标题</th><th>售卖日期</th><th class="num">菜品数</th><th class="num">份数</th><th>状态</th></tr></thead>
    <tbody>${list.map(s=>`<tr>
      <td class="mono">${esc(s.code)}</td><td>${esc(s.store)}</td><td class="strong">${esc(s.title)}</td>
      <td class="dim">${esc(fmtDate(s.date))}</td><td class="num">${s.dishes}</td><td class="num">${s.qty}</td>
      <td>${statusBadge("productionPlan", s.status==="进行中"?"进行中":s.status==="待生效"?"待生效":"已完成")}</td>
    </tr>`).join("")}</tbody></table></div>`;
}
function viewSourceSelfs(list){
  if(!list.length) return `<div class="empty"><div class="big">▤</div><div>本计划单没有汇总内部生产单</div></div>`;
  return `<div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>编号</th><th>标题</th><th>生产日期</th><th class="num">种数</th><th class="num">份数</th><th>备注</th></tr></thead>
    <tbody>${list.map(o=>`<tr>
      <td class="mono">${esc(o.code)}</td><td class="strong">${esc(o.title)}</td>
      <td class="dim">${esc(fmtDate(o.date))}</td><td class="num">${o.kinds}</td><td class="num">${num(o.portions)}</td>
      <td class="dim">${esc(o.remark||"—")}</td>
    </tr>`).join("")}</tbody></table></div>`;
}

/* ==================== 内部生产单详情 ==================== */
function viewSelfDetail(id){
  const o = SELFORDERS.find(x=>x.id===id);
  if(!o) return `<div class="empty">内部生产单不存在</div>`;
  const items = o.items||[];
  const primary = o.status==="待生效"
      ? `<button class="btn" onclick="activateSelf(${o.id})">确认生产</button>`
      : o.status==="进行中"
      ? (o.planId? `<button class="btn" onclick="openPlanDetail(${o.planId})">查看生产计划</button>` : `<button class="btn outline" disabled>等待排产</button>`)
      : `<button class="btn outline" onclick="toast('已完成的内部生产单只读')">查看详情</button>`;
  return `
  <button class="back" onclick="gotoSelfList()">← 返回内部生产单</button>
  <div class="page-head">
    <div>
      <h1>${esc(o.title)} ${statusBadge("selfProductionOrder", o.status)}</h1>
      <div class="sub"><span class="mono">${esc(o.code)}</span> · 生产日期 ${esc(fmtDate(o.date))} · 制单人 杨厨${o.remark?" · "+esc(o.remark):""}</div>
    </div>
    <div class="head-actions">${primary}</div>
  </div>
  <div class="info-grid">
    <div class="tile"><div class="lb">单据编号</div><div class="vl mono">${esc(o.code)}</div><div class="hl">同日多张时以编号区分</div></div>
    <div class="tile"><div class="lb">生产日期</div><div class="vl">${esc(fmtDate(o.date))}</div><div class="hl">${o.status==="待生效"?"确认后不可改":"已确认"}</div></div>
    <div class="tile"><div class="lb">制单信息</div><div class="vl">杨厨</div><div class="hl">切配中心自提需求</div></div>
    <div class="tile"><div class="lb">所属生产计划</div><div class="vl">${o.planId? esc(PLANS.find(p=>p.id===o.planId).code):"未纳入"}</div><div class="hl">${o.planId?"已汇总进生产计划单":"等待排产"}</div></div>
    <div class="tile"><div class="lb">计划量</div><div class="vl">${o.kinds} 种 · ${num(o.portions)} 份</div><div class="hl">明细 ${items.length} 行</div></div>
  </div>
  <div class="tbl-wrap"><table class="tbl">
    <thead><tr><th style="width:44px">序号</th><th style="width:78px">分类</th><th style="width:96px">编码</th><th>名称</th><th class="num" style="width:88px">封装规格</th><th class="num" style="width:80px">目标份数</th><th class="num" style="width:92px">切配量</th><th class="num" style="width:92px">毛料需求</th><th class="num" style="width:88px">当前库存</th></tr></thead>
    <tbody>${items.length? items.map((r,i)=>{
      const net=NET_BY_ID[r.netId], stock=stockOf(r.netId);
      return `<tr>
        <td class="num dim">${i+1}</td><td><span class="tag ${net.cat}">${esc(net.l2)}</span></td>
        <td class="mono">${esc(net.code)}</td><td class="strong">${esc(net.name)}</td>
        <td class="num mono">${net.pkg} g/份</td><td class="num strong">${num(r.portions)}</td>
        <td class="num mono">${fmtG(r.portions*net.pkg)}</td><td class="num mono">${num(r.portions*net.pkg/net.yld/500)} 斤</td>
        <td class="num mono" style="${stock<r.portions?"color:#b91c1c":""}">${stock} 份</td>
      </tr>`;
    }).join("") : `<tr><td colspan="9" style="text-align:center;color:var(--muted);padding:32px">该内部生产单还没有明细</td></tr>`}</tbody>
  </table></div>
  <div class="actions-bar">
    ${o.status==="待生效"?`<button class="btn danger sm" onclick="toast('确认删除：待生效内部生产单可删除')">删除</button>`:""}
    <div class="slot-mid">
      ${o.status==="待生效"?`<button class="btn outline sm" onclick="openSelfCreate(${o.id})">修改</button>`:""}
      <button class="btn outline sm" onclick="toast('打开打印预览')">打印</button>
    </div>
  </div>
  ${notesBlock()}
  `;
}
</script>
<script>
/* ==================== 各来源的切配需求（模拟汇总口径） ==================== */
const SCHED_CUTTING = {
  1:[[3,5250],[7,2500],[12,1800],[2,500]],
  2:[[3,2500],[7,1500],[18,2400],[2,400]],
  3:[[21,6000],[3,7500],[25,4000]],
  4:[[3,4000],[18,2400],[2,600],[5,300]],
};
const SELF_CUTTING = { 1:[[2,400],[5,400]], 2:[[21,2000],[18,3000],[5,600]] };

/* ==================== 弹窗外壳 ==================== */
function openDialog(html){ $("#dialog-root").innerHTML = `<div class="overlay" onclick="if(event.target===this)closeDialog()">${html}</div>`; }
function closeDialog(){ $("#dialog-root").innerHTML=""; S.dialog=null; S.editor=null; S.cmp=null; }
function gotoPlanList(){ S.view="plan-list"; S.q=""; S.date=""; render(); window.scrollTo(0,0); }
function gotoSelfList(){ S.view="self-list"; S.q=""; S.date=""; render(); window.scrollTo(0,0); }
function openPlanDetail(id){ S.view="plan-detail"; S.planId=id; S.planTab="cutting"; render(); window.scrollTo(0,0); }
function openSelfDetail(id){ S.view="self-detail"; S.selfId=id; render(); window.scrollTo(0,0); }
function confirmPlan(id){ const p=PLANS.find(x=>x.id===id);
  openDialog(`<div class="dialog compact"><div class="dialog-head"><h3>确认计划</h3><div class="dsub">${esc(p.code)} · ${esc(planTitleOf(p))}</div></div>
    <div class="dialog-body"><div class="banner primary"><span>⚑</span><div>确认后计划单进入<b>「进行中」</b>，明细与来源不可再修改；切配完成后由计划单统一入库。</div></div>
    <div class="summary"><div class="item"><span class="lb">切配明细</span><b>${p.rows.filter(r=>!r.excluded).length}</b><span class="lb">种</span></div>
    <div class="item"><span class="lb">合计</span><b>${num(planStats(p).portions)}</b><span class="lb">份</span></div></div></div>
    <div class="dialog-foot"><div class="spacer"></div><button class="btn outline" onclick="closeDialog()">取消</button><button class="btn" onclick="doConfirmPlan(${id})">确认并下发</button></div></div>`); }
function doConfirmPlan(id){ const p=PLANS.find(x=>x.id===id); p.status="进行中"; closeDialog(); toast("计划已确认，进入切配执行","可随时在卡片或详情页完成生产"); render(); }
function activateSelf(id){ const o=SELFORDERS.find(x=>x.id===id); o.status="进行中"; toast("已确认生产，等待纳入生产计划单"); render(); }
function pickDate(){ openDialog(`<div class="dialog compact"><div class="dialog-head"><h3>选择日期</h3></div><div class="dialog-body">
    <div class="field"><span class="lb">日期</span><input class="input" type="date" id="dpick" value="${esc(S.date||TODAY)}"></div></div>
    <div class="dialog-foot"><div class="spacer"></div><button class="btn outline" onclick="closeDialog()">取消</button>
    <button class="btn" onclick="S.date=document.getElementById('dpick').value;closeDialog();render()">确定</button></div></div>`); }

/* ==================== 明细编辑器（创建与调整共用） ==================== */
function editorRowsFromSources(schedIds, selfIds){
  const map = new Map();
  const push = (netId, g, ref)=>{
    const n = NET_BY_ID[netId]; const k = n.type+":"+netId;
    if(!map.has(k)) map.set(k, {netId, type:n.type, code:n.code, name:n.name, l1:n.l1, l2:n.l2, pkg:n.pkg, yld:n.yld, price:n.price, cat:n.cat,
      plannedG:0, excluded:false, manualAdded:false, sourceRefs:[]});
    const r = map.get(k); r.plannedG += g;
    if(ref) r.sourceRefs.push(ref);
  };
  schedIds.forEach(id=>{
    const s = SCHEDULES.find(x=>x.id===id);
    (SCHED_CUTTING[id]||[]).forEach(([nid,g])=>push(nid,g,{kind:"schedule",id:s.id,code:s.code,title:s.title,qtyG:g}));
  });
  selfIds.forEach(id=>{
    const o = SELFORDERS.find(x=>x.id===id);
    (SELF_CUTTING[id]||[]).forEach(([nid,g])=>push(nid,g,{kind:"selfOrder",id:o.id,code:o.code,title:o.title,qtyG:g}));
  });
  return [...map.values()];
}
function editorTable(rows){
  const live = rows.filter(r=>!r.excluded);
  const totP = live.reduce((s,r)=>s+(r.pkg>0? r.plannedG/r.pkg:0),0);
  const totJin = live.reduce((s,r)=>s+(r.yld>0? r.plannedG/r.yld/500:0),0);
  return `
  <div class="editor-bar">
    <span class="small dim">切配明细（可调整）</span>
    <span class="small dim">·</span>
    <span class="small">共 <b>${live.length}</b> 种 / <b>${num(Math.round(totP*100)/100)}</b> 份 / 毛料 <b>${Math.round(totJin*100)/100}</b> 斤</span>
    <div class="spacer"></div>
    <button class="btn outline sm" onclick="openNetPicker()">＋ 新增行</button>
  </div>
  <div class="tbl-wrap"><table class="tbl editor">
    <thead><tr>
      <th style="width:40px">序号</th><th style="width:72px">分类</th><th style="width:92px">编码</th><th>名称</th>
      <th class="num" style="width:84px">封装规格</th><th class="num" style="width:96px">计划份数</th>
      <th class="num" style="width:88px">净料用量</th><th class="num" style="width:88px">毛料需求</th>
      <th class="num" style="width:84px">当前库存</th><th style="width:132px">来源</th><th style="width:96px" class="num">操作</th>
    </tr></thead>
    <tbody>${rows.map((r,i)=>{
      const stock = stockOf(r.netId);
      const short = stock < (r.pkg>0? r.plannedG/r.pkg:0);
      return `<tr class="${r.excluded?"excluded":""}">
        <td class="num dim">${i+1}</td>
        <td><span class="tag ${r.cat||catOf(r.l1)}">${esc(r.l2)}</span></td>
        <td class="mono">${esc(r.code)}</td>
        <td class="strong no-strike">${esc(r.name)}${r.manualAdded?' <span class="pill new">手动新增</span>':""}</td>
        <td class="num mono no-strike">${r.pkg} g/份</td>
        <td class="num"><input class="cell-in ${r.excluded?"locked":""}" type="number" step="0.5" min="0" value="${r.pkg>0? num(r.plannedG/r.pkg):0}" ${r.excluded?"disabled":""} onchange="editPortions(${i}, this.value)"></td>
        <td class="num mono no-strike">${fmtG(r.excluded?0:r.plannedG)}</td>
        <td class="num mono no-strike">${r.yld>0? num(r.excluded?0:Math.round(r.plannedG/r.yld/500*100)/100)+" 斤":"—"}</td>
        <td class="num mono no-strike" style="${short&&!r.excluded?"color:#b91c1c":""}">${stock} 份</td>
        <td class="small dim no-strike">${r.manualAdded?"手动新增":esc(r.sourceRefs.map(s=>s.code).join(" + "))||"—"}</td>
        <td class="act no-strike">${r.excluded
          ? `<button class="row-del" style="color:var(--success)" onclick="restoreRow(${i})">恢复</button>`
          : `<button class="row-del" onclick="excludeRow(${i})">剔除</button>`}</td>
      </tr>`;
    }).join("")}</tbody>
  </table></div>
  <div class="small dim" style="margin-top:8px">「剔除」= 本日不做，保留来源可追溯、可恢复；「新增行」为手动补充需求，不参与门店需求分摊，仅计入净菜入库。</div>`;
}
function editPortions(i, v){ const r=S.editor.rows[i]; if(!r) return; r.plannedG = Math.max(0, (Number(v)||0)) * r.pkg; renderDialog(); }
function excludeRow(i){ S.editor.rows[i].excluded = true; renderDialog(); }
function restoreRow(i){ S.editor.rows[i].excluded = false; renderDialog(); }
function openNetPicker(){
  openDialog(`<div class="dialog form"><div class="dialog-head"><h3>新增切配行</h3><div class="dsub">从净料 / 小料档案中选择，并查看当前库存</div></div>
    <div class="dialog-body">
      <div class="search" style="margin-bottom:12px"><input placeholder="搜索名称…" id="npick-q"></div>
      <div id="npick-list">${netPickList("")}</div>
    </div>
    <div class="dialog-foot"><div class="spacer"></div><button class="btn outline" onclick="backToEditor()">返回</button></div></div>`);
  const q=document.getElementById("npick-q");
  q.oninput = ()=>{ document.getElementById("npick-list").innerHTML = netPickList(q.value.trim().toLowerCase()); };
}
function netPickList(q){
  return NETS.filter(n=>!q || n.name.toLowerCase().includes(q) || n.code.toLowerCase().includes(q)).map(n=>{
    const stock = stockOf(n.id);
    return `<div class="pick" onclick="addNetRow(${n.id})"><div class="pt">${esc(n.name)}<span class="mono">${esc(n.code)}</span></div>
      <div class="pm"><span>${esc(n.l1)} / ${esc(n.l2)}</span><span>${n.pkg} g/份</span><span>出成率 ${n.yld}%</span>
      <span class="rm" style="color:${stock>0?"var(--muted)":"#b91c1c"}">库存 ${stock} 份</span></div></div>`;
  }).join("") || `<div class="empty">没有匹配的净料</div>`;
}
function addNetRow(netId){
  const n = NET_BY_ID[netId];
  const r = {netId, type:n.type, code:n.code, name:n.name, l1:n.l1, l2:n.l2, pkg:n.pkg, yld:n.yld, price:n.price, cat:n.cat,
    plannedG:0, excluded:false, manualAdded:true, sourceRefs:[]};
  S.editor.rows.push(r); backToEditor(); toast("已新增行："+n.name,"请填写计划份数");
}
function backToEditor(){ if(S.editor && S.editor.mode==="create") renderPlanCreateDialog(); else if(S.editor) renderAdjustDialog(S.editor.planId); }
</script>
<script>
/* ==================== 补充 mock 数据（演示"可新建"场景） ==================== */
SCHEDULES.push({id:5, code:"SCH-20261121-002", store:"明天吃啥首店", date:"2026-11-21", status:"进行中", title:"明天吃啥首店 · 周六（11月21日）·菜单", qty:14, dishes:3, planId:null});
SCHEDULES.push({id:6, code:"SCH-20261122-001", store:"新金食堂",     date:"2026-11-22", status:"进行中", title:"新金食堂 · 周日（11月22日）·菜单", qty:22, dishes:4, planId:null});
SELFORDERS.push({id:3, code:"SPO-20261121-002", date:"2026-11-21", status:"进行中", title:"切配中心 · 周六（11月21日）内部生产（补）", remark:"库存不足补切", kinds:2, portions:0, planId:null});
SELFORDERS.push({id:4, code:"SPO-20261122-001", date:"2026-11-22", status:"待生效", title:"切配中心 · 周日（11月22日）内部生产", remark:"", kinds:0, portions:0, planId:null});
SCHED_CUTTING[5]=[[18,3000],[25,3200],[2,600]];
SCHED_CUTTING[6]=[[21,5000],[3,6000],[7,2500],[12,2000]];
SELF_CUTTING[3]=[[25,2000],[2,300]];

/* ==================== 新建生产计划 ==================== */
function openPlanCreate(){
  S.editor = {mode:"create", rows:[], manualRows:[], pickedSchedules:[], pickedSelfs:[], srcTab:"schedule", date:TODAY, store:"all"};
  renderPlanCreateDialog();
}
function rebuildEditorRows(){
  const agg = editorRowsFromSources(S.editor.pickedSchedules, S.editor.pickedSelfs);
  S.editor.rows = agg.concat(S.editor.manualRows||[]);
}
function renderPlanCreateDialog(){
  const e = S.editor;
  const sameDay = PLANS.filter(p=>p.planDate===e.date);
  const pickableSched = SCHEDULES.filter(s=>s.status==="进行中" && !s.planId && s.date>=e.date);
  const pickableSelf = SELFORDERS.filter(o=>o.status==="进行中" && !o.planId && o.date>=e.date);
  const picked = []
    .concat(SCHEDULES.filter(s=>e.pickedSchedules.includes(s.id)))
    .concat(SELFORDERS.filter(o=>e.pickedSelfs.includes(o.id)));
  const right = e.srcTab==="schedule"
    ? (pickableSched.length? pickableSched.map(s=>`<div class="pick" onclick="toggleSource('schedule',${s.id})">
        <div class="pt">${esc(s.store)} <span class="badge doing">${esc(s.status)}</span></div>
        <div class="pm"><span class="mono">${esc(s.code)}</span><span>${esc(fmtDate(s.date))}</span><span>${s.dishes} 个菜品 / ${s.qty} 份</span></div></div>`).join("") : `<div class="empty">没有可汇总的排程单</div>`)
    : (pickableSelf.length? pickableSelf.map(o=>`<div class="pick" onclick="toggleSource('selfOrder',${o.id})">
        <div class="pt">切配中心自提 <span class="badge doing">${esc(o.status)}</span></div>
        <div class="pm"><span class="mono">${esc(o.code)}</span><span>${esc(fmtDate(o.date))}</span><span>${o.kinds} 种 / ${o.parts} 份</span></div></div>`).join("") : `<div class="empty">没有可汇总的内部生产单</div>`);

  openDialog(`<div class="dialog">
    <div class="dialog-head"><h3>新建生产计划</h3><div class="dsub">汇总门店排程单与切配中心自提需求，并在下方直接调整切配明细</div></div>
    <div class="dialog-body">
      ${sameDay.length>1?`<div class="banner primary"><span>⚠︎</span><div><b>${esc(e.date)} 已有 ${sameDay.length} 张生产计划单</b>（${sameDay.map(p=>esc(p.code)).join(" · ")}）。同日可多张，以编号区分。</div></div>`:""}
      <div class="row1">
        <div class="field"><span class="lb">生产日期<span class="req">*</span></span><input class="input" type="date" value="${esc(e.date)}" onchange="S.editor.date=this.value;renderPlanCreateDialog()"></div>
        <div class="field"><span class="lb">选择门店</span><select class="input" onchange="S.editor.store=this.value">
          <option value="all">所有门店</option>${["新金食堂","明天吃啥首店"].map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join("")}</select>
          <span class="small dim">仅用于筛选可汇总的排程单，计划单本身跨店汇总</span></div>
      </div>
      <div class="src-grid">
        <div class="panel">
          <div class="panel-head">已选来源<span class="cnt">${picked.length} 张</span></div>
          <div class="panel-body">${picked.length? picked.map(s=>`<div class="pick sel">
              <div class="pt">${esc(s.store||"切配中心")} <span class="badge ${s.status==="进行中"?"doing":"soft"}">${esc(s.status)}</span></div>
              <div class="pm"><span class="mono">${esc(s.code)}</span><span>${esc(fmtDate(s.date))}</span>
              <span class="rm" onclick="toggleSource('${s.planId!==null&&s.qty!==undefined?"schedule":"selfOrder"}',${s.id})">移除</span></div></div>`).join("")
            : `<div class="empty"><div class="big">＋</div><div class="small">从右侧选择来源单据</div></div>`}</div>
        </div>
        <div class="panel">
          <div class="panel-head">可汇总单据
            <span class="cnt">仅「进行中」且未纳入其他计划单</span></div>
          <div class="panel-body">
            <div class="tabs" style="margin-bottom:10px">
              <button class="${e.srcTab==="schedule"?"active":""}" onclick="S.editor.srcTab='schedule';renderPlanCreateDialog()">门店排程单<span class="n">${pickableSched.length}</span></button>
              <button class="${e.srcTab==="self"?"active":""}" onclick="S.editor.srcTab='self';renderPlanCreateDialog()">内部生产单<span class="n">${pickableSelf.length}</span></button>
            </div>
            ${right}
          </div>
        </div>
      </div>
      ${e.rows.length? editorTable(e.rows) : `<div class="banner info"><span>ⓘ</span><div>选择来源后，这里会出现<b>可编辑的切配明细</b>：组长可以改份数、剔除本日不做的项、或手动新增行。</div></div>`}
    </div>
    <div class="dialog-foot">
      <span class="small dim">${e.rows.length? `将生成 1 张生产计划单 · ${e.rows.filter(r=>!r.excluded).length} 种净菜`:"请至少选择一张来源单据"}</span>
      <div class="spacer"></div>
      <button class="btn outline" onclick="closeDialog()">取消</button>
      <button class="btn" ${e.rows.length?"":"disabled"} onclick="createPlan()">创建并下发</button>
    </div>
  </div>`);
}
function toggleSource(kind, id){
  const e = S.editor;
  if(kind==="schedule"){ const i=e.pickedSchedules.indexOf(id); i>=0?e.pickedSchedules.splice(i,1):e.pickedSchedules.push(id); }
  else { const i=e.pickedSelfs.indexOf(id); i>=0?e.pickedSelfs.splice(i,1):e.pickedSelfs.push(id); }
  rebuildEditorRows(); renderPlanCreateDialog();
}
function createPlan(){
  const e = S.editor;
  const seq = PLANS.filter(p=>p.planDate===e.date).length + 1;
  const ymd = e.date.replace(/-/g,"");
  const code = "PPL-"+ymd+"-"+String(seq).padStart(3,"0");
  const p = {id:Date.now(), code, title:planTitle(e.date), planDate:e.date, status:"待生效", operator:"杨厨",
    createdAt:TODAY+" "+new Date().toTimeString().slice(0,5),
    scheduleIds:e.pickedSchedules.slice(), selfOrderIds:e.pickedSelfs.slice(),
    rows:e.rows.map(r=>Object.assign({},r,{confirmStatus:"pending",actualPortions:null,remark:""}))};
  PLANS.unshift(p);
  e.pickedSchedules.forEach(id=>{ const s=SCHEDULES.find(x=>x.id===id); if(s) s.planId=p.id; });
  e.pickedSelfs.forEach(id=>{ const o=SELFORDERS.find(x=>x.id===id); if(o){o.planId=p.id; o.kinds=p.rows.filter(r=>!r.excluded).length; o.parts=0;} });
  closeDialog(); toast("生产计划单已创建："+code,"可继续在详情页调整明细"); openPlanDetail(p.id);
}

/* ==================== 调整明细 ==================== */
function openAdjust(planId){
  const p = PLANS.find(x=>x.id===planId);
  S.editor = {mode:"adjust", planId, rows:p.rows.map(r=>Object.assign({},r)), manualRows:[]};
  renderAdjustDialog(planId);
}
function renderAdjustDialog(planId){
  const p = PLANS.find(x=>x.id===planId);
  const e = S.editor;
  openDialog(`<div class="dialog">
    <div class="dialog-head"><h3>调整切配明细</h3><div class="dsub">${esc(p.code)} · ${esc(planTitleOf(p))} · 仅「待生效」可调整</div></div>
    <div class="dialog-body">
      <div class="banner info"><span>ⓘ</span><div>份数是唯一可编辑量；净料用量与毛料需求由份数派生。剔除的行<b>保留来源可追溯</b>，不参与采购与入库。</div></div>
      ${editorTable(e.rows)}
    </div>
    <div class="dialog-foot">
      <span class="small dim">调整不会回写门店排程的需求量</span>
      <div class="spacer"></div>
      <button class="btn outline" onclick="closeDialog()">取消</button>
      <button class="btn" onclick="saveAdjust(${planId})">保存调整</button>
    </div>
  </div>`);
}
function saveAdjust(planId){
  const p = PLANS.find(x=>x.id===planId);
  p.rows = S.editor.rows.map(r=>Object.assign({},r,{confirmStatus:r.confirmStatus||"pending"}));
  closeDialog(); toast("明细已保存","采购毛料需求已同步重算"); render();
}

/* ==================== 完成生产 ==================== */
function openComplete(planId){
  const p = PLANS.find(x=>x.id===planId);
  S.cmp = {planId, rows:p.rows.filter(r=>!r.excluded && r.confirmStatus==="pending").map(r=>({
      key:r.key, netId:r.netId, code:r.code, name:r.name, l1:r.l1, l2:r.l2, cat:r.cat, pkg:r.pkg,
      plannedPortions: effPortions(r)||0, uiStatus:"completed", uiPortions: effPortions(r)||0, uiRemark:"",
      stock: stockOf(r.netId) }))};
  renderCompleteDialog();
}
function renderCompleteDialog(){
  const p = PLANS.find(x=>x.id===S.cmp.planId);
  const rows = S.cmp.rows;
  const done = rows.filter(r=>r.uiStatus==="completed").length;
  const undone = rows.filter(r=>r.uiStatus==="unfinished").length;
  const hold = rows.filter(r=>r.uiStatus==="hold").length;
  const inPortions = rows.filter(r=>r.uiStatus==="completed").reduce((s,r)=>s+(Number(r.uiPortions)||0),0);
  const inKinds = rows.filter(r=>r.uiStatus==="completed" && Number(r.uiPortions)>0).length;
  const groups = {};
  rows.forEach(r=>{ (groups[r.l1]=groups[r.l1]||[]).push(r); });
  const pct = rows.length? Math.round(done/rows.length*100):0;
  const confirmed = p.rows.filter(r=>r.confirmStatus!=="pending");

  openDialog(`<div class="dialog">
    <div class="dialog-head"><h3>完成生产确认</h3><div class="dsub">${esc(p.code)} · ${esc(planTitleOf(p))} · 逐行确认切配结果，确认后净菜自动入库</div></div>
    <div class="dialog-body">
      <div class="summary">
        <div class="item"><span class="lb">本次入库</span><b class="ok">${inKinds}</b><span class="lb">种 /</span><b class="ok">${num(Math.round(inPortions*100)/100)}</b><span class="lb">份</span></div>
        <div class="sep"></div>
        <div class="item"><span class="lb">未完成</span><b class="${undone?"bad":"ok"}">${undone}</b><span class="lb">种</span></div>
        <div class="sep"></div>
        <div class="item"><span class="lb">暂不确认</span><b>${hold}</b><span class="lb">种</span></div>
        <div class="sep"></div>
        <div class="item"><span class="lb">进度</span><b>${done}</b><span class="lb">/ ${rows.length} 行</span></div>
        <div class="spacer" style="flex:1"></div>
        <div style="min-width:200px"><div class="bar ${pct===100?"ok":""}"><i style="width:${pct}%"></i></div></div>
      </div>
      <div class="editor-bar">
        <span class="small dim">批量操作</span>
        <button class="btn outline xs" onclick="batchStatus('completed')">全部标记为完成</button>
        <button class="btn outline xs" onclick="batchStatus('unfinished')">全部标记为未完成</button>
        <button class="btn outline xs" onclick="batchStatus('hold')">全部暂不确认</button>
        <button class="btn ghost xs" onclick="batchReset()">恢复默认</button>
      </div>
      ${Object.keys(groups).map(l1=>{
        const g = groups[l1];
        const gdone = g.filter(r=>r.uiStatus==="completed").length;
        return `<div class="cmp-group">
          <div class="cmp-group-head"><span>${esc(l1)}</span><span class="cnt">${gdone} / ${g.length} 已确认</span></div>
          <table class="tbl editor"><thead><tr>
            <th style="width:40px">序号</th><th style="width:72px">分类</th><th style="width:92px">编码</th><th>名称</th>
            <th class="num" style="width:80px">计划份数</th><th class="num" style="width:88px">当前库存</th>
            <th style="width:212px">完成状态</th><th class="num" style="width:96px">实际份数</th><th>未完成原因</th>
          </tr></thead><tbody>
          ${g.map(r=>{
            const short = r.stock < r.plannedPortions;
            return `<tr class="${r.uiStatus==="completed"?"done":r.uiStatus==="unfinished"?"unfinished":""}">
              <td class="num dim">${rows.indexOf(r)+1}</td>
              <td><span class="tag ${r.cat||catOf(r.l1)}">${esc(r.l2)}</span></td>
              <td class="mono">${esc(r.code)}</td>
              <td class="strong">${esc(r.name)}</td>
              <td class="num">${num(r.plannedPortions)}</td>
              <td class="num mono" style="${short?"color:#b91c1c":""}">${r.stock} 份</td>
              <td><div class="seg">
                <button class="${r.uiStatus==="completed"?"on-done":""}" onclick="setStatus('${r.key}','completed')">完成</button>
                <button class="${r.uiStatus==="unfinished"?"on-undone":""}" onclick="setStatus('${r.key}','unfinished')">未完成</button>
                <button class="${r.uiStatus==="hold"?"on-hold":""}" onclick="setStatus('${r.key}','hold')">暂不确认</button>
              </div></td>
              <td class="num"><input class="cell-in" type="number" step="0.5" min="0" value="${r.uiPortions}"
                  ${r.uiStatus!=="completed"?"disabled":""} onchange="setPortions('${r.key}', this.value)"></td>
              <td><input class="cell-in" style="text-align:left" placeholder="选填" value="${esc(r.uiRemark)}"
                  ${r.uiStatus!=="unfinished"?"disabled":""} onchange="setRemark('${r.key}', this.value)"></td>
            </tr>`;
          }).join("")}
          </tbody></table>
        </div>`;
      }).join("")}
      ${confirmed.length?`<details class="small dim"><summary>已确认 ${confirmed.length} 行（只读）</summary>
        <div style="margin-top:6px">${confirmed.map(r=>`· ${esc(r.code)} ${esc(r.name)} — ${r.confirmStatus==="completed"?"已完成 "+num(r.actualPortions||0)+" 份":"未完成"+(r.remark?"（"+esc(r.remark)+"）":"")}`).join("<br>")}</div></details>`:""}
    </div>
    <div class="dialog-foot">
      <span class="small dim">提交后净菜入库，并回写各门店切配工单的实际完成量</span>
      <div class="spacer"></div>
      <button class="btn outline" onclick="closeDialog()">取消</button>
      <button class="btn" ${rows.length?"":"disabled"} onclick="submitComplete()">提交并入库</button>
    </div>
  </div>`);
}
function setStatus(key, st){ const r=S.cmp.rows.find(x=>x.key===key); r.uiStatus=st;
  if(st==="completed") r.uiPortions = r.uiPortions || r.plannedPortions; renderCompleteDialog(); }
function setPortions(key,v){ const r=S.cmp.rows.find(x=>x.key===key); r.uiPortions = Number(v)||0; }
function setRemark(key,v){ const r=S.cmp.rows.find(x=>x.key===key); r.uiRemark=v; }
function batchStatus(st){ S.cmp.rows.forEach(r=>{ r.uiStatus=st; if(st==="completed") r.uiPortions=r.uiPortions||r.plannedPortions; }); renderCompleteDialog(); }
function batchReset(){ S.cmp.rows.forEach(r=>{ r.uiStatus="completed"; r.uiPortions=r.plannedPortions; r.uiRemark=""; }); renderCompleteDialog(); }
function submitComplete(){
  const p = PLANS.find(x=>x.id===S.cmp.planId);
  let inKinds=0, inPortions=0, undone=0;
  S.cmp.rows.forEach(r=>{
    const target = p.rows.find(x=>x.key===r.key);
    if(!target) return;
    target.confirmStatus = r.uiStatus;
    if(r.uiStatus==="completed"){ target.actualPortions=Number(r.uiPortions)||0; target.remark=null;
      if(target.actualPortions>0){ inKinds++; inPortions+=target.actualPortions; STOCK[r.netId]=(STOCK[r.netId]||0)+target.actualPortions; } }
    else if(r.uiStatus==="unfinished"){ target.actualPortions=0; target.remark=r.uiRemark||"未完成"; undone++; }
    else { target.confirmStatus="pending"; }
  });
  const stillPending = p.rows.some(r=>r.confirmStatus==="pending");
  p.status = stillPending ? "进行中" : "已完成";
  closeDialog();
  toast("已入库 "+inKinds+" 种 / "+num(Math.round(inPortions*100)/100)+" 份",
    undone? ("未完成 "+undone+" 种") + (stillPending? "，尚有行待确认，可稍后继续" : "") : (stillPending? "尚有行待确认，可稍后继续" : "本计划单全部确认完成"));
  render();
}

/* ==================== 内部生产单新建 ==================== */
function openSelfCreate(id){
  const o = id? SELFORDERS.find(x=>x.id===id) : null;
  S.self = {mode:id?"edit":"create", id, date:o?o.date:TODAY, remark:o?o.remark:"", items:(o&&o.items)?o.items.map(x=>Object.assign({},x)):[]};
  renderSelfCreateDialog();
}
function renderSelfCreateDialog(){
  const s = S.self;
  openDialog(`<div class="dialog wide">
    <div class="dialog-head"><h3>${s.mode==="edit"?"修改内部生产单":"新建内部生产单"}</h3><div class="dsub">切配中心基于当前库存自提的补货需求</div></div>
    <div class="dialog-body">
      <div class="row1">
        <div class="field"><span class="lb">生产日期<span class="req">*</span></span><input class="input" type="date" value="${esc(s.date)}"></div>
        <div class="field"><span class="lb">备注</span><input class="input" value="${esc(s.remark)}" placeholder="选填"></div>
      </div>
      <div class="src-grid">
        <div class="panel"><div class="panel-head">已选明细<span class="cnt">${s.items.length} 种</span></div>
          <div class="panel-body">${s.items.length? s.items.map((it,i)=>{
            const n=NET_BY_ID[it.netId];
            return `<div class="pick"><div class="pt">${esc(n.name)}<span class="mono">${esc(n.code)}</span></div>
              <div class="pm"><span>目标份数</span>
              <input class="input num-in" type="number" step="0.5" min="0" value="${num(it.portions)}" onchange="selfPortion(${i}, this.value)">
              <span class="rm" onclick="selfRemove(${i})">移除</span></div>
              <div class="pm"><span>切配量 ${fmtG(it.portions*n.pkg)}</span><span>毛料 ${num(it.portions*n.pkg/n.yld/500)} 斤</span>
              <span class="rm" style="color:${stockOf(it.netId)<it.portions?"#b91c1c":"var(--muted)"}">库存 ${stockOf(it.netId)} 份</span></div></div>`;
          }).join("") : `<div class="empty"><div class="big">＋</div><div class="small">从右侧选择净料 / 小料</div></div>`}</div></div>
        <div class="panel"><div class="panel-head">净料 / 小料<span class="cnt">显示当前库存</span></div>
          <div class="panel-body">${NETS.map(n=>{
            const stock=stockOf(n.id);
            return `<div class="pick" onclick="selfAdd(${n.id})"><div class="pt">${esc(n.name)}<span class="mono">${esc(n.code)}</span></div>
              <div class="pm"><span>${esc(n.l1)} / ${esc(n.l2)}</span><span>${n.pkg} g/份</span>
              <span class="rm" style="color:${stock>0?"var(--muted)":"#b91c1c"}">库存 ${stock} 份</span></div></div>`;
          }).join("")}</div></div>
      </div>
    </div>
    <div class="dialog-foot"><div class="spacer"></div><button class="btn outline" onclick="closeDialog()">取消</button>
      <button class="btn" onclick="saveSelf()">保存</button></div>
  </div>`);
}
function selfAdd(netId){ const exist=S.self.items.find(x=>x.netId===netId);
  if(exist){ exist.portions+=1; } else S.self.items.push({netId, portions:1}); renderSelfCreateDialog(); }
function selfPortion(i,v){ S.self.items[i].portions = Math.max(0,Number(v)||0); renderSelfCreateDialog(); }
function selfRemove(i){ S.self.items.splice(i,1); renderSelfCreateDialog(); }
function saveSelf(){
  const s=S.self;
  const kinds=s.items.length, portions=s.items.reduce((a,b)=>a+b.portions,0);
  if(s.mode==="edit"){ const o=SELFORDERS.find(x=>x.id===s.id); o.kinds=kinds; o.parts=portions; o.items=s.items; closeDialog(); toast("内部生产单已更新"); render(); return; }
  const ymd=s.date.replace(/-/g,"");
  const seq=SELFORDERS.filter(o=>o.date===s.date).length+1;
  const o={id:Date.now(), code:"SPO-"+ymd+"-"+String(seq).padStart(3,"0"), date:s.date, status:"待生效",
    title:"切配中心 · "+fmtDate(s.date)+"内部生产", remark:s.remark, kinds, portions, items:s.items, planId:null};
  SELFORDERS.unshift(o); closeDialog(); toast("内部生产单已创建："+o.code,"确认生产后可纳入生产计划单"); gotoSelfList();
}

/* ==================== 初始化 ==================== */
function bindEvents(){}
function boot(){
  render();
  const h=(location.hash||"").replace("#","");
  if(h==="create") openPlanCreate();
  else if(h==="detail") openPlanDetail(3);
  else if(h==="complete") openComplete(3);
  else if(h==="adjust") openAdjust(1);
  else if(h==="self") gotoSelfList();
  else if(h==="self-detail") openSelfDetail(2);
}
boot();
</script>
</body>
</html>
