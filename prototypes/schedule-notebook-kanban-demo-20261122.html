<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>排菜 · 笔记本式三列 Demo</title><style>
:root{--fg:#26252a;--muted:#726d67;--border:#e7e5e0;--border2:#d6d3cc;--surface:linear-gradient(180deg,#fff,#fdfcfb);--mutsurf:linear-gradient(180deg,#fbf9f6,#f6f3ef);--body:linear-gradient(180deg,#fcfbfa,#fbf9f6);--hi:inset 0 1px 0 rgba(255,255,255,.8);--inset:inset 0 1px 2px rgba(15,23,42,.05);--s1:0 1px 2px rgba(15,23,42,.05);--s2:0 2px 4px rgba(15,23,42,.06),0 12px 28px rgba(15,23,42,.1);--primary:linear-gradient(180deg,#f0813c,#e05a1e);--soft:linear-gradient(180deg,#fbeee5,#fbe7dc);--pink:#c2410c;--pborder:#f5b48d;--psh:0 1px 2px rgba(194,65,12,.4),0 4px 10px rgba(234,88,12,.22);--focus:#9ca3af;--warning:#b45309;--progress:#047857;--done:#6b7280}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{color:var(--fg);background:#fff;font-family:"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;font-size:14px;line-height:1.5}button,input{font:inherit;color:inherit}button{border:0;background:transparent;cursor:pointer}.app{min-height:100dvh;display:flex}.side{position:fixed;z-index:2;inset:0 auto 0 0;width:80px;display:flex;flex-direction:column;align-items:center;padding:16px 0;background:var(--surface);border-right:1px solid var(--border);box-shadow:var(--hi),var(--s1)}.logo{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:#fff;font-weight:800;background:var(--primary);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),var(--psh)}.brand{margin-top:5px;font-size:12px;color:var(--muted);font-weight:600}.nav{margin-top:24px;display:flex;flex:1;flex-direction:column;gap:6px}.ni{width:64px;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:10px;color:var(--muted);font-size:12px;font-weight:700}.ni:hover{background:var(--mutsurf);color:var(--fg)}.ni.on{color:var(--pink);background:var(--soft);box-shadow:inset 0 2px 3px rgba(194,65,12,.12),inset 0 1px 0 #fff,0 3px 10px rgba(234,88,12,.2)}.main{flex:1;min-width:0;margin-left:80px;height:100dvh;display:flex;flex-direction:column}.top{min-height:82px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 24px;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:var(--hi)}.h1{margin:0;font-size:20px;font-weight:800}.desc{margin:4px 0 0;color:var(--muted);font-size:13px}.pbtn{height:44px;padding:0 18px;display:inline-flex;align-items:center;gap:6px;border-radius:10px;color:#fff;font-weight:700;background:var(--primary);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),var(--psh)}.pbtn:active{transform:translateY(1px)}.work{flex:1;min-height:0;padding:20px 24px;background:var(--body);display:flex;flex-direction:column;gap:16px;overflow:hidden}.tools{display:flex;align-items:center;gap:8px}.search{position:relative;width:min(300px,36vw)}.search svg{position:absolute;left:12px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:#9c978f}.search input{width:100%;height:44px;padding:0 12px 0 36px;border:1px solid var(--border2);border-radius:10px;background:#fff;box-shadow:var(--inset);outline:none}.trigger{height:44px;display:inline-flex;align-items:center;gap:8px;padding:0 14px;border:1px solid var(--border2);border-radius:10px;background:#fff;box-shadow:var(--inset)}.sp{flex:1}.ghost{height:44px;padding:0 12px;display:flex;align-items:center;color:var(--muted);border-radius:10px;font-size:13px;font-weight:600}.ghost:hover{background:#f3f1ec;color:var(--fg)}.board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.col{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--hi),var(--s2)}.chead{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border);background:#fff;box-shadow:var(--hi)}.chead svg{width:18px;height:18px}.cname{font-size:14px;font-weight:800}.count{margin-left:auto;min-width:26px;height:22px;display:grid;place-items:center;padding:0 6px;border-radius:99px;background:#fff;border:1px solid var(--border);box-shadow:var(--hi),var(--s1);color:var(--pink);font-size:12px;font-weight:800}.cbody{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--body);scrollbar-width:thin;scrollbar-color:#d9d5ce transparent}.cbody::-webkit-scrollbar{width:10px}.cbody::-webkit-scrollbar-thumb{background:#d9d5ce;border-radius:99px;border:3px solid transparent;background-clip:content-box}.cfoot{padding:10px 16px;border-top:1px solid var(--border);background:#fff;color:var(--muted);font-size:12px;box-shadow:var(--hi)}
.note{position:relative;flex:none;height:258px;display:flex;flex-direction:column;background:linear-gradient(180deg,#fffdf7,#fdfaf3);border:1px solid #ddd6c8;border-radius:6px;box-shadow:0 1px 2px rgba(15,23,42,.06),0 8px 18px rgba(15,23,42,.07),inset 0 1px 0 rgba(255,255,255,.72);transition:.15s}.note:hover{transform:translateY(-1px);border-color:#cfc7b5;box-shadow:0 2px 4px rgba(15,23,42,.07),0 14px 26px rgba(15,23,42,.1)}.binding{position:relative;height:20px;background:linear-gradient(180deg,#f5f0e5,#faf7f0);border-bottom:1px solid #ddd6c8;border-radius:6px 6px 0 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.72)}.rings{position:absolute;bottom:-6px;left:22px;right:22px;display:flex;justify-content:space-between}.ring{width:8px;height:17px;border-radius:5px;background:linear-gradient(180deg,#e8e4da,#bfb9ad);border:1px solid #a9a294;box-shadow:inset 0 1px 0 rgba(255,255,255,.78),0 2px 4px rgba(15,23,42,.14)}.nmain{flex:1;min-height:0;padding:14px 15px 9px 17px;display:flex;flex-direction:column}.nhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.store{margin:0;font-size:17px;font-weight:800;color:#2b251d}.date{margin-top:2px;color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap}.dishes{flex:1;min-height:0;margin-top:9px}.dish{height:31px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;border-bottom:1px solid #e9e3d6}.dn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#4a443b;font-size:13px;font-weight:600}.dq{color:#3a342b;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}.dq small{margin-left:2px;color:var(--muted);font-size:12px;font-weight:600}.mor{height:30px;display:flex;align-items:center;justify-content:space-between}.mtext{color:var(--muted);font-size:12px;font-weight:600}.expand{height:24px;padding:0 6px;border-radius:6px;color:var(--pink);font-size:12px;font-weight:700}.expand:hover{background:var(--soft)}.nfoot{min-height:52px;padding:8px 13px;border-top:1px solid #e6e0d2;background:linear-gradient(180deg,#fffef9,#faf6ec);display:flex;align-items:center;justify-content:space-between;box-shadow:var(--hi)}.sum{color:#5d564a;font-size:12px;font-weight:700}.sum b{color:#332e24;font-size:15px}.acts{display:flex;gap:6px}.btn{height:30px;padding:0 9px;border-radius:8px;display:inline-flex;align-items:center;font-size:12px;font-weight:700;white-space:nowrap}.line{background:var(--surface);border:1px solid var(--border2);box-shadow:var(--hi),var(--s1)}.line:hover{background:#f6f3ef}.primary{color:var(--pink);background:var(--soft);border:1px solid var(--pborder);box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 1px 3px rgba(234,88,12,.14)}.primary:hover{filter:brightness(1.03)}.line:active,.primary:active{transform:translateY(1px)}

</style></head><body><div class="app"><aside class="side"><div><div class="logo">厨</div><div class="brand">精益厨房</div></div><nav class="nav"><button class="ni">工作台</button><button class="ni on">排菜</button><button class="ni">生产</button><button class="ni">采购</button><button class="ni">库存</button></nav></aside><main class="main"><header class="top"><div><h1 class="h1">排菜</h1><p class="desc">门店按售卖日期排菜品与份数；确认后进入进行中，由切配中心汇总成生产计划单</p></div><button class="pbtn">去排菜</button></header><div class="work"><div class="tools"><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input placeholder="搜索门店..." aria-label="搜索门店"></div><button class="trigger">11月24日</button><button class="trigger">全部门店</button><div class="sp"></div><button class="ghost">状态列显隐</button></div><section class="board" id="board"></section></div></main></div><script>
