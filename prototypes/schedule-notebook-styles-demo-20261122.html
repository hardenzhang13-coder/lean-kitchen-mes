*{box-sizing:border-box}html,body{height:100%;margin:0}body{color:var(--fg);background:#fff;font-family:"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;font-size:14px;line-height:1.5}button,input{font:inherit;color:inherit}button{border:0;background:transparent;cursor:pointer}.app{min-height:100dvh;display:flex}.side{position:fixed;z-index:2;inset:0 auto 0 0;width:80px;display:flex;flex-direction:column;align-items:center;padding:16px 0;background:var(--sf);border-right:1px solid var(--bd);box-shadow:var(--hi),var(--s1)}.logo{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:#fff;font-weight:800;background:var(--pri);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),var(--psh)}.brand{margin-top:5px;font-size:12px;color:var(--muted)}.nav{margin-top:24px;display:flex;flex:1;flex-direction:column;gap:6px}.ni{width:64px;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:10px;color:var(--muted);font-size:12px;font-weight:700}.ni.on{color:var(--pink);background:var(--soft);box-shadow:inset 0 2px 3px rgba(194,65,12,.12),inset 0 1px 0 #fff}.main{flex:1;min-width:0;margin-left:80px;height:100dvh;display:flex;flex-direction:column}.top{min-height:82px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 24px;background:var(--sf);border-bottom:1px solid var(--bd);box-shadow:var(--hi)}.h1{margin:0;font-size:20px;font-weight:800}.desc{margin:4px 0 0;color:var(--muted);font-size:13px}.pbtn{height:44px;padding:0 18px;display:flex;align-items:center;border-radius:10px;color:#fff;font-weight:700;background:var(--pri);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),var(--psh)}.work{flex:1;min-height:0;padding:20px 24px;background:var(--body);display:flex;flex-direction:column;gap:16px;overflow:hidden}.tools{display:flex;align-items:center;gap:8px}.search{position:relative;width:min(280px,32vw)}.search svg{position:absolute;left:12px;top:50%;width:16px;height:16px;t
