<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生产到出库流程重构 v009 · 精益厨房</title>
<style>
:root{
  --primary:#d3540c; --primary-hover:#b8460a; --primary-bg:#fff7ed; --primary-border:#fdba74;
  --bg:#fafafa; --card:#ffffff; --border:#e5e5e5; --border-2:#d4d4d4;
  --text:#0f172a; --muted:#737373; --muted-2:#a3a3a3; --surface:#fafafa;
  --success:#16a34a; --success-bg:#f0fdf4;
  --warning:#d97706; --warning-bg:#fffbeb;
  --danger:#dc2626; --danger-bg:#fef2f2;
  --info:#2563eb; --info-bg:#eff6ff;
  --solid-warning:#b45309; --solid-progress:#047857; --solid-done:#6b7280; --solid-neutral:#4b5563;
  --radius:12px; --radius-md:8px; --radius-sm:4px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
.app{display:flex;min-height:100vh}
/* ============ 侧栏 ============ */
.side{width:80px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:12px 0;position:sticky;top:0;height:100vh}
.brand{width:44px;height:44px;border-radius:10px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:6px}
.brand-name{font-size:10px;color:var(--muted);margin-bottom:16px}
.nav-item{width:64px;height:64px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:var(--muted);margin-bottom:6px;border:none;background:none;font-size:11px;font-family:inherit}
.nav-item .ico{font-size:18px}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{background:var(--primary-bg);color:var(--primary);font-weight:600}
.nav-item.locked{opacity:.45}
.main{flex:1;padding:24px 32px 64px;min-width:0;max-width:1600px}
/* ============ 页头 ============ */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
.page-head h1{font-size:24px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.page-head .sub{color:var(--muted);font-size:13px;margin-top:4px;max-width:720px}
.head-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer;margin-bottom:10px;font-size:13px;border:none;background:none;font-family:inherit}
.back:hover{color:var(--text)}
/* ============ 模块页签 ============ */
.mod-switch{display:inline-flex;background:var(--surface);border-radius:var(--radius-md);padding:3px;margin-bottom:14px;gap:2px}
.mod-switch button{border:none;background:none;padding:6px 14px;border-radius:6px;font-size:13px;color:var(--muted);cursor:pointer;font-family:inherit}
.mod-switch button.active{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
/* ============ 工具条 ============ */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.toolbar .spacer{flex:1}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:var(--radius-md);padding:0 12px;background:#fff;min-width:280px;height:38px}
.search input{border:none;outline:none;font-size:13px;flex:1;font-family:inherit;background:none;height:100%}
.picker{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:var(--radius-md);padding:0 12px;background:#fff;height:38px;font-size:13px;color:var(--text);cursor:pointer;min-width:190px;justify-content:space-between}
.picker.wide{min-width:380px}
.picker .ph{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:var(--radius-md);font-size:13px;cursor:pointer;border:1px solid transparent;background:var(--primary);color:#fff;font-weight:500;font-family:inherit;white-space:nowrap}
.btn:hover{background:var(--primary-hover)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.outline{background:#fff;border-color:var(--border);color:var(--text)}
.btn.outline:hover{background:var(--bg)}
.btn.ghost{background:none;color:var(--muted)}
.btn.ghost:hover{background:var(--bg);color:var(--text)}
.btn.danger{background:#fff;border-color:var(--danger);color:var(--danger)}
.btn.danger:hover{background:var(--danger-bg)}
.btn.sm{padding:6px 12px;font-size:12px}
.btn.xs{padding:4px 10px;font-size:12px;border-radius:6px}
/* ============ 看板 ============ */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.col{background:var(--surface);border-radius:var(--radius);padding:12px;min-height:220px}
.col-head{display:flex;align-items:flex-start;gap:8px;padding:2px 4px 12px}
.col-head .dot{width:9px;height:9px;border-radius:50%;margin-top:7px;flex-shrink:0}
.col-head .t{font-weight:700;font-size:14px}
.col-head .d{font-size:12px;color:var(--muted);line-height:1.5}
.col-head .cnt{margin-left:auto;font-size:12px;color:var(--muted);background:var(--card);border-radius:999px;padding:1px 9px;flex-shrink:0}
.col-list{display:flex;flex-direction:column;gap:10px}
/* ============ 单据卡（通用件） ============ */
.dcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px;cursor:pointer;transition:border-color .15s}
.dcard:hover{border-color:var(--primary-border)}
.dcard-num{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--muted-2);letter-spacing:.02em}
.dcard-title{font-size:15px;font-weight:600;margin-top:2px;line-height:1.4}
.dcard-metrics{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:13px;color:var(--muted)}
.dcard-metrics b{font-family:ui-monospace,Consolas,monospace;font-size:15px;color:var(--text);font-weight:700;margin-right:3px}
.dcard-prog{margin-top:10px}
.dcard-prog .line{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px}
.dcard-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}
.dcard-foot .who{font-size:12px;color:var(--muted)}
.bar{height:5px;background:var(--surface);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:999px}
.bar.ok i{background:var(--success)}
/* ============ 状态徽标（实底） ============ */
.badge{display:inline-flex;align-items:center;white-space:nowrap;border-radius:var(--radius-sm);padding:2px 9px;font-size:12px;font-weight:600;color:#fff}
.badge.pending{background:var(--solid-warning)}
.badge.doing{background:var(--solid-progress)}
.badge.done{background:var(--solid-done)}
.badge.neutral{background:var(--solid-neutral)}
.badge.soft{background:#f5f5f5;color:#525252;font-weight:500;border:1px solid var(--border)}
.badge.danger{background:var(--danger)}
.tag{display:inline-block;padding:1px 8px;border-radius:var(--radius-sm);font-size:12px}
.tag.veg{background:#f0fdf4;color:#16a34a}.tag.mea{background:#fef2f2;color:#dc2626}.tag.aqu{background:#eff6ff;color:#2563eb}.tag.pou{background:#fffbeb;color:#d97706}.tag.dry{background:#fff7ed;color:#ea580c}.tag.bea{background:#ecfeff;color:#0891b2}
.tag.soft{background:#f5f5f5;color:#525252;border:1px solid var(--border)}
/* ============ 摘要信息块 ============ */
.info-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.tile{border:1px solid var(--border);background:var(--card);border-radius:var(--radius-md);padding:12px 14px}
.tile .lb{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.tile .vl{font-size:15px;font-weight:600;margin-top:4px;line-height:1.4}
.tile .hl{font-size:12px;color:var(--muted);margin-top:2px}
/* ============ 页签 ============ */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px}
.tabs button{border:none;background:none;padding:9px 16px;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit}
.tabs button.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.tabs button .n{font-size:12px;color:var(--muted-2);margin-left:5px}
/* ============ 表格 ============ */
.tbl-wrap{border:1px solid var(--border);border-radius:var(--radius-md);overflow-x:auto;background:#fff}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:#fafafa;padding:9px 12px;text-align:left;font-weight:600;color:var(--muted);white-space:nowrap;border-bottom:1px solid var(--border)}
.tbl td{padding:9px 12px;border-bottom:1px solid #f5f5f5;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#fcfcfc}
.tbl tr.done td{background:var(--success-bg)}
.tbl tr.unfinished td{background:var(--danger-bg)}
.tbl tr.excluded td{background:#fafafa;color:var(--muted-2);text-decoration:line-through}
.tbl tr.excluded td .no-strike{text-decoration:none}
.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--muted)}
.strong{font-weight:600}
.dim{color:var(--muted)}
.small{font-size:12px}
/* ============ 弹窗 ============ */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow-y:auto}
.dialog{background:var(--card);border-radius:14px;width:100%;max-width:1200px;box-shadow:0 20px 60px rgba(0,0,0,.2);display:flex;flex-direction:column;max-height:calc(100vh - 80px)}
.dialog.compact{max-width:400px}
.dialog.form{max-width:560px}
.dialog.wide{max-width:880px}
.dialog-head{padding:18px 22px 12px;border-bottom:1px solid var(--border)}
.dialog-head h3{font-size:16px;font-weight:600}
.dialog-head .dsub{font-size:13px;color:var(--muted);margin-top:4px}
.dialog-body{padding:16px 22px;overflow-y:auto;flex:1}
.dialog-foot{padding:12px 22px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.dialog-foot .spacer{flex:1}
/* ============ 表单 ============ */
.field{display:flex;flex-direction:column;gap:6px}
.field .lb{font-size:13px;font-weight:500}
.field .lb .req{color:var(--danger);margin-left:2px}
.input{width:100%;border:1px solid var(--border);border-radius:var(--radius-md);padding:8px 12px;font-size:13px;outline:none;background:#fff;font-family:inherit;height:38px}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(211,84,12,.12)}
.input.num-in{width:84px;text-align:right;font-variant-numeric:tabular-nums;height:32px;padding:4px 8px}
.input.err{border-color:var(--danger)}
select.input{cursor:pointer}
.row1{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
/* ============ 汇总条 ============ */
.summary{display:flex;gap:22px;align-items:center;background:#fafafa;border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 16px;font-size:13px;flex-wrap:wrap}
.summary .item{display:flex;align-items:baseline;gap:5px}
.summary .item .lb{color:var(--muted);font-size:12px}
.summary .item b{font-size:17px;font-variant-numeric:tabular-nums}
.summary .item b.ok{color:var(--success)}.summary .item b.bad{color:var(--danger)}
.summary .sep{width:1px;height:20px;background:var(--border)}
/* ============ 提示条 ============ */
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:var(--radius-md);padding:10px 14px;font-size:13px;margin-bottom:14px;line-height:1.7}
.banner.info{background:var(--info-bg);border:1px solid #bfdbfe;color:#1e40af}
.banner.warn{background:var(--warning-bg);border:1px solid #fde68a;color:#92400e}
.banner.primary{background:var(--primary-bg);border:1px solid var(--primary-border);color:#9a3412}
.banner b{font-weight:700}
.banner .x{margin-left:auto;cursor:pointer;color:inherit;opacity:.6;border:none;background:none;font-size:15px;line-height:1}
/* ============ 来源选择（4:6） ============ */
.src-grid{display:grid;grid-template-columns:4fr 6fr;gap:16px;margin-bottom:18px}
.panel{border:1px solid var(--border);border-radius:var(--radius-md);display:flex;flex-direction:column;overflow:hidden;background:#fff}
.panel-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);background:#fafafa;font-size:13px;font-weight:600}
.panel-head .cnt{margin-left:auto;font-weight:400;color:var(--muted);font-size:12px}
.panel-body{padding:10px;overflow-y:auto;max-height:280px}
.pick{border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 12px;margin-bottom:8px;cursor:pointer;background:#fff}
.pick:hover{border-color:var(--primary-border)}
.pick.sel{border-color:var(--primary);background:var(--primary-bg)}
.pick .pt{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.pick .pm{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.pick .pm .rm{margin-left:auto;color:var(--danger);font-size:12px}
.pick.locked{opacity:.6;cursor:not-allowed;background:var(--surface)}
/* ============ 明细编辑器 ============ */
.editor{font-size:13px}
.editor th{padding:8px 10px}
.editor td{padding:6px 10px}
.editor .cell-in{border:1px solid var(--border);border-radius:6px;padding:3px 6px;background:#fff;font-family:inherit;font-size:13px;width:100%;text-align:right;font-variant-numeric:tabular-nums}
.editor .cell-in:hover{border-color:var(--border)}
.editor .cell-in:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(211,84,12,.1)}
.editor .cell-in.locked{color:var(--muted);background:var(--surface)}
.editor .cell-in:disabled{opacity:.55;background:var(--surface);cursor:not-allowed}
.editor td.act{text-align:right;white-space:nowrap}
.row-del{color:var(--danger);cursor:pointer;font-size:12px;border:none;background:none;font-family:inherit}
.row-del:hover{text-decoration:underline}
.editor-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.editor-bar .spacer{flex:1}
/* ============ 分段三态控件 ============ */
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;background:#fff}
.seg button{padding:5px 12px;font-size:12px;border:none;background:#fff;cursor:pointer;color:var(--muted);font-family:inherit;border-right:1px solid var(--border);white-space:nowrap}
.seg button:last-child{border-right:none}
.seg button.on-done{background:var(--success-bg);color:#15803d;font-weight:600}
.seg button.on-undone{background:var(--danger-bg);color:#b91c1c;font-weight:600}
.seg button.on-hold{background:#e5e7eb;color:var(--muted-2);font-weight:600}
.seg button:hover{background:#fafafa}
/* ============ 底部操作区（三槽） ============ */
.actions-bar{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--border);margin:20px -32px -64px;padding:12px 32px;display:flex;align-items:center;gap:8px}
.actions-bar .spacer{flex:1}
.actions-bar .slot-mid{display:flex;gap:8px;margin-left:auto}
/* ============ 空态 / 提示 ============ */
.empty{text-align:center;padding:56px 0;color:var(--muted)}
.empty .big{font-size:32px;margin-bottom:8px;opacity:.4}
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 22px;border-radius:var(--radius-md);font-size:13px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:70vw}
.toast .sub{display:block;color:#cbd5e1;font-size:12px;margin-top:3px}
/* ============ part1 追加 ============ */
.steps{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.steps .s{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.steps .s .n{width:22px;height:22px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.steps .s.on{color:var(--text);font-weight:600}
.steps .s.on .n{background:var(--primary);border-color:var(--primary);color:#fff}
.steps .s.done .n{background:var(--success-bg);border-color:var(--success);color:var(--success)}
.steps .sep{width:30px;height:1px;background:var(--border)}
.hint{font-size:12px;color:var(--muted);line-height:1.6}
.hint.bad{color:var(--danger);font-weight:600}
.hint.ok{color:var(--success)}
.hint.warn{color:var(--warning);font-weight:600}
.tbl tr.hold td{background:var(--warning-bg)}
.tbl tr.short td{background:var(--danger-bg)}
.chk{width:16px;height:16px;border-radius:4px;border:1px solid var(--border-2);display:inline-flex;align-items:center;justify-content:center;background:#fff;color:#fff;font-size:11px;line-height:1;flex-shrink:0}
.chk.on{background:var(--primary);border-color:var(--primary)}
.chk.off{background:#fff}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.store-card{border:1px solid var(--border);border-radius:var(--radius-md);padding:14px;background:#fff;cursor:pointer}
.store-card:hover{border-color:var(--primary-border)}
.store-card.sel{border-color:var(--primary);background:var(--primary-bg)}
.store-card .sn{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.store-card .sm{display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--muted)}
.store-card .sm b{font-size:17px;font-variant-numeric:tabular-nums;color:var(--text);display:inline-block;margin:0 2px 0 0}
.kv{display:flex;gap:10px;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--border)}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--muted);width:104px;flex-shrink:0}
.kv .v{font-weight:500;font-variant-numeric:tabular-nums}
.foot-note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.8}
.foot-note b{color:var(--text)}
.link{color:var(--primary);cursor:pointer;text-decoration:none;font-family:inherit;border:none;background:none;padding:0;font-size:12px}
.link:hover{text-decoration:underline}
.rowhint{display:block;font-size:12px;margin-top:3px;color:var(--muted)}
.rowhint.bad{color:var(--danger);font-weight:600}
.rowhint.ok{color:var(--success)}
.expander{border:none;background:none;cursor:pointer;color:var(--muted);font-size:11px;font-family:inherit;padding:0 4px 0 0}
.subrow td{background:#fcfcfc;padding:0 12px 12px 12px}
.subbox{border:1px dashed var(--border);border-radius:var(--radius-md);padding:10px 12px;background:#fff}
.subbox .sh{font-size:12px;color:var(--muted);margin-bottom:6px}
.dlgtpl{border:1px solid var(--border);border-radius:var(--radius-md);padding:16px 18px;background:#fff;font-size:13px}
.dlgtpl h4{font-size:15px;text-align:center;margin-bottom:4px}
.dlgtpl .dn{text-align:center;color:var(--muted);font-size:12px;margin-bottom:12px}
#p1-main > .main{padding:0}
#page-root{flex:1;min-width:0}
@media (max-width:1280px){ .info-grid{grid-template-columns:repeat(3,1fr)} .src-grid{grid-template-columns:1fr} }
@media (max-width:980px){ .board{grid-template-columns:1fr} .info-grid{grid-template-columns:repeat(2,1fr)} .main{padding:16px} .grid3{grid-template-columns:1fr} }
</style>
<style>
.fulfill{display:flex;flex-direction:column;gap:10px}
.fulfill-step{display:grid;grid-template-columns:92px 1fr 142px;align-items:center;gap:12px}
.fulfill-step .fs-lb{font-size:13px;color:var(--muted)}
.fulfill-bar{height:8px;border-radius:99px;background:var(--surface);overflow:hidden;border:1px solid var(--border)}
.fulfill-bar i{display:block;height:100%;border-radius:99px;background:var(--solid-progress);transition:width .2s cubic-bezier(.4,0,.2,1)}
.fulfill-bar.warn i{background:var(--solid-warning)}
.fulfill-bar.danger i{background:var(--danger)}
.fulfill-step .fs-vl{font-size:13px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.fulfill-step .fs-vl b{color:var(--text);font-weight:600}
.fulfill-step .fs-vl .gap{color:var(--danger);font-weight:600}
.fnote{margin-top:14px;border:1px solid var(--primary-border);border-left:3px solid var(--primary);border-radius:var(--radius-md);padding:10px 14px;background:var(--primary-bg);font-size:13px;line-height:1.6}
.fnote b{font-weight:600}
.rule-note{display:flex;align-items:flex-start;gap:9px;border:1px dashed var(--border-2);border-radius:var(--radius-md);padding:9px 13px;background:var(--surface);font-size:12px;color:var(--muted);margin-top:14px;line-height:1.65}

/* ==================== 主数据 ==================== */

var OUTBOUNDS = [

];

/* ==================== 取数与派生 ==================== */
/* id 归一：字符串与数字等价，避免外部脚本传入 "5" 时查不到 */
function sameId(a,b){ return a!=null && b!=null && String(a)===String(b); }
function netById(id){ for(var i=0;i<NETS.length;i++) if(sameId(NETS[i].id,id)) return NETS[i]; return null; }
function storeById(id){ for(var i=0;i<STORES.length;i++) if(sameId(STORES[i].id,id)) return STORES[i]; return null; }
function storeName(id){ var s=storeById(id); return s?s.name:"—"; }
function schById(id){ for(var i=0;i<SCHEDULES.length;i++) if(sameId(SCHEDULES[i].id,id)) return SCHEDULES[i]; return null; }
function batchById(id){ for(var i=0;i<BATCHES.length;i++) if(sameId(BATCHES[i].id,id)) return BATCHES[i]; return null; }
function obById(id){ for(var i=0;i<OUTBOUNDS.length;i++) if(sameId(OUTBOUNDS[i].id,id)) return OUTBOUNDS[i]; return null; }
function schPortions(s){ var t=0; s.items.forEach(function(it){ t+=it.portions; }); return t; }
function netPrice(id){ var n=netById(id); return n?n.price:0; }
/* 已占用 = 待出库单预定的份数（出库单确认出库后自动释放） */
function reservedOf(netId){
  var t=0;
  OUTBOUNDS.forEach(function(o){ if(o.status!=="待出库") return; o.lines.forEach(function(l){ if(l.netId===netId) t+=l.qty; }); });
  return t;
}
function stockOf(netId){
  var s = STOCK[netId] || {total:0,last:"—"};
  var rsv = reservedOf(netId);
  return {total:s.total, reserved:rsv, avail:R(s.total-rsv), last:s.last};
}
function batchUsedSchedIds(){
  var used={}; BATCHES.forEach(function(b){ (b.scheduleIds||[]).forEach(function(id){ used[id]=b.code; }); }); return used;
}
function obUsedSchedIds(){
  var used={}; OUTBOUNDS.forEach(function(o){ if(o.status==="已作废") return; used[o.scheduleId]=o.code; }); return used;
}
/* 批次行派生：需求 / 可用库存 / 建议生产 / 缺口 / 门店分配 */
/* ---- 兼容层：供 part2（排程履约）读取 ----
   批次行补充只读别名 plan / actual / kind，出库单补充 items 视图与 shipped 实际出货量 */
function decorateBatch(b){
  if(!Object.getOwnPropertyDescriptor(b,"schedIds")){
    Object.defineProperty(b,"schedIds",{enumerable:true, get:function(){ return b.scheduleIds||[]; }});
  }
  (b.rows||[]).forEach(function(r){
    if(!Object.getOwnPropertyDescriptor(r,"plan")){
      Object.defineProperty(r,"plan",{enumerable:true, get:function(){ return r.planned; }});
      Object.defineProperty(r,"actual",{enumerable:true, get:function(){
        var rc = b.receipts && b.receipts[r.netId]; return rc ? (rc.actual==null?null:rc.actual) : null; }});
      Object.defineProperty(r,"kind",{enumerable:true, get:function(){
        var fromSch = (b.scheduleIds||[]).some(function(sid){
          var s = schById(sid); if(!s) return false;
          return s.items.some(function(it){ return it.netId===r.netId; });
        });
        return fromSch ? "schedule" : "self";
      }});
    }
  });
}
function decorateOb(ob){
  if(!ob.lines) ob.lines = [];
  if(!ob.items) ob.items = ob.lines;
  ob.lines.forEach(function(l){
    if(!Object.getOwnPropertyDescriptor(l,"shipped")){
      Object.defineProperty(l,"shipped",{enumerable:true, get:function(){
        return ob.status==="已出库" ? l.qty : 0; }});
    }
  });
  return ob;
}
function batchRows(b){
  decorateBatch(b);
  var map = {}, order = [];
  function touch(nid){ if(!map[nid]){ map[nid]={netId:nid, planned:0, self:0, detail:[], receipt:(b.receipts&&b.receipts[nid])||null}; order.push(nid); } return map[nid]; }
  (b.rows||[]).forEach(function(r){ var o=touch(r.netId); o.planned=r.planned||0; o.self=r.self||0; });
  (b.scheduleIds||[]).forEach(function(sid){
    var s = schById(sid); if(!s) return;
    s.items.forEach(function(it){ var o=touch(it.netId); o.detail.push({storeId:s.storeId, schId:s.id, dish:it.dish, portions:it.portions}); });
  });
  order.forEach(function(nid){ var o=map[nid]; if(o.self>0) o.detail.push({storeId:null, schId:null, dish:"自主备货", portions:o.self}); });
  return order.map(function(nid){
    var o = map[nid], n = netById(nid), st = stockOf(nid);
    o.name=n.name; o.code=n.code; o.spec=n.spec; o.l1=n.l1; o.price=n.price;
    o.total=st.total; o.reserved=st.reserved; o.avail=st.avail;
    o.demand = R(o.detail.reduce(function(a,d){ return a+d.portions; },0));
    o.suggest = Math.max(0, R(o.demand - st.avail));
    o.diff = R(o.planned - o.suggest);
    o.shortage = Math.max(0, R(o.demand - st.avail - o.planned));
    o.alloc = allocate(o);
    return o;
  });
}
function allocPortions(weights, total){
  var sum = weights.reduce(function(a,b){ return a+b; },0);
  if(sum<=0 || total<=0) return weights.map(function(){ return 0; });
  if(total>sum) total=sum;
  var base = weights.map(function(w){ return Math.floor(w*total/sum); });
  var used = base.reduce(function(a,x){ return a+x; },0);
  var frac = weights.map(function(w,i){ return {i:i, f:w*total/sum-base[i]}; }).sort(function(a,b){ return b.f-a.f; });
  var rem = total-used;
  for(var k=0;k<rem;k++) base[frac[k%frac.length].i] += 1;
  return base;
}
/* 门店可获得份数 = 库存覆盖 + 本批次计划生产分配；剩余即为该门店的短交缺口 */
function allocate(o){
  if(!o.detail.length) return [];
  var d = o.detail.map(function(x){ return x.portions; });
  var cover = Math.min(o.avail, o.demand);
  var covered = allocPortions(d, cover);
  var remain = d.map(function(x,i){ return Math.max(0, x-covered[i]); });
  var plan = Math.min(o.planned, remain.reduce(function(a,b){ return a+b; },0));
  var planA = allocPortions(remain, plan);
  return o.detail.map(function(x,i){
    var get = covered[i] + planA[i];
    return {storeId:x.storeId, schId:x.schId, dish:x.dish, portions:x.portions, alloc:get, short:R(x.portions-get)};
  });
}
function batchStats(b){
  var rows = batchRows(b), st = {kinds:0,demand:0,suggest:0,planned:0,shortage:0,cover:0};
  rows.forEach(function(r){
    if(r.demand>0||r.planned>0){ st.kinds++; }
    st.demand=R(st.demand+r.demand); st.suggest=R(st.suggest+r.suggest); st.planned=R(st.planned+r.planned);
    st.shortage=R(st.shortage+r.shortage); st.cover=R(st.cover+Math.min(r.demand,r.avail));
  });
  return st;
}
/* 毛料换算：份 → 斤 */
function rawJin(portions, n){ return n.yld>0 ? R(portions*n.spec*100/n.yld/500) : 0; }

function nextBatchCode(){

function ncPicksHTML(){
  var nc = ST.nc, used = batchUsedSchedIds(), q = nc.q.trim();

    if(nc.fDate && s.demandDate!==nc.fDate) return false;

function prodDateOf(demandDate){
  var d = new Date(demandDate+"T00:00:00"); d.setDate(d.getDate()-1);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function ncRows(){
  var map = {}, order = [];
  function touch(nid){ if(!map[nid]){ map[nid]={netId:nid,demand:0,self:0}; order.push(nid); } return map[nid]; }
  ST.nc.sel.forEach(function(sid){
    var s = schById(sid); if(!s) return;
    s.items.forEach(function(it){ touch(it.netId).demand = R(touch(it.netId).demand + it.portions); });
  });
  ST.nc.self.forEach(function(r){ var o=touch(r.netId); o.demand=R(o.demand+r.portions); o.self=R(o.self+r.portions); });
  return order.map(function(nid){
    var o = map[nid], n = netById(nid), st = stockOf(nid);
    o.name=n.name; o.spec=n.spec; o.avail=st.avail; o.total=st.total; o.reserved=st.reserved;
    o.suggest = Math.max(0, R(o.demand - st.avail));
    o.gap = Math.max(0, R(o.demand - st.avail));
    o.cover = Math.min(o.demand, st.avail);
    return o;
  }).sort(function(a,b){ return b.demand-a.demand; });
}

    return {netId:r.netId, name:r.name, raw:n.raw, gross:gross, need:need, diff:diff, buy:need, money:R(need*n.rawPrice), price:n.rawPrice};
  });
}

/* ==================== 视图 5：创建出库单（2 步向导） ==================== */
function storeStats(storeId){
  var demand=0, shipped=0, nets={};
  SCHEDULES.forEach(function(s){
    if(s.storeId!==storeId) return;
    demand=R(demand+schPortions(s));
    s.items.forEach(function(it){ nets[it.netId]=1; });
    OUTBOUNDS.forEach(function(o){ if(o.scheduleId===s.id && o.status==="已出库") shipped=R(shipped+obQty(o)); });
  });
  var avail=0; Object.keys(nets).forEach(function(nid){ avail=R(avail+stockOf(nid).avail); });
  return {demand:demand, shipped:shipped, pending:R(demand-shipped), avail:avail, nets:Object.keys(nets).length};
}
function obQty(o){ var t=0; o.lines.forEach(function(l){ t+=l.qty; }); return t; }
function freeSchs(storeId){
  var used = obUsedSchedIds();
  return SCHEDULES.filter(function(s){ return s.storeId===storeId && !used[s.id]; });
}

    + '<div class="s '+(hasStore?"on":"")+'"><span class="n">2</span>确认出库明细</div></div>';
  return steps + vOutStep1() + vOutStep2();
}

function nowStr(){

}
function openBatch(id){ ST.batchId=id; ST.tab="tasks"; go("batch-detail"); }

function confirmBatch(id){
  var b = batchById(id); if(!b) return;

function initReceipts(b){
  if(!b || b.receipts) return;
  b.receipts = {};
  b.rows.forEach(function(r){ b.receipts[r.netId] = {actual:r.planned, status:"completed", reason:""}; });
}
function toggleExpand(netId){
  var k = ST.batchId+":"+netId;
  ST.expanded[k] = !ST.expanded[k];
  render();
}
function setPlanned(batchId, netId, val){
  var b = batchById(batchId); if(!b) return;
  var v = Math.max(0, Number(val)||0);
  b.rows.forEach(function(r){ if(r.netId===netId) r.planned=v; });

}
function fillSuggest(id){
  var b = batchById(id); if(!b) return;
  var rows = batchRows(b);
  rows.forEach(function(r){
    b.rows.forEach(function(x){ if(x.netId===r.netId) x.planned = r.suggest; });
  });
  TT("已按建议生产量填充全部 "+rows.length+" 行");
  render();
}
function recalcSuggest(id){
  var b = batchById(id); if(!b) return;
  TT("已按当前库存重算建议生产量","计划生产量未改动，可继续手动调整");
  render();
}
function delRow(batchId, netId){
  var b = batchById(batchId); if(!b) return;
  var n = netById(netId);
  var row = null;
  b.rows.forEach(function(r){ if(r.netId===netId) row=r; });
  var fromSchedule = (b.scheduleIds||[]).some(function(sid){
    var s = schById(sid); if(!s) return false;
    return s.items.some(function(it){ return it.netId===netId; });
  });
  if(fromSchedule){ TT("「"+n.name+"」的需求来自门店排程单，不能直接删除","请调整该排程单的关联或改量"); return; }
  dlgConfirm("删除批次行", "将从批次 "+b.code+" 中删除自主备货行「"+n.name+"」，其生产份数一并作废。", "删除", function(){
    b.rows = b.rows.filter(function(r){ return r.netId!==netId; });
    TT("已删除批次行");
    render();
  });
}
function setActual(batchId, netId, val){
  var b = batchById(batchId); if(!b) return;
  if(!b.receipts) b.receipts = {};
  if(!b.receipts[netId]) b.receipts[netId] = {actual:0,status:"completed",reason:""};
  b.receipts[netId].actual = Math.max(0, Number(val)||0);
  renderKeepFocus();
}
function setReason(batchId, netId, val){
  var b = batchById(batchId); if(!b) return;
  if(!b.receipts) b.receipts = {};
  if(!b.receipts[netId]) b.receipts[netId] = {actual:0,status:"unfinished",reason:""};
  b.receipts[netId].reason = val;
}
function setReceipt(batchId, netId, st){
  var b = batchById(batchId); if(!b) return;
  if(!b.receipts) b.receipts = {};
  if(!b.receipts[netId]) b.receipts[netId] = {actual:0,status:"completed",reason:""};
  b.receipts[netId].status = st;
  render();
}
function submitReceipt(id){
  var b = batchById(id); if(!b) return;
  var total=0;
  batchRows(b).forEach(function(r){
    var rc = b.receipts && b.receipts[r.netId];
    if(!rc) return;
    if(rc.status==="completed"){
      var a = rc.actual==null||rc.actual==="" ? r.planned : Number(rc.actual);
      if(a>0){ STOCK[r.netId].total = R(STOCK[r.netId].total + a); total=R(total+a); }
    }
  });
  b.status="已完成";
  TT("已入库 "+N(total)+" 份净菜，批次 "+b.code+" 已完成");
  render();
}
/* ---------- 新建批次页 ---------- */
function ncSetDate(v){ ST.nc.date=v; }
function ncSetShift(v){ ST.nc.shift=v; }
function ncFilterDate(v){ ST.nc.fDate=v; ncPaintPicks(); }
function ncFilterStore(v){ ST.nc.fStore=v; ncPaintPicks(); }
function ncFilterQ(v){ ST.nc.q=v; ncPaintPicks(); }
function ncClear(){ ST.nc.sel=[]; ST.nc.self=[]; ncPaintPicks(); ncPaint(); }
function ncToggle(sid){
  sid = (typeof sid === "string" && sid!=="" && !isNaN(sid)) ? Number(sid) : sid;
  var used = batchUsedSchedIds();
  if(used[sid]){ TT("排程单 "+used[sid]+" 已使用","一张排程单只能进入一个生产批次"); return; }
  var i = -1;
  for(var k=0;k<ST.nc.sel.length;k++){ if(sameId(ST.nc.sel[k], sid)){ i=k; break; } }
  if(i>=0) ST.nc.sel.splice(i,1); else ST.nc.sel.push(sid);
  ncPaintPicks();
  ncPaint();
}
function createBatch(){
  var nc = ST.nc;
  var rows = ncRows();
  if(!rows.length){ TT("请先勾选门店排程单，或用「自主加一行」安排生产"); return; }
  var b = {
    id: Date.now(), code: nextBatchCode(), productionDate: nc.date, shift: nc.shift,
    status:"草稿", operator:"杨厨", createdAt: nowStr(), scheduleIds: nc.sel.slice(),
    rows: rows.map(function(r){
      var o = {netId:r.netId, planned: r.self>0 ? Math.max(r.suggest, r.self) : r.suggest};
      if(r.self>0) o.self = r.self;
      return o;
    })
  };
  BATCHES.unshift(b);
  ST.batchId = b.id; ST.tab = "tasks";
  ST.nc = {date:nc.date, shift:nc.shift, sel:[], fDate:"", fStore:"", q:"", self:[]};
  go("batch-detail");
  TT("批次 "+b.code+" 已创建（草稿），确认后占用库存");
}
/* ---------- 出库 ---------- */
function outPickStore(id){
  ST.out.storeId=id; ST.out.schId=null; ST.out.lines=[];
  var free = freeSchs(id);
  if(free.length){ outSetSch(free[0].id); return; }
  render();
}
function outNext(){
  if(!ST.out.storeId){ TT("请先选择收货门店"); return; }
  ST.out.step=2;
  var free = freeSchs(ST.out.storeId);
  if(free.length && !ST.out.schId) outSetSch(free[0].id);
  render();
}
function outPrev(){ ST.out.step=1; render(); }
function outSetSch(sid){
  ST.out.schId = sid ? Number(sid) : null;
  ST.out.lines = [];
  if(ST.out.schId){
    var s = schById(ST.out.schId);
    s.items.forEach(function(it){
      var st = stockOf(it.netId);
      ST.out.lines.push({netId:it.netId, due:it.portions, qty: Math.min(it.portions, st.avail), manual:false});
    });
  }
  render();
}
function outSetQty(i, val){
  var l = ST.out.lines[i]; if(!l) return;
  var st = stockOf(l.netId);
  var v = Math.max(0, Number(val)||0);
  if(v>st.avail) v = st.avail;
  l.qty = v;
  renderKeepFocus();
}
function outDelLine(i){ ST.out.lines.splice(i,1); render(); }
function outAddLine(){
  if(!ST.out.storeId){ TT("请先选择收货门店","出库主体恒为门店，无门店不能出库"); return; }
  dlgManualLine();
}
function outSubmit(){
  var o = ST.out;
  if(!o.lines.length){ TT("请先选择来源排程单或手工加一行"); return; }
  var ob = {
    id: Date.now(), code: nextObCode(), storeId:o.storeId, scheduleId:o.schId,
    productionDate: o.schId ? prodDateOf(schById(o.schId).demandDate) : TODAY,
    status:"待出库", manager:"李明", createdAt: nowStr(),
    lines: o.lines.map(function(l){ return {netId:l.netId, qty:l.qty, due:l.due, manual:!!l.manual}; })
  };
  decorateOb(ob);
  OUTBOUNDS.unshift(ob);
  ST.obId = ob.id;
  ST.out = {step:1, storeId:null, schId:null, lines:[]};
  go("out-detail");
  TT("出库单 "+ob.code+" 已创建（待出库），已占用库存 "+N(obQty(ob))+" 份");
}
function openOb(id){ ST.obId=id; go("out-detail"); }
function confirmOb(id){
  var o = obById(id); if(!o) return;
  dlgConfirm("确认出库", "确认后出库单状态置为「已出库」，并按实出份数扣减净菜库存。", "确认出库", function(){
    o.lines.forEach(function(l){ STOCK[l.netId].total = R(STOCK[l.netId].total - l.qty); });
    o.status="已出库";
    TT("出库单 "+o.code+" 已确认出库，库存已扣减 "+N(obQty(o))+" 份");
    render();
  });
}
function voidOb(id){
  var o = obById(id); if(!o) return;
  dlgConfirm("作废出库单", "作废后出库单不可恢复，库存占用将释放。", "确认作废", function(){
    o.status="已作废";
    TT("出库单 "+o.code+" 已作废，库存占用已释放");
    render();
  });
}
function printOb(id){ dlgPrint(obById(id)); }
function doPrint(){ CL(); TT("已发送打印任务","原型不实际出纸"); }
function stub(msg){ TT("原型未覆盖：" + msg); }

/* ==================== 对外 API ==================== */
window.P1 = {
  /* 数据出口：供 part2（排程履约）与主会话直接读取，保持同一份引用 */
  data: { NETS:NETS, SCHEDULES:SCHEDULES, STOCK:STOCK, STORES:STORES, BATCHES:BATCHES, OUTBOUNDS:OUTBOUNDS },
  render: render, go: go, stub: stub, close: CL, runPending: runPending,
  setQ:function(v){ ST.q=v; render(); },
  setDateFilter:function(v){ ST.dateFilter=v; render(); },
  openBatch: openBatch, confirmBatch: confirmBatch, completeBatch: completeBatch,
  setTab: setTab, toggleExpand: toggleExpand, setPlanned: setPlanned,
  fillSuggest: fillSuggest, recalcSuggest: recalcSuggest, delRow: delRow,
  setActual: setActual, setReason: setReason, setReceipt: setReceipt, submitReceipt: submitReceipt,
  selfAdd: function(mode, batchId){ dlgSelfAdd(mode, batchId); },
  saveSelfAdd: saveSelfAdd,
  ncSetDate: ncSetDate, ncSetShift: ncSetShift, ncToggle: ncToggle,
  ncFilterDate: ncFilterDate, ncFilterStore: ncFilterStore, ncFilterQ: ncFilterQ,
  ncClear: ncClear, createBatch: createBatch,
  outPickStore: outPickStore, outNext: outNext, outPrev: outPrev, outSetSch: outSetSch,
  outSetQty: outSetQty, outDelLine: outDelLine, outAddLine: outAddLine, outSubmit: outSubmit,
  saveManualLine: saveManualLine, doPrint: doPrint,
  openOb: openOb, confirmOb: confirmOb, voidOb: voidOb, printOb: printOb
};
/* ==================== 对外全局（供 part2 / 主会话使用） ==================== */
function exposeGlobals(){
  if(typeof window.SCHEDULES === "undefined") window.SCHEDULES = SCHEDULES;
  if(typeof window.NETS === "undefined") window.NETS = NETS;
  if(typeof window.STOCK === "undefined") window.STOCK = STOCK;
  if(typeof window.STORES === "undefined") window.STORES = STORES;
  if(typeof window.BATCHES === "undefined") window.BATCHES = BATCHES;
  if(typeof window.OUTBOUNDS === "undefined") window.OUTBOUNDS = OUTBOUNDS;
  if(typeof num !== "function") window.num = N;
  if(typeof esc !== "function") window.esc = E;
  if(typeof fmtDate !== "function") window.fmtDate = FD;
  if(typeof window.go !== "function") window.go = function(v,arg){
    if(v==="batches"||v==="batch-list"){ P1.go("batch-list"); return; }
    if(v==="inventory"||v==="stock"){ P1.go("inventory"); return; }
    if(v==="batch-detail"){ P1.openBatch(Number(arg)); return; }
    if(v==="schedules" && typeof window.renderScheduleList === "function"){ window.renderScheduleList(); return; }
    if(v==="schedule-detail" && typeof window.renderScheduleDetail === "function"){ window.renderScheduleDetail(Number(arg)); return; }
    P1.stub(v);
  };
  if(typeof window.goto !== "function") window.goto = window.go;
}
exposeGlobals();
function boot(){
  exposeGlobals();
  BATCHES.forEach(decorateBatch);
  OUTBOUNDS.forEach(decorateOb);
  /* 若主会话外壳已提供 #page-root，则把本片内容区搬进去并隐藏重复侧栏 */
  var pr = document.getElementById("page-root"), main = document.getElementById("p1-main");
  if(pr && main && main.parentNode !== pr) pr.appendChild(main);
  var mySide = document.querySelector("#p1-app > .side");
  if(mySide && document.querySelectorAll(".side").length>1) mySide.style.display="none";
  var m = hostEl();
  if(m && !m.innerHTML.trim()) render();
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();

</script>
<script>
(function(){
  function D(){ return (window.P1 && window.P1.data) ? window.P1.data : null; }
  function esc2(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function n2(v){ var x=Number(v)||0; return Math.round(x*100)/100; }

  /** 某净料在所有批次中的实际产出（已完成用回执值，已确认用需求量作已备货） */
  function producedByNet(d){
    var out = {};
    d.BATCHES.forEach(function(b){
      if(b.status !== "已完成" && b.status !== "已确认") return;
      (b.rows||[]).forEach(function(r){
        var amt;
        if(b.status === "已完成"){
          var rc = (b.receipts||{})[r.netId];
          amt = n2(rc && rc.actual != null ? rc.actual : r.planned);
        } else {
          amt = n2(r.planned);
        }
        out[r.netId] = n2((out[r.netId]||0) + amt);
      });
    });
    return out;
  }

  /** 某净料在所有出库单中的已出库量 */
  function shippedByNet(d){
    var out = {};
    d.OUTBOUNDS.forEach(function(o){
      if(o.status === "已作废") return;
      (o.lines||[]).forEach(function(l){ out[l.netId] = n2((out[l.netId]||0) + n2(l.qty)); });
    });
    return out;
  }

  /** 取某排程单的履约三段数据 */
  function fulfillData(schedId){
    var d = D(); if(!d) return null;
    var sch = d.SCHEDULES.find(function(x){ return x.id === schedId; });
    if(!sch) return null;
    var items = sch.items || [];
    var totalDemand = items.reduce(function(a,x){ return a + n2(x.portions); }, 0);
    var prod = producedByNet(d), ship = shippedByNet(d);

    // 本排程涉及净料的产出/出货，按需求占比折算到本排程
    // 份为整数主单位：按占比折算后取整（显示口径，避免 7.04 份这类假精度）
    function parts(x){ return Math.round(x); }
    var rows = items.map(function(it){
      var dem = parts(it.portions);
      var ratio = totalDemand > 0 ? dem / totalDemand : 0;
      var poolPrep = n2(prod[it.netId] || 0);
      var poolShip = n2(ship[it.netId] || 0);
      var prep = Math.min(dem, parts(poolPrep * ratio));
      var shp  = Math.min(prep, parts(poolShip * ratio));
      return { netId: it.netId, dish: it.dish, demand: dem, prepared: prep, shipped: shp };
    });

    return {
      sch: sch,
      demand: n2(rows.reduce(function(a,r){ return a + r.demand; }, 0)),
      prepared: n2(rows.reduce(function(a,r){ return a + r.prepared; }, 0)),
      shipped: n2(rows.reduce(function(a,r){ return a + r.shipped; }, 0)),
      rows: rows
    };
  }

  function pct(a,b){ return b > 0 ? Math.min(100, Math.round(a/b*100)) : 0; }

  function fulfillBlock(schedId){
    var f = fulfillData(schedId);
    if(!f) return "";
    var D0 = f.demand, P = f.prepared, S = f.shipped;
    var gap1 = Math.max(0, D0 - P), gap2 = Math.max(0, P - S);
    function step(lb, val, tot, cls, gapTxt){
      return '<div class="fulfill-step">'
        + '<div class="fs-lb">' + lb + '</div>'
        + '<div class="fulfill-bar ' + (cls||"") + '"><i style="width:' + pct(val,tot) + '%"></i></div>'
        + '<div class="fs-vl"><b>' + n2(val) + '</b> / ' + n2(tot) + ' 份'
        + (gapTxt ? ' <span class="gap">' + gapTxt + '</span>' : '') + '</div>'
        + '</div>';
    }
    var note;
    if(gap1 > 0){
      note = '<div class="fnote"><b>备货缺口 ' + n2(gap1) + ' 份</b>：切配中心尚未产出足够的净菜。可减少该排程份数、改用替代菜品，或等待下一批次补货。</div>';
    } else if(gap2 > 0){
      note = '<div class="fnote"><b>配送缺口 ' + n2(gap2) + ' 份</b>：净菜已备货但尚未出库。</div>';
    } else {
      note = '<div class="fnote"><b>履约正常</b>：需求已备货并完成配送。</div>';
    }
    return '<div class="fulfill">'
      + step("已出库", S, D0, gap2 > 0 ? "danger" : "", gap2 > 0 ? ("缺 " + n2(gap2)) : "")
      + step("已备货", P, D0, gap1 > 0 ? "warn" : "", gap1 > 0 ? ("缺 " + n2(gap1)) : "")
      + step("需求量", D0, D0, "", "")
      + '</div>' + note;
  }

  /** 排程详情页：渲染进 #p1-main */
  function renderScheduleDetail(schedId){
    var m = document.getElementById("p1-main"); if(!m) return;
    var d = D(); if(!d) return;
    var f = fulfillData(schedId); if(!f){ m.innerHTML = ""; return; }
    var sch = f.sch;
    var store = d.STORES.find(function(s){ return s.id === sch.storeId; });
    var storeNm = store ? store.name : "—";
    var st = sch.status === "已确认" ? "doing" : (sch.status === "已完成" ? "done" : "pending");

    m.innerHTML = '<div style="padding:0">'
      + '<div class="back" onclick="P1.go(\'batch-list\')">← 返回生产批次</div>'
      + '<div class="page-head">'
      +   '<div><h1>' + esc2(storeNm) + ' · ' + esc2(sch.demandDate) + ' 用菜单</h1>'
      +   '<div class="sub">' + sch.items.length + ' 道菜 · 共 ' + n2(f.demand) + ' 份净菜需求 · 需求日 ' + esc2(sch.demandDate) + '</div></div>'
      +   '<div class="head-actions"><span class="badge ' + st + '">' + esc2(sch.status) + '</span></div>'
      + '</div>'
      + '<div class="card" style="padding:16px;margin-bottom:16px">'
      +   '<div style="font-size:14px;font-weight:600;margin-bottom:14px">履约进度</div>'
      +   fulfillBlock(schedId)
      + '</div>'
      + '<div class="card" style="padding:16px">'
      +   '<div style="font-size:14px;font-weight:600;margin-bottom:10px">菜品与净菜需求</div>'
      +   '<div class="tbl-wrap"><table class="tbl"><thead><tr>'
      +     '<th>菜品</th><th class="text-right">需求份数</th><th class="text-right">已备货</th>'
      +     '<th class="text-right">已出库</th><th class="text-right">缺口</th>'
      +   '</tr></thead><tbody>'
      +   f.rows.map(function(r){
          var gap = Math.max(0, r.demand - r.shipped);
          var net = d.NETS.find(function(x){ return x.id === r.netId; });
          return '<tr' + (gap > 0 ? ' class="gap-row"' : '') + '>'
            + '<td><span class="font-medium">' + esc2(r.dish) + '</span>'
            + (net ? ' <span class="fs-12 text-muted-2">' + esc2(net.name) + ' · ' + esc2(net.pkg) + 'g/份</span>' : '') + '</td>'
            + '<td class="text-right tabular-nums">' + n2(r.demand) + '</td>'
            + '<td class="text-right tabular-nums' + (r.prepared >= r.demand ? " text-success" : (r.prepared > 0 ? " text-warning" : "")) + '">' + n2(r.prepared) + '</td>'
            + '<td class="text-right tabular-nums' + (r.shipped >= r.demand ? " text-success" : "") + '">' + n2(r.shipped) + '</td>'
            + '<td class="text-right tabular-nums' + (gap > 0 ? " text-danger" : " text-muted-2") + '">' + (gap > 0 ? n2(gap) : "—") + '</td>'
            + '</tr>';
        }).join("")
      +   '</tbody></table></div>'
      +   '<div class="rule-note"><span class="rn-ico">i</span><div>'
      +     '<b>字段纪律：</b>本表只保留 <code>菜品</code> <code>需求份数</code> <code>已备货</code> <code>已出库</code> <code>缺口</code> 五列 —— '
      +     '一级/二级分类、编号、净料用量(g)、规格均为档案属性，不参与履约判断，已降为次要信息。'
      +   '</div></div>'
      + '</div>'
      + '</div>';
  }

  window.renderScheduleDetail = renderScheduleDetail;
  window.fulfillData = fulfillData;
  window.fulfillBlock = fulfillBlock;
})();
</script>
</body>
