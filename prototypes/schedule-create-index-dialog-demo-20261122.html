<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>去排菜 · 索引卡册弹窗 Demo</title><style>
:root{--fg:#26252a;--muted:#75706a;--bd:#e7e5e0;--bd2:#d6d3cc;--sf:linear-gradient(180deg,#fff,#fdfcfb);--mut:linear-gradient(180deg,#fbf9f6,#f6f3ef);--body:linear-gradient(180deg,#fcfbfa,#fbf9f6);--hi:inset 0 1px 0 rgba(255,255,255,.8);--ins:inset 0 1px 2px rgba(15,23,42,.05);--s1:0 1px 2px rgba(15,23,42,.05);--s2:0 2px 4px rgba(15,23,42,.06),0 12px 28px rgba(15,23,42,.1);--pri:linear-gradient(180deg,#f0813c,#e05a1e);--soft:linear-gradient(180deg,#fbeee5,#fbe7dc);--pink:#c2410c;--pb:#f5b48d;--psh:0 1px 2px rgba(194,65,12,.4),0 4px 10px rgba(234,88,12,.22);--focus:#9ca3af;--green:#047857;--greenbd:#bfdacd}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{color:var(--fg);background:linear-gradient(180deg,#fcfbfa,#f6f3ef);font-family:"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;font-size:14px;line-height:1.5}button,input{font:inherit;color:inherit}button{border:0;background:transparent;cursor:pointer}
.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:rgba(38,37,42,.28);backdrop-filter:blur(2px)}.dialog{width:min(1200px,calc(100vw - 48px));height:min(780px,calc(100dvh - 48px));display:flex;flex-direction:column;overflow:hidden;background:var(--sf);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--hi),0 24px 48px rgba(15,23,42,.2),0 48px 90px rgba(15,23,42,.16)}
.head{position:relative;flex:none;padding:22px 24px 18px;border-bottom:1px solid var(--bd);background:var(--sf);box-shadow:var(--hi)}.title{margin:0;font-size:19px;font-weight:800}.desc{margin:5px 0 0;color:var(--muted);font-size:13px}.close{position:absolute;top:18px;right:18px;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;color:var(--muted);background:var(--sf);border:1px solid var(--bd2);box-shadow:var(--hi),var(--s1)}.close:hover{background:#f6f3ef}.close:active{transform:translateY(1px);box-shadow:var(--ins)}
.body{flex:1;min-height:0;padding:18px 20px;overflow:auto;background:var(--body);display:flex;flex-direction:column;gap:14px}.info{flex:none;display:grid;grid-template-columns:minmax(260px,1fr) minmax(220px,.8fr) minmax(220px,.9fr);gap:12px;padding:14px;border:1px solid var(--bd);border-radius:12px;background:var(--sf);box-shadow:var(--hi),var(--s1)}.label{display:block;margin-bottom:6px;color:var(--muted);font-size:12px;font-weight:700}.required{color:#c2410c}.trigger{width:100%;height:44px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 13px;border:1px solid var(--bd2);border-radius:10px;background:#fff;box-shadow:var(--ins)}.trigger:hover{background:#f8f5f0}.trigger svg{width:16px;height:16px;color:#9c978f}
.preview{padding:10px 12px;border:1px solid var(--greenbd);border-radius:10px;background:linear-gradient(180deg,#f5fbf7,#e9f4ee);box-shadow:var(--hi),var(--s1)}.preview-label{display:block;color:#537263;font-size:12px;font-weight:700}.preview-text{margin-top:5px;font-size:14px;font-weight:800}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(320px,4fr) minmax(0,7fr);gap:14px}.panel{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:var(--sf);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--hi),var(--s2)}.phead{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;border-bottom:1px solid var(--bd);background:#fff;box-shadow:var(--hi)}.pname{margin:0;font-size:14px;font-weight:800}.pmeta{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}.pmeta b{color:var(--fg)}.pbody{flex:1;min-height:0;overflow:auto;padding:12px;background:var(--body);scrollbar-width:thin;scrollbar-color:#d9d5ce transparent}.pbody::-webkit-scrollbar{width:10px}.pbody::-webkit-scrollbar-thumb{background:#d9d5ce;border-radius:99px;border:3px solid transparent;background-clip:content-box}.pfoot{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--bd);background:#fff;color:var(--muted);font-size:12px;box-shadow:var(--hi)}.clear{height:28px;padding:0 8px;border-radius:8px;color:#a3572f;font-size:12px;font-weight:700}.clear:hover{background:var(--soft)}
.selected{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;margin-bottom:9px;padding:11px 11px 10px;border:1px solid #ddd6c8;border-radius:7px;background:linear-gradient(180deg,#fffdf8,#faf6ee);box-shadow:var(--hi),0 6px 13px rgba(15,23,42,.05)}.selected:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:4px;background:linear-gradient(180deg,#e5ded1,#c9c2b3)}.selinfo{min-width:0;padding-left:4px}.selname{color:#3a352c;font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.selmeta{margin-top:3px;color:var(--muted);font-size:12px}.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;margin-right:4px;border-radius:99px;background:#f4f2ee;color:#6c675f;font-size:11px;font-weight:700}.remove{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;color:var(--muted);background:var(--sf);border:1px solid var(--bd2);box-shadow:var(--hi),var(--s1)}.remove:hover{color:#b42318;background:#fef2f2}.qtyrow{grid-column:1/-1;display:flex;align-items:center;justify-content:flex-end;gap:5px;margin-top:6px}.step{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:var(--sf);border:1px solid var(--bd2);box-shadow:var(--hi),var(--s1)}.step:hover{background:#f6f3ef}.step:active{transform:translateY(1px);box-shadow:var(--ins)}.qty{width:58px;height:28px;text-align:center;border:1px solid var(--bd2);border-radius:8px;background:#fff;box-shadow:var(--ins);outline:none;font-weight:800}.unit{color:var(--muted);font-size:12px}
.tools{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--bd);background:#fff;box-shadow:var(--hi)}.search{position:relative;flex:1;min-width:180px}.search svg{position:absolute;left:11px;top:50%;width:15px;height:15px;transform:translateY(-50%);color:#9c978f}.search input{width:100%;height:40px;padding:0 10px 0 33px;border:1px solid var(--bd2);border-radius:10px;background:#fff;box-shadow:var(--ins);outline:none}.cat{height:40px;padding:0 12px;border-radius:10px;color:#6d675f;background:var(--mut);border:1px solid var(--bd);box-shadow:var(--hi),var(--s1);font-size:13px;font-weight:700}.cat.on{color:var(--pink);background:var(--soft);border-color:var(--pb);box-shadow:inset 0 2px 3px rgba(194,65,12,.1),var(--hi)}
.dishes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.dish{position:relative;min-height:112px;padding:11px;border:1px solid #ded9cd;border-radius:8px;text-align:left;background:linear-gradient(180deg,#fffdf8,#faf7f1);box-shadow:var(--hi),0 6px 14px rgba(15,23,42,.05);transition:.12s}.dish:hover{transform:translateY(-1px);border-color:#cbc5b8}.dish:active{transform:translateY(1px);box-shadow:var(--ins)}.dish.on{border-color:var(--pb);background:linear-gradient(180deg,#fff8f1,#fdeee1);box-shadow:inset 0 1px 0 rgba(255,255,255,.78),0 6px 16px rgba(234,88,12,.1)}.dishtop{display:flex;align-items:center;justify-content:space-between;gap:8px}.catchip{height:21px;padding:0 7px;display:inline-flex;align-items:center;border-radius:99px;background:#f4f1eb;color:#6d675f;font-size:11px;font-weight:700}.pick{position:relative;width:24px;height:24px;border-radius:50%;background:#fff;border:1px solid var(--bd2);box-shadow:var(--hi),var(--s1)}.dish.on .pick{border-color:#ea7a3c;background:var(--soft)}.pick svg{position:absolute;inset:5px;width:14px;height:14px;color:var(--pink);opacity:0}.dish.on .pick svg{opacity:1}.dishname{margin:8px 0 0;color:#36312a;font-size:14px;font-weight:800}.dishcode{margin-top:3px;color:var(--muted);font-size:12px;font-family:ui-monospace,Consolas,monospace}.portion{display:inline-flex;align-items:center;gap:4px;height:21px;margin-top:8px;padding:0 7px;border-radius:99px;background:#eef2f6;color:#51617a;font-size:11px;font-weight:700}.portion:before{content:"";width:5px;height:5px;border-radius:50%;background:#7d93b5}.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px}
.foot{flex:none;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 20px;border-top:1px solid var(--bd);background:#fff;box-shadow:var(--hi)}.validation{display:flex;align-items:center;gap:8px;min-width:0;color:var(--muted);font-size:13px}.state{width:22px;height:22px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--mut);border:1px solid var(--bd);box-shadow:var(--hi)}.state svg{width:13px;height:13px;color:#8a847c}.ok .state{background:#eaf6ef;border-color:var(--greenbd)}.ok .state svg{color:#1e6d47}.ok .validation{color:#4d6b5c;font-weight:700}.actions{display:flex;gap:8px}.btn{height:44px;padding:0 18px;display:inline-flex;align-items:center;border-radius:10px;font-size:14px;font-weight:800}.outline{color:var(--fg);background:var(--sf);border:1px solid var(--bd2);box-shadow:var(--hi),var(--s1)}.primary{color:#fff;background:var(--pri);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),var(--psh)}.primary:disabled{opacity:.45;box-shadow:none;cursor:not-allowed}.outline:hover{background:#f6f3ef}.primary:hover{filter:brightness(1.04)}
@media(max-width:1080px){.main{grid-template-columns:1fr}.panel.left{min-height:360px}.dishes{grid-template-columns:repeat(2,minmax(0,1fr))}.info{grid-template-columns:1fr}}@media(max-width:720px){.overlay{padding:12px}.dialog{height:calc(100dvh - 24px)}.dishes{grid-template-columns:1fr}.foot{flex-direction:column;align-items:stretch}.actions{display:grid;grid-template-columns:1fr 1fr}}
</style></head><body><div class="overlay"><section class="dialog" aria-label="去排菜弹窗"><header class="head"><h1 class="title">去排菜</h1><p class="desc">先确认门店与售卖日期，再从已发布菜品中组成当日菜单。</p><button class="close" type="button" aria-label="关闭"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
<div class="body"><section class="info" aria-label="基础信息"><div><label class="label"><span class="required">*</span> 选择门店</label><button class="trigger"><span>新金食堂</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button></div><div><label class="label"><span class="required">*</span> 售卖日期</label><button class="trigger"><span>2026-11-24 · 周二</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3v4M16 3v4M3 9h18"/><rect x="3" y="5" width="18" height="16" rx="3"/></svg></button></div><div class="preview"><span class="preview-label">自动生成标题</span><div class="preview-text">新金食堂 · 周二（11月24日）· 菜单</div></div></section>
<div class="main"><section class="panel left"><header class="phead"><h2 class="pname">已排菜单</h2><span class="pmeta"><b id="dishCount">4</b> 道 · <b id="portionCount">44</b> 份</span></header><div class="pbody" id="selectedList"></div><footer class="pfoot"><span>默认份数为 1，可在行内调整</span><button class="clear" id="clearAll" type="button">清空菜单</button></footer></section>
<section class="panel"><div class="tools"><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" type="search" placeholder="搜索菜品名称..." aria-label="搜索菜品名称"></div><button class="cat on" data-cat="all">全部</button><button class="cat" data-cat="猪肉类">猪肉类</button><button class="cat" data-cat="牛肉类">牛肉类</button><button class="cat" data-cat="蔬菜类">蔬菜类</button><button class="cat" data-cat="水产类">水产类</button></div><div class="pbody"><div class="dishes" id="dishGrid"></div><div class="empty" id="dishEmpty" hidden>未找到匹配的已发布菜品</div></div><footer class="pfoot"><span>仅展示已发布菜品</span><span id="availableCount">共 10 道可选</span></footer></section></div></div>
<footer class="foot" id="foot"><div class="validation"><span class="state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg></span><span id="validationText">请至少选择一道菜品</span></div><div class="actions"><button class="btn outline">取消</button><button class="btn primary" id="submit" disabled>完成排菜</button></div></footer></section></div>
<script>
var dishes=[{id:1,name:'红烧肉',code:'DSH-PORK-001',cat:'猪肉类',portion:'小碗菜',qty:12},{id:2,name:'番茄炒蛋',code:'DSH-VEG-004',cat:'蔬菜类',portion:'小碗菜',qty:10},{id:3,name:'清炒时蔬',code:'DSH-VEG-011',cat:'蔬菜类',portion:'社区',qty:8},{id:4,name:'酱香排骨',code:'DSH-PORK-006',cat:'猪肉类',portion:'小碗菜',qty:6},{id:5,name:'土豆烧牛腩',code:'DSH-BEEF-003',cat:'牛肉类',portion:'食堂',qty:4},{id:6,name:'干锅花菜',code:'DSH-VEG-015',cat:'蔬菜类',portion:'社区',qty:3},{id:7,name:'清蒸鲈鱼',code:'DSH-AQU-002',cat:'水产类',portion:'食堂',qty:2},{id:8,name:'麻婆豆腐',code:'DSH-VEG-021',cat:'蔬菜类',portion:'小碗菜',qty:1},{id:9,name:'卤鸡腿',code:'DSH-MEA-005',cat:'猪肉类',portion:'食堂',qty:1},{id:10,name:'蒜蓉西兰花',code:'DSH-VEG-030',cat:'蔬菜类',portion:'社区',qty:1}];
var selected=dishes.slice(0,4).map(function(d){return{id:d.id,qty:d.qty}}),search='',cat='all';var grid=document.getElementById('dishGrid'),list=document.getElementById('selectedList');
function byId(id){return dishes.find(function(d){return d.id===id})}function row(id){return selected.find(function(d){return d.id===id})}
function library(){var rows=dishes.filter(function(d){return(!search||d.name.toLowerCase().includes(search)||d.code.toLowerCase().includes(search))&&(cat==='all'||d.cat===cat)});grid.innerHTML='';rows.forEach(function(d){var on=!!row(d.id),b=document.createElement('button');b.type='button';b.className='dish'+(on?' on':'');b.setAttribute('aria-pressed',on);b.innerHTML='<div class="dishtop"><span class="catchip">'+d.cat+'</span><span class="pick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 13 4 4L19 7"/></svg></span></div><h3 class="dishname">'+d.name+'</h3><div class="dishcode">'+d.code+'</div><span class="portion">'+d.portion+'</span>';b.onclick=function(){var r=row(d.id);if(r)selected=selected.filter(function(x){return x.id!==d.id});else selected.push({id:d.id,qty:1});render()};grid.appendChild(b)});document.getElementById('dishEmpty').hidden=rows.length!==0;document.getElementById('availableCount').textContent='共 '+rows.length+' 道可选'}
function picked(){list.innerHTML='';selected.forEach(function(r){var d=byId(r.id),el=document.createElement('article');el.className='selected';el.innerHTML='<div class="selinfo"><div class="selname">'+d.name+'</div><div class="selmeta"><span class="tag">'+d.cat+'</span><span class="tag">'+d.portion+'</span>'+d.code+'</div></div><button class="remove" aria-label="移除'+d.name+'"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button><div class="qtyrow"><button class="step dec" aria-label="减少'+d.name+'份数"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg></button><input class="qty" type="number" min="1" value="'+r.qty+'" aria-label="'+d.name+'份数"><button class="step inc" aria-label="增加'+d.name+'份数"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button><span class="unit">份</span></div>';el.querySelector('.remove').onclick=function(){selected=selected.filter(function(x){return x.id!==r.id});render()};el.querySelector('.dec').onclick=function(){r.qty=Math.max(1,r.qty-1);render()};el.querySelector('.inc').onclick=function(){r.qty++;render()};var input=el.querySelector('.qty');input.onchange=function(){var v=Number(this.value);r.qty=Number.isFinite(v)&&v>0?Math.floor(v):1;render()};list.appendChild(el)});if(!selected.length)list.innerHTML='<div class="empty">请在右侧选择菜品</div>'}
function validation(){var count=selected.length,total=selected.reduce(function(s,x){return s+x.qty},0),foot=document.getElementById('foot'),text=document.getElementById('validationText'),submit=document.getElementById('submit');document.getElementById('dishCount').textContent=count;document.getElementById('portionCount').textContent=total;if(!count){foot.classList.remove('ok');text.textContent='请至少选择一道菜品';submit.disabled=true}else{foot.classList.add('ok');text.textContent='将生成 '+count+' 道菜品 / '+total+' 份';submit.disabled=false}}
function render(){library();picked();validation()}document.getElementById('search').oninput=function(){search=this.value.trim().toLowerCase();library()};document.querySelectorAll('.cat').forEach(function(b){b.onclick=function(){document.querySelectorAll('.cat').forEach(function(x){x.classList.toggle('on',x===b)});cat=b.dataset.cat;library()}});document.getElementById('clearAll').onclick=function(){selected=[];render()};render();
</script></body></html>
