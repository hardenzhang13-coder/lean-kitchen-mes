<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>食材分类卡 · 拟物样卡</title>
<style>
  :root{
    --paper:#f3ece1;
    --ink:#352c23;
    --muted:#83776a;
    --line:rgba(198,183,160,.72);
    --green:#28875a;
    --green-dark:#1e6d47;
    --brass-1:#e9bd83;
    --brass-2:#c98a49;
    --brass-3:#a2682f;
    --brass-edge:#8d5524;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    display:grid;place-items:center;
    color:var(--ink);
    background:
      radial-gradient(circle at 20% 10%, #fffdf6 0%, transparent 34%),
      radial-gradient(circle at 80% 85%, #cfc2ae 0%, transparent 50%),
      linear-gradient(155deg,#e9dfcf 0%,#d5c8b6 46%,#bfb09d 100%);
    font-family:"PingFang SC","Microsoft YaHei","Source Han Serif SC",serif,sans-serif;
    font-size:14px;
    overflow:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.06;
    background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='180'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3'/%3E%3C/filter%3E%3Crect width='180' height='180' filter='url(%23n)'/%3E%3C/svg%3E");
    mix-blend-mode:multiply;
  }
  .card{
    position:relative;width:500px;border-radius:30px;padding:28px 28px 24px;
    background:
      radial-gradient(circle at 22% 8%, rgba(255,255,255,.98) 0%, transparent 28%),
      linear-gradient(180deg,#fffef9 0%,#f9f1e2 52%,#efe4d0 100%);
    border:1px solid rgba(156,126,88,.86);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.95),
      inset 0 -1px 0 rgba(151,126,92,.14),
      0 1px 0 rgba(255,255,255,.55),
      0 3px 9px rgba(74,58,38,.12),0 28px 54px rgba(64,48,28,.24),0 48px 78px rgba(52,38,20,.18);
    transform:rotateX(1deg) rotateY(-1deg);
    transform-style:preserve-3d;
    transition:transform .28s ease,box-shadow .28s ease;
    animation:arrive .65s cubic-bezier(.2,.75,.25,1) both;
  }
  .card:hover{
    transform:rotateX(0deg) rotateY(0deg) translateY(-4px);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.95),
      inset 0 -1px 0 rgba(151,126,92,.14),
      0 2px 0 rgba(255,255,255,.5),
      0 7px 16px rgba(74,58,38,.13),0 36px 66px rgba(56,42,24,.28),0 62px 92px rgba(45,32,17,.21);
  }
  .card::before{
    content:"";position:absolute;inset:9px;border-radius:22px;
    border:1px solid rgba(255,255,255,.68);
    box-shadow:0 0 0 1px rgba(173,149,116,.10),inset 0 0 18px rgba(220,193,154,.08);
    pointer-events:none;
  }
  .card::after{
    content:"";position:absolute;inset:0;border-radius:30px;pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='160'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3'/%3E%3C/filter%3E%3Crect width='160' height='160' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity:.035;mix-blend-mode:multiply;
  }
  .rivet{position:absolute;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #f7e2ae 0%, #cf994c 46%, #7b4d17 100%);box-shadow:inset 0 1px 1px rgba(255,255,255,.75),inset 0 -2px 2px rgba(67,38,8,.45),0 2px 4px rgba(66,46,22,.45);}
  .rivet:before{content:"";position:absolute;left:5px;top:2px;width:2px;height:2px;border-radius:50%;background:rgba(255,255,255,.8);filter:blur(.5px);}
  .r1{left:18px;top:18px}.r2{right:18px;top:18px}.r3{left:18px;bottom:18px}.r4{right:18px;bottom:18px}
  .top{display:flex;align-items:center;gap:18px}
  .medal{position:relative;flex:none;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#f6cf94 0%,#ce8d41 48%,#8b541c 100%);border:1px solid #7a4815;box-shadow:inset 0 1px 0 rgba(255,246,224,.8),inset 0 -3px 5px rgba(75,42,10,.32),0 5px 14px rgba(101,61,20,.36);transform:translateZ(12px);}
  .medal:before{content:"";position:absolute;inset:8px;border-radius:50%;background:linear-gradient(180deg,#fffcf3,#efe1ca);border:1px solid rgba(136,99,52,.62);box-shadow:inset 0 3px 6px rgba(102,76,43,.22),inset 0 -1px 0 rgba(255,255,255,.8);}
  .medal:after{content:"";position:absolute;inset:16px;border-radius:50%;border:1px dashed rgba(166,120,68,.42);}
  .leaf{position:relative;z-index:1;width:31px;height:31px;color:#1f6b44;filter:drop-shadow(0 1px 0 rgba(255,255,255,.85));}
  .meta{flex:1;min-width:0}
  .kind{display:flex;align-items:center;gap:8px;color:#6f5f49;font-size:12px;font-weight:800;letter-spacing:.22em;text-shadow:0 1px 0 rgba(255,255,255,.85);}
  .kind:before{content:"";width:18px;height:1px;background:linear-gradient(90deg,rgba(158,132,92,.1),rgba(158,132,92,.65));}
  h1{margin:7px 0 5px;font-size:34px;line-height:1;font-weight:800;letter-spacing:.02em;color:#211811;text-shadow:0 1px 0 rgba(255,255,255,.88),0 2px 3px rgba(125,100,68,.18);}
  .code-row{display:flex;align-items:center;gap:8px}
  .code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;font-weight:700;color:#917e63;letter-spacing:.16em;padding:3px 8px;border-radius:6px;background:linear-gradient(180deg,#fffbf2,#f2e9d9);border:1px solid rgba(193,173,142,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 1px 1px rgba(107,82,51,.08);}
  .sub{color:#8b7e6d;font-size:12px}
  .status{flex:none;display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:999px;color:#1d5c3b;font-size:12px;font-weight:900;background:linear-gradient(180deg,#fbfefb,#e4f0e3);border:1px solid rgba(110,154,121,.9);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(155,193,160,.2),0 2px 5px rgba(89,127,99,.13);transform:translateZ(6px);}
  .led{width:8px;height:8px;border-radius:50%;position:relative;background:radial-gradient(circle at 32% 28%,#a4f3bd 0%,#47bd7d 58%,#218356 100%);box-shadow:inset 0 -1px 1px rgba(10,66,39,.35),0 0 0 1px rgba(255,255,255,.48),0 0 8px rgba(59,176,110,.55);}
  .led:after{content:"";position:absolute;left:2px;top:1px;width:2px;height:2px;border-radius:50%;background:rgba(255,255,255,.92);filter:blur(.4px);}
  .groove{position:relative;height:3px;margin:24px -4px 22px;border-radius:99px;background:linear-gradient(180deg,rgba(168,146,113,.24),rgba(255,255,255,.82));box-shadow:0 -1px 0 rgba(154,129,95,.12);}
  .groove:before,.groove:after{content:"";position:absolute;left:12%;right:12%;height:1px;border-radius:99px}
  .groove:before{top:0;background:linear-gradient(90deg,transparent,rgba(151,126,92,.35),transparent)}
  .groove:after{bottom:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent)}
  .tray-label{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
  .tray-title{font-size:13px;font-weight:800;color:#6a5c49;letter-spacing:.1em;text-shadow:0 1px 0 rgba(255,255,255,.85)}
  .tray-count{font-size:12px;color:#8d7f6c;font-variant-numeric:tabular-nums}
  .tray{position:relative;padding:13px;border-radius:18px;background:linear-gradient(180deg,#e4d5bd 0%,#f0e4cd 58%,#fbf5e7 100%);border:1px solid rgba(166,135,90,.8);box-shadow:inset 0 5px 9px rgba(103,79,49,.24),inset 0 -1px 0 rgba(255,255,255,.72),0 1px 0 rgba(255,255,255,.7);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;}
  .chip{position:relative;height:38px;padding:0 9px;border-radius:11px;display:flex;align-items:center;justify-content:center;gap:6px;color:#4c3a27;font-size:13px;font-weight:800;background:linear-gradient(180deg,#fffdf6 0%,#f7ecd8 100%);border:1px solid rgba(178,142,94,.85);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 2px 3px rgba(100,75,46,.18),0 5px 10px rgba(100,75,46,.1);cursor:pointer;transition:transform .12s ease,box-shadow .12s ease,color .12s ease;-webkit-tap-highlight-color:transparent;}
  .chip:before{content:"";width:6px;height:6px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#ffdfad,#dc934c 58%,#8e551e);box-shadow:inset 0 -1px 1px rgba(64,35,7,.35),0 0 0 1px rgba(255,255,255,.5);}
  .chip:hover{transform:translateY(-1px);color:#3f3121}
  .chip:active,.chip.pressed{transform:translateY(1px);color:#7d3c10;background:linear-gradient(180deg,#f3e3cf,#fbeedd);box-shadow:inset 0 2px 4px rgba(119,82,45,.22),inset 0 1px 0 rgba(255,255,255,.5);}
  .chip:focus-visible{outline:2px solid #b08652;outline-offset:2px}
  .foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px;padding-top:16px;position:relative;}
  .foot:before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(183,160,125,.5),transparent);}
  .foot:after{content:"";position:absolute;top:1px;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.72),transparent);}
  .stats{color:#6c5d49;font-size:12px;display:flex;align-items:center;gap:10px}
  .stats b{color:#342718;font-weight:900;font-variant-numeric:tabular-nums}
  .stats .split{width:1px;height:12px;background:rgba(177,154,121,.35)}
  .action{position:relative;height:38px;padding:0 16px 0 13px;border-radius:11px;display:inline-flex;align-items:center;gap:7px;color:#7c3603;font-size:13px;font-weight:900;background:linear-gradient(180deg,#fff0d5 0%,#fdc788 100%);border:1px solid #b96f24;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -2px 3px rgba(156,82,21,.2),0 3px 8px rgba(178,90,20,.28);cursor:pointer;transition:transform .12s ease,box-shadow .12s ease;}
  .action svg{width:15px;height:15px}
  .action:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 3px 8px rgba(193,106,34,.24)}
  .action:active{transform:translateY(1px);box-shadow:inset 0 2px 4px rgba(168,96,35,.22),inset 0 1px 0 rgba(255,255,255,.55)}
  .action:focus-visible{outline:2px solid #b08652;outline-offset:2px}
  @keyframes arrive{from{opacity:0;transform:translateY(14px) rotateX(6deg) rotateY(-4deg)}to{opacity:1;transform:rotateX(1deg) rotateY(-1deg)}}
  @media(max-width:620px){.card{width:min(500px,calc(100vw - 36px));padding:22px}.top{align-items:flex-start}h1{font-size:30px}.tray{grid-template-columns:repeat(2,minmax(0,1fr))}.foot{flex-direction:column;align-items:stretch}.action{justify-content:center}}
  @media(prefers-reduced-motion:reduce){.card,.chip,.action{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <article class="card" aria-label="食材分类卡：蔬菜">
    <span class="rivet r1"></span><span class="rivet r2"></span><span class="rivet r3"></span><span class="rivet r4"></span>
    <div class="top">
      <div class="medal" aria-hidden="true">
        <svg class="leaf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 4C10.5 4 4 9.5 4 17c0 .6 0 1.2.1 1.8C11 20 20 17 20 4z"></path>
          <path d="M4 21c2.8-6.4 7.6-11.2 14-13.5"></path>
        </svg>
      </div>
      <div class="meta">
        <div class="kind">食材分类</div>
        <h1>蔬菜</h1>
        <div class="code-row"><span class="code">VEG</span><span class="sub">叶菜 · 根茎 · 瓜果等</span></div>
      </div>
      <span class="status"><span class="led"></span>启用中</span>
    </div>
    <div class="groove" aria-hidden="true"></div>
    <div>
      <div class="tray-label"><span class="tray-title">二级分类</span><span class="tray-count">5 项</span></div>
      <div class="tray">
        <button class="chip" type="button">叶菜</button>
        <button class="chip" type="button">根茎</button>
        <button class="chip" type="button">瓜果</button>
        <button class="chip" type="button">花菜</button>
        <button class="chip" type="button">茄果</button>
        <button class="chip pressed" type="button" aria-pressed="true">全部</button>
      </div>
    </div>
    <div class="foot">
      <div class="stats"><span><b>12</b> 种食材</span><span class="split"></span><span>最近更新 11-22</span></div>
      <button class="action" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        管理分类
      </button>
    </div>
  </article>
</body>
</html>
