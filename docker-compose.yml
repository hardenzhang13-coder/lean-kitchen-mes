services:
  db:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_DATABASE: lean_kms
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${DB_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  # 启动时自动执行迁移和种子（幂等，已有数据不会重复写入）
  migrate:
    build:
      context: .
      target: migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://root:${DB_PASSWORD}@db:3306/lean_kms

  web:
    build:
      context: .
      target: runner
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "80:3000"
    environment:
      DATABASE_URL: mysql://root:${DB_PASSWORD}@db:3306/lean_kms
      SESSION_SECRET: ${SESSION_SECRET}
      QWEN_API_KEY: ${QWEN_API_KEY}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_MODEL: ${QWEN_MODEL:-qwen-vl-max}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_UPLOAD_PRESET: ${CLOUDINARY_UPLOAD_PRESET}

  # 每日 03:00 自动备份，保留 7 天
  backup:
    image: mysql:8.4
    restart: always
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c "while true; do
        f=/backups/lean_kms-$$(date +%Y%m%d_%H%M%S).sql.gz;
        mysqldump -h db -uroot -p$${DB_PASSWORD} --single-transaction --routines --triggers lean_kms | gzip > $$f;
        find /backups -name '*.sql.gz' -mtime +7 -delete;
        echo \"[backup] $$f done\";
        sleep 86400;
      done"

volumes:
  mysqldata:
